format: protocol/1

protocol:
  id: sdc.direction
  revision: 4
  description: >-
    Fix the project context, the vision and the roadmap (docs/phases.md steps 4 to 6). Every
    project context default (audience, source and target language, platform and operating systems,
    kind of thing, deployment and licence) is recorded as an assumption and checked; the context,
    the vision and the roadmap are each approved by a person. An approval is a record bound to the
    revision it approved, produced only by an action that needs the authority owner.approve. A
    revised requirements list invalidates the context check; a revised vision invalidates the
    roadmap approval. The case ends passed once the roadmap is approved; nothing about epics or
    specifications happens before that. Late findings (docs/trial-2.md, "The late-finding loop"): the context check
    also runs the consistency rules of the context against the requirements list and reads the
    open findings, and is not valid while one is open; no vision or roadmap is written or approved
    then. amend.upstream resolves an open finding by amending the questions and the requirements
    list, which moves the requirements to a new revision, so the context check is observed again.

artifacts:
  requirements:
    description: the requirements list from sdc.intake
  context:
    description: >-
      context.yaml: audience, source and target language, platform and operating systems, kind of
      thing (service, multi-tenant application, CLI, library), deployment and licence, each with
      its status default, accepted or changed
  vision:
    description: the vision document, an AEP vision artifact
  roadmap:
    description: >-
      the roadmap, the outermost planning structure, naming the epics; AEP 0.80.0 has no roadmap
      kind, so it is an AEP initiative
  findings:
    description: >-
      findings.yaml: the typed findings (ambiguity, contradiction, missing decision) any stage
      raised, each citing the items it conflicts with, with its status and its resolution
  questions:
    description: the interview from sdc.intake, amended by resolved findings

evidence_kinds:
  context_defaults:
    description: >-
      the context check: schema-valid, every field present and recorded as an assumption with its
      status, no consistency rule firing between the context and the requirements list, and no
      open finding; its result is valid, invalid or finding
  context_approval:
    description: a person's approval of a context revision; its result is approved
  vision_approval:
    description: a person's approval of a vision revision; its result is approved
  roadmap_validation:
    description: >-
      the result of `aep plan artifact validate` over the store holding the vision and the
      roadmap, valid or invalid
  roadmap_approval:
    description: a person's approval of a roadmap revision; its result is approved

claims:
  context.valid:
    description: the current context is valid, derived from the current requirements list
    true_when:
      evidence:
        kind: context_defaults
        result: valid
        subject: context
  context.approved:
    description: the current context revision is approved
    true_when:
      evidence:
        kind: context_approval
        result: approved
        subject: context
  vision.approved:
    description: the current vision revision is approved
    true_when:
      evidence:
        kind: vision_approval
        result: approved
        subject: vision
  roadmap.valid:
    description: the current roadmap validates in the planning store
    true_when:
      evidence:
        kind: roadmap_validation
        result: valid
        subject: roadmap
  roadmap.approved:
    description: the current roadmap revision is approved, against the current vision revision
    true_when:
      evidence:
        kind: roadmap_approval
        result: approved
        subject: roadmap

obligations:
  context.required:
    description: the context is valid and approved
    discharged_when:
      all:
        - claim: context.valid
        - claim: context.approved
  vision.required:
    description: the vision is approved
    discharged_when:
      claim: vision.approved
  roadmap.required:
    description: the roadmap is valid and approved
    discharged_when:
      all:
        - claim: roadmap.valid
        - claim: roadmap.approved

actions:
  context.default:
    description: >-
      fill every context field from the requirements list or its default, each recorded as an
      assumption; moves the context to a new revision; not once the current context revision is
      approved (a person changes an approved context with context.change)
    effect: write
    precondition:
      all:
        - any:
            - claim: context.approved
              is: "false"
            - claim: context.approved
              is: unknown
        - any:
            - claim: context.valid
              is: "false"
            - claim: context.valid
              is: unknown
  context.change:
    description: change one context assumption; moves the context to a new revision
    effect: write
    arguments:
      type: object
      properties:
        field:
          type: string
          enum: [audience, source_language, target_language, platform, kind, deployment, licence]
        value:
          type: string
          minLength: 1
      required: [field, value]
      additionalProperties: false
  context.check:
    description: check the context
    effect: read
    may_produce:
      - evidence: context_defaults
  context.approve:
    description: a person approves the current context revision
    effect: write
    precondition:
      claim: context.valid
    requires:
      - capability: owner.approve
    may_produce:
      - evidence: context_approval
  vision.write:
    description: >-
      write the vision with `aep plan artifact new vision`; moves the vision to a new revision;
      not once the current vision revision is approved
    effect: write
    precondition:
      all:
        - claim: context.valid
        - claim: context.approved
        - any:
            - claim: vision.approved
              is: "false"
            - claim: vision.approved
              is: unknown
  vision.approve:
    description: a person approves the current vision revision, not while a finding is open
    effect: write
    precondition:
      all:
        - claim: context.valid
        - claim: context.approved
    requires:
      - capability: owner.approve
    may_produce:
      - evidence: vision_approval
  roadmap.write:
    description: >-
      write the roadmap naming its epics; moves the roadmap to a new revision; not once the
      current roadmap revision is approved
    effect: write
    precondition:
      all:
        - claim: context.valid
        - claim: vision.approved
        - any:
            - claim: roadmap.approved
              is: "false"
            - claim: roadmap.approved
              is: unknown
  roadmap.validate:
    description: run aep plan artifact validate
    effect: read
    may_produce:
      - evidence: roadmap_validation
  roadmap.approve:
    description: a person approves the current roadmap revision, not while a finding is open
    effect: write
    precondition:
      all:
        - claim: context.valid
        - claim: vision.approved
        - claim: roadmap.valid
    requires:
      - capability: owner.approve
    may_produce:
      - evidence: roadmap_approval
  amend.upstream:
    description: >-
      resolve the open findings while the context check is not valid: a finding that changes no
      scope takes its default decision (an agent, recorded as an assumption with its reason), a
      scope-changing one waits for a person's decision; the decision amends the questions and the
      requirements list (new revisions), and a vision that cites an amended requirement is set
      aside, so Canon re-derives the context check, the vision and the roadmap approval
    effect: write
    precondition:
      claim: context.valid
      is: "false"

outcomes:
  passed:
    description: the context, the vision and the roadmap are valid and approved
    requires:
      all:
        - claim: context.valid
        - claim: context.approved
        - claim: vision.approved
        - claim: roadmap.valid
        - claim: roadmap.approved

invalidation:
  requirements.revised:
    description: a context check observed against an earlier requirements list no longer applies
    upstream: requirements
    invalidates:
      - context.valid
  vision.revised:
    description: a roadmap approval given against an earlier vision revision no longer applies
    upstream: vision
    invalidates:
      - roadmap.approved
