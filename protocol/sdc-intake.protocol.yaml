format: protocol/1
protocol:
  id: sdc.intake
  revision: 6
  description: >-
    Turn an idea into a requirements list (docs/phases.md steps 1 to 3). The idea record is checked against its schema; the idea is dissected into typed items (fact, wish, belief, unknown, ambiguity, dark spot), each citing its span of the idea; every open item becomes an interview question with a default answer, accepted as is or changed, every scope-changing one through the action scope.answer, which needs the capability scope.answer (the runtime grants it per autonomy level: a person at A0 to A2, a decider at A3 and up); the answers are normalised into a requirements list. Every result is a program's exit status, never an LLM's word. A revised dissection invalidates the interview check, a revised interview the requirements check. A revised idea opens a new intake case (the root's intake.open is bound to the idea revision), so this case declares no invalidation from the idea. The case ends passed; abandoning the idea is the root case's decision. Late findings (docs/trial-2.md, "The late-finding loop"): the requirements check also reads the open findings and is not valid while one is open; amend.upstream resolves them by amending the questions and the requirements list.
artifacts:
  idea:
    description: idea.yaml, an sdc.intake.Idea instance; its revision is the file's sha256
  dissection:
    description: >-
      dissection.yaml, the idea's typed items: fact, wish, belief, unknown, ambiguity, dark spot
  questions:
    description: >-
      questions.yaml, the interview: one question per open item, each with a default answer and its answer, accepted or changed
  requirements:
    description: >-
      requirements.yaml, the structural, product-level list of what should be built, each entry citing a fact, a wish or an answer
  findings:
    description: >-
      findings.yaml: the typed findings (ambiguity, contradiction, missing decision) any stage raised, each citing the items it conflicts with, with its status and its resolution
evidence_kinds:
  idea_shape:
    description: >-
      `ess generate schema validate` over idea.yaml; its result is valid or invalid
  dissection_shape:
    description: >-
      the dissection check: schema-valid, every item one of the six types, every span a substring of the idea text; its result is valid or invalid
  questions_shape:
    description: >-
      `ess generate schema validate` over questions.yaml, every question with a default answer; its result is valid or invalid
  questions_settled:
    description: >-
      the interview check: every open item (belief, unknown, ambiguity, dark spot) has exactly one question, every question is answered accepted or changed, every scope-changing one through scope.answer (its answered_by names the principal that took that action, never the agent's non-interactive); its result is settled, open or needs_scope_answer
  requirements_shape:
    description: >-
      the requirements check: schema-valid, every requirement cites a fact, a wish or an answer; no open finding; its result is valid, invalid or finding
claims:
  idea.shaped:
    description: the current idea record is a valid sdc.intake.Idea
    true_when:
      evidence:
        kind: idea_shape
        result: valid
        subject: idea
  dissection.valid:
    description: the current dissection is valid, made from the current idea revision
    true_when:
      evidence:
        kind: dissection_shape
        result: valid
        subject: dissection
  questions.shaped:
    description: the current interview is valid, every question with a default answer
    true_when:
      evidence:
        kind: questions_shape
        result: valid
        subject: questions
  questions.settled:
    description: every open item of the current dissection has a settled question
    true_when:
      evidence:
        kind: questions_settled
        result: settled
        subject: questions
  requirements.valid:
    description: the current requirements list is valid, normalised from the current interview
    true_when:
      evidence:
        kind: requirements_shape
        result: valid
        subject: requirements
obligations:
  idea.required:
    description: the idea record is valid
    discharged_when:
      claim: idea.shaped
  dissection.required:
    description: the idea is dissected into typed items
    discharged_when:
      claim: dissection.valid
  interview.required:
    description: every open item is asked and settled
    discharged_when:
      all:
        - claim: questions.shaped
        - claim: questions.settled
  requirements.required:
    description: the requirements list is valid
    discharged_when:
      claim: requirements.valid
actions:
  idea.check:
    description: check idea.yaml against its schema
    effect: read
    may_produce:
      - evidence: idea_shape
  idea.dissect:
    description: >-
      an LLM splits the idea into typed items, each citing its span; moves the dissection to a new revision; not once the current dissection is valid
    effect: write
    precondition:
      all:
        - claim: idea.shaped
        - any:
            - claim: dissection.valid
              is: "false"
            - claim: dissection.valid
              is: unknown
  dissection.check:
    description: check the dissection
    effect: read
    may_produce:
      - evidence: dissection_shape
  questions.write:
    description: >-
      an LLM writes one question per open item, with options and a default answer; moves the questions to a new revision; not once the current interview is valid
    effect: write
    precondition:
      all:
        - claim: dissection.valid
        - any:
            - claim: questions.shaped
              is: "false"
            - claim: questions.shaped
              is: unknown
  questions.answer:
    description: >-
      an agent accepts the default of every question that changes no scope, or changes it; it leaves every scope-changing question open; moves the questions to a new revision; not once the interview is settled
    effect: write
    precondition:
      all:
        - claim: questions.shaped
        - any:
            - claim: questions.settled
              is: "false"
            - claim: questions.settled
              is: unknown
  scope.answer:
    description: >-
      answer the scope-changing questions: the principal holding scope.answer (a person, or a decider at the autonomy levels that grant it) accepts each default or changes it, and its answers are recorded with that principal; moves the questions to a new revision; not once the interview is settled. Admissible on an interview whose shape is not checked yet (r6): the person's own edit of an answer moves the questions to a revision no check has seen, and scope.answer is what takes that edit; questions.check runs on the revision it writes. Not on an interview found invalid.
    effect: write
    precondition:
      all:
        - claim: dissection.valid
        - any:
            - claim: questions.shaped
            - claim: questions.shaped
              is: unknown
        - any:
            - claim: questions.settled
              is: "false"
            - claim: questions.settled
              is: unknown
    requires:
      - capability: scope.answer
  questions.check:
    description: check the interview's shape and whether it is settled
    effect: read
    may_produce:
      - evidence: questions_shape
      - evidence: questions_settled
  requirements.normalise:
    description: >-
      normalise the facts, wishes and answers into the requirements list; moves the requirements to a new revision; not once the current requirements list is valid
    effect: write
    precondition:
      all:
        - claim: questions.settled
        - any:
            - claim: requirements.valid
              is: "false"
            - claim: requirements.valid
              is: unknown
  requirements.check:
    description: check the requirements list
    effect: read
    may_produce:
      - evidence: requirements_shape
  amend.upstream:
    description: >-
      resolve the open findings while the requirements check is not valid: a finding that changes no scope takes its default decision (an agent, recorded as an assumption with its reason), a scope-changing one waits for a person's decision; the decision amends the questions and the requirements list (new revisions)
    effect: write
    precondition:
      all:
        - claim: questions.settled
        - claim: requirements.valid
          is: "false"
outcomes:
  passed:
    description: the idea is dissected, the interview settled and the requirements list valid
    requires:
      all:
        - claim: idea.shaped
        - claim: dissection.valid
        - claim: questions.shaped
        - claim: questions.settled
        - claim: requirements.valid
invalidation:
  dissection.revised:
    description: an interview check observed against an earlier dissection no longer applies
    upstream: dissection
    invalidates:
      - questions.settled
  questions.revised:
    description: a requirements check observed against an earlier interview no longer applies
    upstream: questions
    invalidates:
      - requirements.valid
