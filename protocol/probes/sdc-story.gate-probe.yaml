format: protocol/1
protocol:
  id: sdc.story
  revision: 7
  description: >-
    Deliver one AEP story of an approved ESS specification: implement it against the current specification revision, verify it with the ESS conformance run against the implementation, have it reviewed, once that run passed, by a principal other than its implementer, and merge it once a person with the merge authority approved that change revision. The merge approval is decided once per change revision, approved or rejected; after a rejection change.implement is admissible, and its new change revision leaves the build record, the conformance run, the review and the rejection behind, so they are taken again. The ESS gate must pass on the current specification revision before anything is implemented and for the story to be delivered. A revised specification invalidates the implementation record and the conformance run observed against the earlier revision. The case ends passed (delivered), or dropped on an explicit decision. Late findings (docs/trial-2.md, "The late-finding loop"): the conformance run also reads the open findings and is not passed while one is open; amend.upstream resolves them by amending the questions and the requirements list upstream, and the change is re-derived.
independence_dimensions:
  different_principal:
    description: the producer is another principal than the one who implemented the change
artifacts:
  requirements:
    description: the requirements list from sdc.intake, amended by resolved findings
  findings:
    description: >-
      findings.yaml: the typed findings (ambiguity, contradiction, missing decision) any stage raised, each citing the items it conflicts with, with its status and its resolution
  spec:
    description: the ESS specification; its revision is its spec digest, as in the parent case
  change:
    description: a revision of the code that realizes the story; its revision is the commit
evidence_kinds:
  ess_gate:
    description: >-
      the ESS gate over a specification revision, the four checks run as one program; passed or failed
  implementation_change:
    description: >-
      the record, read from version control, that the change moved to a new revision, with the specification revision it was built against
  conformance_run:
    description: >-
      `ess verify conform run --target <implementation> --strict` of the specification's suite against a change revision; its result is passed, failed, inconclusive or finding (an open finding)
  code_review:
    description: a review of a change revision; its result is approved or rejected
  merge_approval:
    description: >-
      a person's decision to merge a change revision; its result is approved or rejected (the reasons of a rejection are the step's log, handed to change.implement)
  merge_record:
    description: the record that a change revision was merged into the mainline
claims:
  gate.passed:
    description: the ESS gate passes on the current specification revision
    true_when:
      evidence:
        kind: ess_gate
        result: passed
        subject: spec
  gate.checked:
    description: an ESS gate run is recorded about the current specification revision, whatever its result
    true_when:
      evidence:
        kind: ess_gate
        subject: spec
  change.built:
    description: the current change revision was built against the current specification revision
    true_when:
      evidence:
        kind: implementation_change
        subject: change
  tests.pass:
    description: >-
      the conformance run of the current specification passes on the current change revision
    true_when:
      evidence:
        kind: conformance_run
        result: passed
        subject: change
  change.reviewed:
    description: >-
      the current change revision is approved by a reviewer the case lists as another principal than the implementer
    true_when:
      evidence:
        kind: code_review
        result: approved
        subject: change
        independent_on: [different_principal]
  merge.approved:
    description: a person approved merging the current change revision
    true_when:
      evidence:
        kind: merge_approval
        result: approved
        subject: change
  merge.decided:
    description: >-
      a merge decision is recorded about the current change revision, whatever its result
    true_when:
      evidence:
        kind: merge_approval
        subject: change
  change.merged:
    description: the current change revision is merged
    true_when:
      evidence:
        kind: merge_record
        subject: change
  tests.run_recorded:
    description: >-
      a conformance run is recorded about the current change revision, against the current specification revision, whatever its result
    true_when:
      evidence:
        kind: conformance_run
        subject: change
  change.review_recorded:
    description: >-
      a review by a reviewer the case lists as another principal than the implementer is recorded about the current change revision, whatever its result
    true_when:
      evidence:
        kind: code_review
        subject: change
        independent_on: [different_principal]
  probe.gate:
    description: the ESS gate evidence, read directly
    true_when:
      "evidence":
        "kind": "ess_gate"
        "result": "passed"
        "subject": "spec"
obligations:
  gate.required:
    description: the ESS gate passes on the current specification revision
    discharged_when:
      claim: gate.passed
  implementation.required:
    description: the current change was built against the current specification
    discharged_when:
      claim: change.built
  tests.required:
    description: the conformance run passes for the current change and specification
    discharged_when:
      claim: tests.pass
  review.required:
    description: the current change is independently reviewed
    discharged_when:
      claim: change.reviewed
actions:
  spec.gate:
    description: >-
      run the ESS gate over the current specification revision; only while no gate run is recorded about it: a second record with another result would leave gate.passed unknown for good
    effect: read
    precondition:
      claim: gate.checked
      is: unknown
    may_produce:
      - evidence: ess_gate
  change.implement:
    description: >-
      change the code against the current specification revision; moves the change to a new revision, recorded with the specification revision; the writer after a failed conformance run, a rejected review or a rejected merge
    effect: write
    precondition:
      claim: gate.passed
    may_produce:
      - evidence: implementation_change
  tests.run:
    description: >-
      run the specification's conformance suite against the current change revision; only while no run is recorded about it against the current specification revision
    effect: read
    precondition:
      all:
        - claim: change.built
        - claim: tests.run_recorded
          is: unknown
    may_produce:
      - evidence: conformance_run
  change.review:
    description: >-
      review the current change revision once its conformance run passed at that revision (a failed run sends the implementer back before any review); only while no review by a reviewer the case lists as another principal than the implementer is recorded about it (the implementer's own review does not count and does not block)
    effect: read
    precondition:
      all:
        - claim: change.built
        - claim: tests.pass
        - claim: change.review_recorded
          is: unknown
    may_produce:
      - evidence: code_review
  merge.approve:
    description: >-
      a person with the merge authority approves or rejects merging the current change revision, once it has the gate, a current build, a passing conformance run and an independent review; decided once per change revision: only while no merge decision is recorded about it
    effect: write
    precondition:
      all:
        - claim: gate.passed
        - claim: change.built
        - claim: tests.pass
        - claim: change.reviewed
        - claim: merge.decided
          is: unknown
    requires:
      - capability: change.merge
    may_produce:
      - evidence: merge_approval
  change.merge:
    description: >-
      merge the current change revision; needs the gate, a current build, a passing conformance run, an independent review and a person's merge approval of that revision
    effect: write
    precondition:
      all:
        - claim: gate.passed
        - claim: change.built
        - claim: tests.pass
        - claim: change.reviewed
        - claim: merge.approved
    may_produce:
      - evidence: merge_record
  amend.upstream:
    description: >-
      resolve the open findings while the conformance run is not passed: a finding that changes no scope takes its default decision (an agent, recorded as an assumption with its reason), a scope-changing one waits for a person's decision; the decision amends the questions and the requirements list, and the change is marked as derived from an earlier requirements revision (a new revision), so Canon sets aside every record about the old one and the writer re-derives it
    effect: write
    precondition:
      claim: tests.pass
      is: "false"
outcomes:
  passed:
    description: >-
      the current change revision, built against the current specification revision, passes its conformance run, is independently reviewed and merged, and the ESS gate passes
    requires:
      all:
        - claim: gate.passed
        - claim: change.built
        - claim: tests.pass
        - claim: change.reviewed
        - claim: change.merged
  dropped:
    description: the story was explicitly dropped
    requires:
      decision: explicitly_dropped
  probe.passed_without_gate:
    description: passed while the ESS gate evidence is not TRUE
    requires:
      all:
        - all:
            - claim: gate.passed
            - claim: change.built
            - claim: tests.pass
            - claim: change.reviewed
            - claim: change.merged
        - any:
            - claim: probe.gate
              is: "false"
            - claim: probe.gate
              is: unknown
invalidation:
  spec.revised:
    description: >-
      an implementation record or conformance run observed against an earlier specification revision no longer applies; a merge decision needs no entry here: it is bound to the change revision, and change.merge also needs change.built, so the merge waits for a new change revision, which leaves the decision behind (an entry would multiply the state space by 4, past the bound)
    upstream: spec
    invalidates:
      - change.built
      - tests.pass
      - tests.run_recorded
