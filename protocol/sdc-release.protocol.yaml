format: protocol/1

protocol:
  id: sdc.release
  revision: 5
  description: >-
    Publish and watch a delivered release, run alone from a delivered tree; nothing in the
    development cycle opens it. Its input is the delivered tree's work (the specification and the
    release built from the merged changes) and the acceptance record of that tree's sdc.delivery
    case, copied in unchanged by delivery.read. The ESS gate must pass on the current specification
    revision; the release is published on a person's approval and observed running. A revised
    specification sets the copied acceptance record aside. The case ends passed (published and
    observed healthy), rolled back on a complete rollback result, or withheld on an explicit
    decision.

artifacts:
  spec:
    description: the ESS specification; its revision is its spec digest, as in the parent case
  release:
    description: the versioned, deployable unit

evidence_kinds:
  ess_gate:
    description: >-
      the ESS gate over a specification revision, the four checks run as one program; passed or
      failed
  release_conformance:
    description: >-
      the acceptance run of the delivered tree (`ess verify conform run --target <release> --strict`
      against a release revision, recorded by sdc.delivery's acceptance.run), copied unchanged;
      passed, failed or inconclusive
  release_record:
    description: the record that a release revision was published
  health_observation:
    description: >-
      an observation of the running release; its result is healthy or unhealthy, and it applies
      for 30 minutes after it is observed
    max_age: 30m
  rollback_result:
    description: the result of returning to the release before this one; complete or partial

claims:
  gate.passed:
    description: the ESS gate passes on the current specification revision
    true_when:
      evidence:
        kind: ess_gate
        result: passed
        subject: spec
  gate.checked:
    description: an ESS gate run is recorded about the current specification revision, whatever its result
    true_when:
      evidence:
        kind: ess_gate
        subject: spec
  release.accepted:
    description: the conformance suite of the current specification passes on the current release
    true_when:
      evidence:
        kind: release_conformance
        result: passed
        subject: release
  release.acceptance_copied:
    description: >-
      an acceptance record about the current release revision, against the current specification revision, is in this case, whatever its result
    true_when:
      evidence:
        kind: release_conformance
        subject: release
  release.published:
    description: the current release revision is published
    true_when:
      evidence:
        kind: release_record
        subject: release
  release.healthy:
    description: the published release is observed healthy within the last 30 minutes
    true_when:
      evidence:
        kind: health_observation
        result: healthy
        subject: release
  release.observed:
    description: an observation of the current release revision within the last 30 minutes is recorded, whatever its result
    true_when:
      evidence:
        kind: health_observation
        subject: release
  rollback.complete:
    description: a rollback of the current release revision is complete
    true_when:
      evidence:
        kind: rollback_result
        result: complete
        subject: release

obligations:
  gate.required:
    description: the ESS gate passes on the current specification revision
    discharged_when:
      claim: gate.passed
  acceptance.required:
    description: the delivered tree's acceptance run passed on the release
    discharged_when:
      claim: release.accepted
  health.required:
    description: the release is observed healthy
    discharged_when:
      claim: release.healthy

actions:
  spec.gate:
    description: >-
      run the ESS gate over the current specification revision; only while no gate run is recorded
      about it: a second record with another result would leave gate.passed unknown for good
    effect: read
    precondition:
      claim: gate.checked
      is: unknown
    may_produce:
      - evidence: ess_gate
  delivery.read:
    description: >-
      copy the acceptance record of the delivered tree's sdc.delivery case into this case,
      unchanged; it accepts nothing, and the record keeps its producer, its release revision and
      the specification revision it ran against. Only while this case holds no acceptance record
      about the current release revision: a second copy with another result would leave
      release.accepted unknown for good
    effect: read
    precondition:
      claim: release.acceptance_copied
      is: unknown
    may_produce:
      - evidence: release_conformance
  release.publish:
    description: publish and deploy the current release revision; needs a person's approval
    effect: external
    precondition:
      all:
        - claim: gate.passed
        - claim: release.accepted
    requires:
      - capability: release.approve
    may_produce:
      - evidence: release_record
  release.observe:
    description: >-
      observe the running release; only while no observation of the current release revision is
      current (younger than its 30 minutes)
    effect: read
    precondition:
      all:
        - claim: release.published
        - claim: release.observed
          is: unknown
    may_produce:
      - evidence: health_observation
  release.rollback:
    description: return to the previous release; needs the same release authority
    effect: external
    precondition:
      claim: release.published
    requires:
      - capability: release.approve
    may_produce:
      - evidence: rollback_result

outcomes:
  passed:
    description: >-
      the ESS gate passes, and the current release is accepted (the delivered tree's acceptance
      run), published and observed healthy
    requires:
      all:
        - claim: gate.passed
        - claim: release.accepted
        - claim: release.published
        - claim: release.healthy
  rolled_back:
    description: the release was rolled back completely
    requires:
      claim: rollback.complete
  withheld:
    description: the release was explicitly withheld
    requires:
      decision: explicitly_withheld

invalidation:
  spec.revised:
    description: an acceptance record observed against an earlier specification revision no longer applies
    upstream: spec
    invalidates:
      - release.accepted
      - release.acceptance_copied
