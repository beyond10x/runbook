format: protocol/1
protocol:
  id: sdc.epic
  revision: 6
  description: >-
    Deliver one epic of the approved roadmap (docs/phases.md steps 7 to 10). The epic case opens child cases in order, each once every earlier child ended passed: sdc.spec (the ESS specification, authored, reused or reconstructed, until the ESS gate passes), sdc.plan (the AEP stories), one sdc.story case per story (opened together), then sdc.delivery (build the merged changes and run the acceptance suite against the build). No action is admissible before the roadmap is approved, and none after the specification stage before the ESS gate passes on the current specification revision. The case ends passed (delivered and tested) once the delivery case ended passed and the gate still passes, or abandoned on an explicit decision; when a child case ended other than passed it ends not_delivered (a child before the delivery stage) or not_accepted (the delivery stage: the acceptance run failed), without a person. Publishing and operating are not part of the cycle: sdc.release runs alone from a delivered tree and nothing here opens it.
artifacts:
  roadmap:
    description: the roadmap the epic belongs to
  epic:
    description: the AEP epic
  spec:
    description: the epic's ESS specification; its revision is its spec digest
evidence_kinds:
  roadmap_approval:
    description: a person's approval of a roadmap revision; its result is approved
  ess_gate:
    description: >-
      the ESS gate over a specification revision: `ess specify validate --strict-requires`, `ess specify compile`, `ess verify conform synthesize` with 0 refusals and no `UNMAPPED:` marker, run as one program; passed only when all four pass, failed otherwise
  case_outcome:
    description: >-
      the outcome of one child case, one record per child: passed or another outcome of the child's protocol, open while the child runs
  spec_opened:
    description: the record that the specification case was opened for an epic revision
  plan_opened:
    description: the record that the planning case was opened for an epic revision
  stories_opened:
    description: the record that one story case per AEP story was opened for an epic revision
  delivery_opened:
    description: the record that the delivery case was opened for an epic revision
claims:
  roadmap.approved:
    description: the current roadmap revision is approved
    true_when:
      evidence:
        kind: roadmap_approval
        result: approved
        subject: roadmap
  roadmap.copied:
    description: a roadmap approval record about the current roadmap revision is in this case, whatever its result
    true_when:
      evidence:
        kind: roadmap_approval
        subject: roadmap
  gate.passed:
    description: the ESS gate passes on the current specification revision
    true_when:
      evidence:
        kind: ess_gate
        result: passed
        subject: spec
  gate.checked:
    description: an ESS gate run is recorded about the current specification revision, whatever its result
    true_when:
      evidence:
        kind: ess_gate
        subject: spec
  children.passed:
    description: every child case ended passed
    true_when:
      children:
        in: [passed]
  spec.opened:
    description: the specification case was opened for the current epic revision
    true_when:
      evidence:
        kind: spec_opened
        subject: epic
  plan.opened:
    description: the planning case was opened for the current epic revision
    true_when:
      evidence:
        kind: plan_opened
        subject: epic
  stories.opened:
    description: the story cases were opened for the current epic revision
    true_when:
      evidence:
        kind: stories_opened
        subject: epic
  delivery.opened:
    description: the delivery case was opened for the current epic revision
    true_when:
      evidence:
        kind: delivery_opened
        subject: epic
obligations:
  roadmap.required:
    description: the roadmap is approved
    discharged_when:
      claim: roadmap.approved
  gate.required:
    description: the ESS gate passes on the current specification revision
    discharged_when:
      claim: gate.passed
  delivery.required:
    description: the delivery case was opened and every child ended passed
    discharged_when:
      all:
        - claim: delivery.opened
        - claim: children.passed
actions:
  roadmap.read:
    description: >-
      copy the roadmap approval record of the sdc.direction case into this case, unchanged; it approves nothing, and the record keeps the producer and roadmap revision it was approved with. Only while this case holds no roadmap approval record about the current roadmap revision: a second copy with another result would leave roadmap.approved unknown for good. A new roadmap revision sets the old record aside and makes it admissible again
    effect: read
    precondition:
      claim: roadmap.copied
      is: unknown
    may_produce:
      - evidence: roadmap_approval
  spec.open:
    description: open the sdc.spec case for the epic
    effect: write
    precondition:
      all:
        - claim: roadmap.approved
        - claim: spec.opened
          is: unknown
    case_open:
      protocol: sdc.spec
      subject: spec
    may_produce:
      - evidence: spec_opened
  spec.gate:
    description: >-
      run the ESS gate over the current specification revision; only while no gate run is recorded about it: a second record with another result would leave gate.passed unknown for good
    effect: read
    precondition:
      all:
        - claim: roadmap.approved
        - claim: gate.checked
          is: unknown
    may_produce:
      - evidence: ess_gate
  plan.open:
    description: open the sdc.plan case once the specification case ended passed
    effect: write
    precondition:
      all:
        - claim: roadmap.approved
        - claim: gate.passed
        - claim: spec.opened
        - claim: children.passed
        - claim: plan.opened
          is: unknown
    case_open:
      protocol: sdc.plan
      subject: epic
    may_produce:
      - evidence: plan_opened
  stories.open:
    description: open one sdc.story case per AEP story, once the planning case ended passed
    effect: write
    precondition:
      all:
        - claim: roadmap.approved
        - claim: gate.passed
        - claim: plan.opened
        - claim: children.passed
        - claim: stories.opened
          is: unknown
    case_open:
      protocol: sdc.story
      subject: spec
    may_produce:
      - evidence: stories_opened
    arguments:
      type: object
      properties:
        stories:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      required: [stories]
      additionalProperties: false
  delivery.open:
    description: open the sdc.delivery case once every story case ended passed (every story merged)
    effect: write
    precondition:
      all:
        - claim: roadmap.approved
        - claim: gate.passed
        - claim: stories.opened
        - claim: children.passed
        - claim: delivery.opened
          is: unknown
    case_open:
      protocol: sdc.delivery
      subject: epic
    may_produce:
      - evidence: delivery_opened
outcomes:
  passed:
    description: >-
      delivered and tested: the delivery case was opened, every child ended passed (every story merged, the release built and accepted), and the ESS gate passes on the current specification revision
    requires:
      all:
        - claim: roadmap.approved
        - claim: gate.passed
        - claim: delivery.opened
        - claim: children.passed
  abandoned:
    description: the epic was explicitly abandoned
    requires:
      decision: explicitly_abandoned
  not_delivered:
    description: >-
      a child case opened before the delivery stage ended other than passed (the specification
      abandoned, a story dropped); the children form keeps that outcome for every later revision,
      so the case ends here, and the root case ends not_delivered with it
    requires:
      all:
        - claim: children.passed
          is: "false"
        - claim: delivery.opened
          is: unknown
  not_accepted:
    description: >-
      the delivery case ended other than passed: the acceptance run of the specification's suite
      failed on the release built from the merged changes. The delivery case is opened only once
      every earlier child passed, so the delivery stage is the child that failed; the case ends
      here, and the root case ends not_delivered with it
    requires:
      all:
        - claim: children.passed
          is: "false"
        - claim: delivery.opened
