<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runbook run inspector · Canon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preload" href="fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
// The phone layout is for a phone, not for a narrow desktop window: a small screen, or a touch screen up
// to tablet width. This is its one definition: html.phone switches the phone rules of style.css on, and
// app.js reads SDC_PHONE.
window.SDC_PHONE = '(max-width: 600px), (max-width: 900px) and (pointer: coarse)';
{ const m = matchMedia(window.SDC_PHONE), set = () => document.documentElement.classList.toggle('phone', m.matches); set(); m.addEventListener('change', set); }
try { if ((localStorage.getItem('sdc-ui.panel') === 'open' && !matchMedia(window.SDC_PHONE).matches) || /[?&](tab|node)=/.test(location.search)) document.documentElement.classList.add('rp-open'); } catch {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 12 2l8 4.5v11L12 22l-8-4.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 9.5 12 7.3l4 2.2v5L12 16.7l-4-2.2z" fill="currentColor" opacity=".9"/></svg>
    <span class="bt">Runbook Inspector</span><span class="bm" id="mode" title="watch: this page only reads">watch</span><span class="bs" id="tagline" title="Canon decides · the driver records · this page only reads">Canon decides · the driver records · this page only reads</span></div>
  <div class="hctl">
    <div class="selectw picker" id="picker"><span id="pk-lab">Run</span><button id="runpick" type="button" class="pk-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="pk-panel"></button>
      <div id="pk-panel" class="pk-panel" role="dialog" aria-label="Choose a run" hidden>
        <div class="pk-top"><input id="pk-q" type="search" role="combobox" aria-expanded="true" aria-controls="pk-list" aria-autocomplete="list" aria-label="Search runs by name, state, outcome, stop cause or model" placeholder="Search: name, model, outcome, stop cause" autocomplete="off" spellcheck="false"><button id="pk-close" type="button" class="ib" aria-label="Close the run list">Close</button></div>
        <div id="pk-list" role="listbox" aria-label="Runs"></div><div id="pk-none"></div><button id="pk-stubs" type="button" class="pk-more" aria-controls="pk-list" hidden></button>
      </div>
    </div><span id="runmark"></span>
    <label class="switch" title="select the case that moved last"><input type="checkbox" id="follow" checked><span class="sw"></span><span class="swl">Follow active case</span></label>
    <button id="decbtn" class="decbtn" title="pending person decisions"><span>Decisions</span><b id="deccount">0</b></button>
    <span id="live" class="live connecting"><i></i><span>Connecting</span></span>
  </div>
  <div id="nowbar" role="group" aria-label="Run state and current step"></div><button id="railbtn" aria-controls="right" title="the panel: Explain, Autonomy, Security, Metrics, Changes, Products, Events, Run log">Details</button>

</header>
<section id="kpis" aria-label="Run KPIs"></section>
<section id="now" aria-label="What runs now" aria-live="polite"></section>
<section id="view-note" aria-label="Runbook view" role="note"></section>
<section id="product" aria-label="Product of the run" hidden></section>
<section id="phases" aria-label="Runbook phases"></section>
<main>
  <aside id="left">
    <div class="ph">Case tree</div>
    <div id="tree" tabindex="0" role="region" aria-label="Case tree"></div>
    <section id="feed" aria-label="What changed"></section>
  </aside>
  <section id="center">
    <div class="gbar">
      <div id="gtitle"></div>
      <div class="gtools">
        <span class="legend"><span><i class="lg c-true"></i>TRUE</span><span><i class="lg c-false"></i>FALSE</span><span><i class="lg c-unknown"></i>UNKNOWN</span><span class="sep"></span><span><i class="lg c-adm"></i>admissible</span><span><i class="lg c-appr"></i>needs approval</span><span><i class="lg c-blk"></i>blocked</span><span class="sep"></span><span><i class="lg c-llm"></i>LLM</span><span id="lg-person"><i class="lg c-person"></i>person</span><span><i class="lg c-prog"></i>program</span></span>
        <label class="switch" title="draw the claims each action reads (its precondition) and the invalidation edges"><input type="checkbox" id="reads"><span class="sw"></span>Reads</label>
        <span class="zoom"><button id="zout" class="ib" title="zoom out">−</button><button id="zfit" class="ib wide" title="fit width">Fit</button><button id="zin" class="ib" title="zoom in">+</button></span>
      </div>
    </div>
    <div id="graph"></div>
    <div id="dsteps" role="region" aria-label="Steps of the run" tabindex="0" hidden><div id="dhead"></div><div id="dlist"></div></div>
    <p id="ghint" class="ghint" data-ux="hint" hidden>The graph is wider than the screen: drag sideways inside it to see every column.</p>
    <div id="timeline"></div>
  </section>
  <aside id="right">
    <nav id="tabs">
      <button data-tab="explain">Explain</button><button data-tab="autonomy">Autonomy</button><button data-tab="security">Security</button><button data-tab="metrics">Metrics</button><button data-tab="changes">Changes</button><button data-tab="products">Products</button><button data-tab="events">Events</button><button data-tab="run">Run log</button><button id="rpclose" class="rp-x" title="collapse the panel" aria-label="collapse the panel"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
    <div id="panel"></div>
  </aside>
</main>
<div id="scrim"></div><aside id="drawer" aria-label="Decisions"></aside>
<dialog id="modal"><form method="dialog"><div class="mh"><h3></h3><button class="ib wide">Close</button></div><pre></pre></form></dialog>
<dialog id="diffdlg" aria-label="File change"><div class="dwrap"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
