          description: 'Every row of `sdc.daemon.RunsOfSession`, a projection of `sdc.daemon.Run`. Contains the instances where `session_id == param.session_id` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.RunsOfSession.Response'
  /daemon/views/runs-of-session-in-state:
    get:
      operationId: sdc.daemon.RunsOfSessionInState
      summary: Runs of a session in a state
      tags:
      - daemon
      x-ess-consistency: read_your_writes
      parameters:
      - name: session_id
        in: query
        description: Read by the view's filter as `param.session_id`; it selects which rows the view holds.
        required: true
        schema:
          $ref: '#/components/schemas/sdc.daemon.SessionId'
      - name: state
        in: query
        description: Read by the view's filter as `param.state`; it selects which rows the view holds.
        required: true
        schema:
          $ref: '#/components/schemas/sdc.daemon.Run.State'
      responses:
        '200':
          description: 'Every row of `sdc.daemon.RunsOfSessionInState`, a projection of `sdc.daemon.Run`. Contains the instances where `(session_id == param.session_id and state == param.state)` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.RunsOfSessionInState.Response'
  /daemon/views/session-events:
    get:
      operationId: sdc.daemon.EventsOfSessionAfter
      summary: Events of a session after a position
      description: 'The events of every run of one session with a position above `after_position`, in position order: the page the session''s event stream serves (GET /daemon/views/session-events?session_id=... with `Accept: text/event-stream`, same SSE rules as EventsAfter; the SSE id is the position, so the interleaving of the session''s runs is the daemon''s order). Outside the language: SSE itself.'
      tags:
      - daemon
      x-ess-consistency: read_your_writes
      parameters:
      - name: session_id
        in: query
        description: Read by the view's filter as `param.session_id`; it selects which rows the view holds.
        required: true
        schema:
          $ref: '#/components/schemas/sdc.daemon.SessionId'
      - name: after_position
        in: query
        description: Read by the view's filter as `param.after_position`; it selects which rows the view holds.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 'Every row of `sdc.daemon.EventsOfSessionAfter`, a projection of `sdc.daemon.RunEvent`. Contains the instances where `(session_id == param.session_id and position > param.after_position)` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.EventsOfSessionAfter.Response'
  /daemon/views/sessions:
    get:
      operationId: sdc.daemon.Sessions
      summary: Sessions
      tags:
      - daemon
      x-ess-consistency: read_your_writes
      responses:
        '200':
          description: 'Every row of `sdc.daemon.Sessions`, a projection of `sdc.daemon.Session`. Contains every instance. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.Sessions.Response'
components:
  schemas:
    sdc.daemon.AnswerDecision.Input:
      title: Answer a decision input
      description: 'A client answers an Open decision request of a run that waits. An answer to a request that is already answered is refused: the first answer stands. An answer to a withdrawn request (its run was cancelled or ended as orphaned) is refused as DecisionWithdrawn. When the answer stands but the runtime cannot take it up (its run is gone), the daemon writes the run event `runbook.answer-undeliverable` (record: request_id) after the request is Answered (see CancelRun for why it is stated here).'
      x-ess-name: sdc.daemon.AnswerDecision
      x-ess-kind: command-input
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        request_id:
          $ref: '#/components/schemas/sdc.daemon.DecisionRequestId'
        answer:
          type: string
        answered_by:
          $ref: '#/components/schemas/sdc.daemon.AnswererLabel'
        principal:
          $ref: '#/components/schemas/sdc.decision.Principal'
          description: The daemon's own principal (runbook serve --principal). The handler fills it from the daemon's configuration; a client never sends it, no HTTP body member or MCP argument sets it, and the HTTP/MCP schema of the client's input has no such member.
        answer_offered:
          description: 'Whether the request takes the answer: false only for an Open request of the named run, while that run is WaitingOnDecision, that carries an artifact (DecisionArtifact), when the answer is neither the letter of one of its options, alone or followed by a colon and text, nor a free answer of a request that takes one. The handler fills it from the request, because the language cannot read the text of an answer; a client never sends it.'
          type: boolean
        at:
          type: string
          format: date-time
      required:
      - run_id
      - request_id
      - answer
      - answered_by
      - principal
      - answer_offered
      - at
      additionalProperties: false
    sdc.daemon.AnswerDecision.already-answered.Response:
      additionalProperties: false
      description: 'The request is already Answered. Checked before the run''s own state: a second answer to the only open request of a run that has resumed or ended is this refusal and not RunNotWaiting. Taken when the subject is in a state none of this command''s declared moves start from. Which states those are is the lifecycle''s answer, not this command''s.'
      properties:
        error:
          const: sdc.daemon.DecisionAlreadyAnswered
          description: 'The decision request is already Answered: the first answer stands and nothing changed.'
          type: string
        outcome:
          const: already-answered
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.DecisionAlreadyAnswered.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.answered.Response:
      additionalProperties: false
      description: The request is Answered, with the label the client gave (answered_by) and the daemon's principal (principal); the runtime is given the principal and never the label, takes the answer up and reports ResumeRun. Taken when no other outcome's condition matched. A `sdc.daemon.DecisionRequest` has moved to `Answered`, along `answer`. The instance is the one `request_id` names. Emits `DecisionAnswered`, listed under `published`. `DecisionAnswered` is not published and stays inside the component.
      properties:
        outcome:
          const: answered
          description: Which declared outcome the command took.
        published:
          description: 'Every event this branch emitted, in the order it emits them: its qualified name and its payload. `sdc.daemon.DecisionAnswered` is listed too, although this component does not publish it to consumers.'
          items: false
          maxItems: 1
          minItems: 1
          prefixItems:
          - additionalProperties: false
            properties:
              event:
                const: sdc.daemon.DecisionAnswered
                type: string
              payload:
                $ref: '#/components/schemas/sdc.daemon.DecisionAnswered.Event'
            required:
            - event
            - payload
            type: object
          type: array
      required:
      - outcome
      - published
      type: object
    sdc.daemon.AnswerDecision.no-request.Response:
      additionalProperties: false
      description: No decision request has this id. Taken when the request names an identity no record carries.
      properties:
        error:
          const: sdc.daemon.NoSuchDecisionRequest
          description: No decision request has this id.
          type: string
        outcome:
          const: no-request
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.NoSuchDecisionRequest.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.no-run.Response:
      additionalProperties: false
      description: No run has this id. Taken when no `sdc.daemon.Run` carries the identity `input.run_id` names.
      properties:
        error:
          const: sdc.daemon.NoSuchRun
          description: No run has this id.
          type: string
        outcome:
          const: no-run
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.NoSuchRun.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.not-of-run.Response:
      additionalProperties: false
      description: The request belongs to another run than the one named. Taken when the existing subject's stored fields satisfy `run_id != input.run_id`.
      properties:
        error:
          const: sdc.daemon.DecisionNotOfRun
          description: The decision request belongs to another run than the one named; nothing changed.
          type: string
        outcome:
          const: not-of-run
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.DecisionNotOfRun.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.run-not-waiting.Response:
      additionalProperties: false
      description: 'The request is Open and its run is not WaitingOnDecision, so nothing is waiting for an answer. The daemon''s own commands never leave that state (a cancel or an orphan end withdraws the run''s Open requests in the same step, and a resume needs none Open): the guard holds for a record the daemon did not write. Taken when the `sdc.daemon.Run` that `input.run_id` names exists and its stored fields satisfy `state != WaitingOnDecision`.'
      properties:
        error:
          const: sdc.daemon.RunNotWaiting
          description: 'The run is not WaitingOnDecision: it takes no decision request and no answer; nothing changed.'
          type: string
        outcome:
          const: run-not-waiting
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.RunNotWaiting.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.unknown-option.Response:
      additionalProperties: false
      description: 'The request was read from its case and the answer names none of its options: nothing was committed and the runtime was handed nothing; the request stays Open. Declared first because it reads the input only; the handler fills answer_offered false only where every other refusal below does not hold, so a client meets it after the request''s state and the run''s. Taken when `answer_offered == false` holds of the input.'
      properties:
        error:
          const: sdc.daemon.UnknownOption
          description: 'The answer names none of the options of a request read from its case (and the request takes no free answer): the request stays Open and nothing was handed to the runtime.'
          type: string
        outcome:
          const: unknown-option
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.UnknownOption.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswerDecision.withdrawn.Response:
      additionalProperties: false
      description: 'The request was withdrawn (its run was cancelled or ended as orphaned, or the runtime withdrew it): it takes no answer. Checked before the run''s own state, so the answer names the request and not the run: an answer to a request of a cancelled run is this refusal. Taken when the existing subject''s stored fields satisfy `state == Withdrawn`.'
      properties:
        error:
          const: sdc.daemon.DecisionWithdrawn
          description: 'The decision request was withdrawn (its run was cancelled or ended as orphaned, which withdraws the run''s Open requests itself, or the runtime withdrew it): it takes no answer; nothing changed.'
          type: string
        outcome:
          const: withdrawn
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.DecisionWithdrawn.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.AnswererLabel:
      title: AnswererLabel
      description: 'The name a client gives when it answers a decision (the answered_by of AnswerDecision): ASCII text without control characters, at most 200 characters. The daemon trims it of ASCII whitespace and refuses (400) a longer one, one that holds a non-ASCII or a control character, and one whose lower case starts with `rule:`, `decider:` or `router:`, the names it keeps for the answers of a rule, a decider and a router. It is stored and shown trimmed and is never the principal: the principal of an answer is the daemon''s own (runbook serve --principal), fixed when the daemon starts, and a label a client types grants nothing.'
      x-ess-name: sdc.daemon.AnswererLabel
      x-ess-kind: newtype
      type: string
      maxLength: 200
      x-ess-invariants:
      - value.count <= 200
    sdc.daemon.BelowConfinementFloor.Error:
      title: BelowConfinementFloor payload
      description: The requested confinement is below the daemon's floor; the run was not submitted.
      x-ess-name: sdc.daemon.BelowConfinementFloor
      x-ess-kind: error-payload
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        confinement:
          $ref: '#/components/schemas/sdc.daemon.ConfinementLevel'
      required:
      - run_id
      - confinement
      additionalProperties: false
    sdc.daemon.CancelRun.Input:
      title: Cancel a run input
      description: 'Cancel a run that has not ended: Submitted, WaitingForRoute, Running or WaitingOnDecision. The daemon stops the run in the runtime; a run that ended, was cancelled or failed to start is refused. In the same step the run''s Open decision requests move to Withdrawn (the outcome''s `affects` entry): no WithdrawDecision follows, and an answer to such a request is refused as DecisionWithdrawn. The daemon also writes the run event `runbook.cancel-requested` (an event of the daemon''s own, see SubmitRun) just before the run is Cancelled; the language cannot write a RunEvent from this command (an outcome creates or moves rows of one entity and its `affects` entries move rows, they do not create them), so the event is stated here and read through the event views only.'
      x-ess-name: sdc.daemon.CancelRun
      x-ess-kind: command-input
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        at:
          type: string
          format: date-time
      required:
      - run_id
      - at
      additionalProperties: false
    sdc.daemon.CancelRun.already-ended.Response:
      additionalProperties: false
      description: The run is Ended, Cancelled or FailedToStart. Taken when the subject is in a state none of this command's declared moves start from. Which states those are is the lifecycle's answer, not this command's.
      properties:
        error:
          const: sdc.daemon.RunAlreadyEnded
          description: 'The run has ended, was cancelled or failed to start: there is nothing left to cancel.'
          type: string
        outcome:
          const: already-ended
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.RunAlreadyEnded.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.CancelRun.cancelled.Response:
      additionalProperties: false
      description: 'The run is Cancelled and every Open decision request of it is Withdrawn. The outcome publishes RunCancelled only: a request withdrawn this way publishes no DecisionRequestWithdrawn (that event belongs to WithdrawDecision). Taken when no other outcome''s condition matched. A `sdc.daemon.Run` has moved to `Cancelled`, along `cancel`. The instance is the one `run_id` names. Emits `RunCancelled`, listed under `published`. `RunCancelled` is not published and stays inside the component.'
      properties:
        outcome:
          const: cancelled
          description: Which declared outcome the command took.
        published:
          description: 'Every event this branch emitted, in the order it emits them: its qualified name and its payload. `sdc.daemon.RunCancelled` is listed too, although this component does not publish it to consumers.'
          items: false
          maxItems: 1
          minItems: 1
          prefixItems:
          - additionalProperties: false
            properties:
              event:
                const: sdc.daemon.RunCancelled
                type: string
              payload:
                $ref: '#/components/schemas/sdc.daemon.RunCancelled.Event'
            required:
            - event
            - payload
            type: object
          type: array
      required:
      - outcome
      - published
      type: object
    sdc.daemon.CancelRun.no-run.Response:
      additionalProperties: false
      description: No run has this id. Taken when the request names an identity no record carries.
      properties:
        error:
          const: sdc.daemon.NoSuchRun
          description: No run has this id.
          type: string
        outcome:
          const: no-run
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.NoSuchRun.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.CaseState:
      title: CaseState
      description: 'Where a case stands as the daemon reads its run''s tree: Ended when it has an outcome; else AwaitingPerson or AwaitingAuthority when its last stop waits on that and the run waits on a decision; else Stuck when its last stop is Stuck or BudgetSpent and the run ended by its tree (Ended and not orphaned; a wait or a cancel that ended with the run, or an orphaned run, leaves it Open); else Running when the run''s step in flight names the case; else Open. A type and not a lifecycle: no command moves a case, the daemon reads where it stands.'
      x-ess-name: sdc.daemon.CaseState
      x-ess-kind: enum
      type: string
      enum:
      - Open
      - Running
      - AwaitingPerson
      - AwaitingAuthority
      - Stuck
      - Ended
    sdc.daemon.CasesOfRun.Response:
      additionalProperties: false
      description: The rows of `sdc.daemon.CasesOfRun`.
      properties:
        rows:
          description: Every row the projection holds, in the order it holds them.
          items:
            $ref: '#/components/schemas/sdc.daemon.CasesOfRun.Row'
          type: array
      required:
      - rows
      type: object
    sdc.daemon.CasesOfRun.Row:
      title: Cases of a run row
      description: 'The case tree of a run, a row per case in the order the runtime''s tree lists them: GET /daemon/views/cases?run_id=... A row names the case, its parent, its link name, its protocol, its state and its outcome; no path. A run of the stub runtime has no case. A view has no outcome in the language, so the refusal is the daemon''s {refused, message} answer: 404 `no such run` for a run id the daemon does not know.'
      x-ess-name: sdc.daemon.CasesOfRun
      x-ess-kind: view-row
      type: object
      properties:
        case_id:
          type: string
        parent:
          type: string
        name:
          type: string
        protocol:
          type: string
        case_state:
          $ref: '#/components/schemas/sdc.daemon.CaseState'
        outcome:
          type: string
      required:
      - case_id
      - protocol
      - case_state
      additionalProperties: false
    sdc.daemon.Catalog.Response:
      additionalProperties: false
      description: The rows of `sdc.daemon.Catalog`.
      properties:
        rows:
          description: Every row the projection holds, in the order it holds them.
          items:
            $ref: '#/components/schemas/sdc.daemon.Catalog.Row'
          type: array
      required:
      - rows
      type: object
    sdc.daemon.Catalog.Row:
      title: What a delegation may name row
      description: 'What a client may pass to Delegate, in one row: GET /daemon/views/catalog (the MCP tool describe_catalog, the command runbook catalog). `routes`: each declared route with its kind, alias, gateway by name, wires, status and phase as the view Routes reads them (at most once every 15 seconds), its context length and tool calling as the gateway lists them, and the prices and wait of the daemon''s file. `runbooks`: each runbook of the view Runbooks with its purpose in one line, its description, its inputs and its route entries (`bindings/<runbook>.routes.yaml`, docs/model-routes.md section 2) with the daemon''s admission of each; a runbook whose entries cannot be admitted is listed with the reason. `delegation`: the members of Delegate, the paths a delegation may take, the default and classifier routes, the level and the most bytes of a request. No address, token, token file or path of the host is in the row.'
      x-ess-name: sdc.daemon.Catalog
      x-ess-kind: view-row
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/sdc.daemon.CatalogRoute'
        runbooks:
          type: array
          items:
            $ref: '#/components/schemas/sdc.daemon.CatalogRunbook'
        delegation:
          $ref: '#/components/schemas/sdc.daemon.DelegationTerms'
      required:
      - routes
      - runbooks
      - delegation
      additionalProperties: false
    sdc.daemon.CatalogRoute:
      title: CatalogRoute
      description: 'A declared model route as the catalog lists it: what the view Routes says of it (the name, the gateway by name, the alias, the kind, the wires, the status, the phase and when the gateway was read, with the context length and the tool calling the gateway listed), and what the daemon''s file declares of it beside its address: the prices and the wait. No address, token or token file.'
      x-ess-name: sdc.daemon.CatalogRoute
      x-ess-kind: struct
      type: object
      properties:
        route:
          $ref: '#/components/schemas/sdc.daemon.RouteName'
        gateway:
          description: The name of the route's gateway in the daemon's file, never its address.
          type: string
        alias:
          type: string
        kind:
          $ref: '#/components/schemas/sdc.daemon.ModelRouteKind'
        wires:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/sdc.daemon.RouteStatus'
        phase:
          type: string
        max_model_len:
          description: The context length `GET /v1/models` gave for the alias; absent when the gateway gave none.
          type: integer
        tool_calling:
          description: Whether the model calls tools, as `GET /v1/models` gave it for the alias; absent when the gateway gave nothing.
          type: boolean
        price_in_micro_usd_per_mtok:
          description: 'What a call on the route books per million input tokens; absent when the file declares no price: the call books its reservation and its cost is not known.'
          type: integer
        price_out_micro_usd_per_mtok:
          description: The same per million output tokens.
          type: integer
        start_wait_seconds:
          description: How long a run waits for the route's model to be ready; absent when the file sets none.
          type: integer
        read_at:
          description: When the daemon read the gateway for this route.
          type: string
          format: date-time
      required:
      - route
      - gateway
      - alias
      - kind
      - wires
      - status
      - read_at
      additionalProperties: false
    sdc.daemon.CatalogRunbook:
      title: CatalogRunbook
      description: 'A runbook a delegation may name as its protocol, as the catalog lists it: the name and version of the view Runbooks, its purpose in one line and its description as its root protocol gives them, the inputs a delegation''s request fills, and its route entries with the daemon''s admission of each. A runbook whose entries cannot be admitted is listed with the reason. No path of the host.'
      x-ess-name: sdc.daemon.CatalogRunbook
      x-ess-kind: struct
      type: object
      properties:
        runbook_id:
          $ref: '#/components/schemas/sdc.daemon.RunbookName'
        runbook_version:
          $ref: '#/components/schemas/sdc.daemon.RunbookVersion'
        title:
          description: 'Its purpose in one line: the root protocol''s title, else the first sentence of its description; absent when it has neither.'
          type: string
        description:
          description: The root protocol's description, at most 2000 characters; absent when it has none.
          type: string
        inputs:
          description: 'The artifacts a delegation''s request becomes: `idea` when the runbook''s root bindings place it (the request is the run''s intake); none when they place no idea, and such a runbook cannot take a request.'
          type: array
          items:
            type: string
        route_entries:
          description: 'One per role of its route entries file, by role; none when it has no such file: every declared route may serve it.'
          type: array
          items:
            $ref: '#/components/schemas/sdc.daemon.RouteEntry'
        routes_allowed:
          description: The routes the file allows to serve the runbook; absent when it narrows nothing.
          type: array
          items:
            $ref: '#/components/schemas/sdc.daemon.RouteName'
        admitted:
          description: Whether every route entry is admitted and the file could be read.
          type: boolean
        refusal:
          description: 'Why the runbook''s route entries cannot be admitted: the file''s own fault, else the reason of each entry that is not admitted, joined by `; `. Absent when admitted.'
          type: string
      required:
      - runbook_id
      - inputs
      - route_entries
      - admitted
      additionalProperties: false
