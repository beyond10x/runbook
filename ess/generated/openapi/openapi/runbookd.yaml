        $ref: '#/x-ess-entities/sdc.decision.Consequence'
    required:
    - letter
    - does
    - cost
    - consequence
    additionalProperties: false
  sdc.decision.Grant:
    title: Grant
    description: A canon-authority/1 decision (documents.md:123-132).
    x-ess-name: sdc.decision.Grant
    x-ess-kind: enum
    type: string
    enum:
