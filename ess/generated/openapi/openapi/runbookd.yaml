    sdc.daemon.Routes.Row:
      title: Model routes row
      description: 'The model routes the daemon declares, in order of name: GET /daemon/views/routes (the MCP tool list_routes). Each row names the route, its gateway by name, the alias, the kind, the wires and the status the daemon last read from the gateway (`GET /ready`, `GET /v1/models`, and for the status `GET /v1/status`, else `GET /v1/models/{alias}/status` for a managed or a local route), read at most once every 15 seconds, and the context length (max_model_len) and the tool calling (tool_calling) `GET /v1/models` gives for the alias when it gives them. A daemon whose file declares no route has no row. No address, token, token file or price is in a row.'
      x-ess-name: sdc.daemon.Routes
      x-ess-kind: view-row
      type: object
      properties:
        route:
