          description: 'Every row of `sdc.daemon.DecisionsOfRun`, a projection of `sdc.daemon.DecisionRequest`. Contains the instances where `run_id == param.run_id` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.DecisionsOfRun.Response'
  /daemon/views/events:
    get:
      operationId: sdc.daemon.EventsAfter
      summary: Events of a run after a position
      description: 'The events of one run with a position above `after_position`, in position order: the page the run''s event stream serves. SSE is outside the language: ESS 0.96.0 has no construct for a server-sent event stream or a subscription (it has `asyncapi` for the events components publish, which describes a broker and not an HTTP stream), so the stream is not declared; the views are the page a stream serves, and the HTTP binding (the three events views below, served with `text/event-stream`) is written and tested in the story daemon-skeleton-on-a-runtime-trait. GET /daemon/views/events?run_id=... with `Accept: text/event-stream` streams this view: every row with position > after_position, each as one SSE event whose `id` is the row''s position, then each new event as it is recorded; a reconnect sends `Last-Event-ID: n`, a position, and the stream continues with after_position = n; after_position = 0 is the whole run. Without that header the same path answers the rows as a JSON page.'
      tags:
      - daemon
      x-ess-consistency: read_your_writes
      parameters:
      - name: run_id
        in: query
        description: Read by the view's filter as `param.run_id`; it selects which rows the view holds.
        required: true
        schema:
          $ref: '#/components/schemas/sdc.daemon.RunId'
      - name: after_position
        in: query
        description: Read by the view's filter as `param.after_position`; it selects which rows the view holds.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 'Every row of `sdc.daemon.EventsAfter`, a projection of `sdc.daemon.RunEvent`. Contains the instances where `(run_id == param.run_id and position > param.after_position)` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
