          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.NoSuchSession.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.SubmitRun.session-closed.Response:
      additionalProperties: false
      description: 'The named session is Closed and takes no new run: nothing was submitted. Taken when `input.session_id`, checked only when present, names a `sdc.daemon.Session` that exists and whose stored fields satisfy `state == Closed`.'
      properties:
        error:
          const: sdc.daemon.SessionClosedToRuns
          description: The session is Closed and takes no new run; the run was not submitted.
          type: string
        outcome:
          const: session-closed
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/sdc.daemon.SessionClosedToRuns.Error'
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          maxItems: 0
          type: array
      required:
      - outcome
      - published
      - error
      - payload
      type: object
    sdc.daemon.SubmitRun.submitted.Response:
      additionalProperties: false
      description: The run is Submitted. Taken when no other outcome's condition matched. A `sdc.daemon.Run` now exists, in `Submitted`. Its identity is published as `run_id` on `sdc.daemon.RunSubmitted`. Emits `RunSubmitted`, listed under `published`. `RunSubmitted` is not published and stays inside the component.
      properties:
        outcome:
          const: submitted
          description: Which declared outcome the command took.
        published:
          description: 'Every event this branch emitted, in the order it emits them: its qualified name and its payload. `sdc.daemon.RunSubmitted` is listed too, although this component does not publish it to consumers.'
          items: false
          maxItems: 1
          minItems: 1
          prefixItems:
          - additionalProperties: false
            properties:
              event:
                const: sdc.daemon.RunSubmitted
                type: string
              payload:
                $ref: '#/components/schemas/sdc.daemon.RunSubmitted.Event'
            required:
            - event
            - payload
            type: object
          type: array
      required:
      - outcome
      - published
      type: object
    sdc.decision.ActionId:
      title: ActionId
      description: A protocol action id, such as roadmap.approve.
      x-ess-name: sdc.decision.ActionId
      x-ess-kind: newtype
      type: string
    sdc.decision.Consequence:
      title: Consequence
      description: What choosing the option does to the protocol.
      x-ess-name: sdc.decision.Consequence
      x-ess-kind: struct
      type: object
      properties:
        admits:
          description: Actions that become admissible.
          type: array
          items:
            $ref: '#/components/schemas/sdc.decision.ActionId'
        blocks:
          description: Actions that become blocked.
          type: array
          items:
            $ref: '#/components/schemas/sdc.decision.ActionId'
        grant:
          $ref: '#/components/schemas/sdc.decision.Grant'
          description: The authority entry the option writes, for an approval.
        answer:
          description: The answer written to questions.yaml, for a question.
          type: string
        produces:
          $ref: '#/components/schemas/sdc.decision.ProducedDocument'
          description: The kind of Canon record the option produces when decided; absent when it produces none, such as 'leave it untaken' on an outcome request. Only a decided option that produces a record goes through RecordProduced before the run resumes.
      required:
      - admits
      - blocks
      additionalProperties: false
    sdc.decision.DecisionOption:
      title: DecisionOption
      description: One option of a decision request.
      x-ess-name: sdc.decision.DecisionOption
      x-ess-kind: struct
      type: object
      properties:
        letter:
          $ref: '#/components/schemas/sdc.decision.OptionLetter'
        does:
          description: What the option does, one sentence.
          type: string
        cost:
          description: 'What it costs: work, time, scope or risk.'
          type: string
        consequence:
          $ref: '#/components/schemas/sdc.decision.Consequence'
      required:
      - letter
      - does
      - cost
      - consequence
      additionalProperties: false
    sdc.decision.Grant:
      title: Grant
      description: A canon-authority/1 decision (documents.md:123-132).
      x-ess-name: sdc.decision.Grant
      x-ess-kind: enum
      type: string
      enum:
      - granted
      - denied
    sdc.decision.OptionLetter:
      title: OptionLetter
      description: 'The letter of an option: A, B, C, in the order presented.'
      x-ess-name: sdc.decision.OptionLetter
      x-ess-kind: newtype
      type: string
    sdc.decision.Principal:
      title: Principal
      description: 'Who decides: a person''s name (operator), decider:<kind> (decider:model, decider:approve, decider:reject; decider:haiku in runs before D149), or silence for a default taken because nobody answered. Recorded as given, as Canon records a principal (canon-decisions/1).'
      x-ess-name: sdc.decision.Principal
      x-ess-kind: newtype
      type: string
    sdc.decision.ProducedDocument:
      title: ProducedDocument
      description: 'The Canon record a decided request produced. canon_authority: an AuthorityDecision entry bound to the case revision (approval). canon_decisions: an ExplicitDecision entry (outcome). canon_evidence: the approval evidence a manual action produced (context_approval, vision_approval, roadmap_approval). artifact_revision: the new revision of questions.yaml holding the answer (question).'
      x-ess-name: sdc.decision.ProducedDocument
      x-ess-kind: enum
      type: string
      enum:
      - canon_authority
      - canon_decisions
      - canon_evidence
      - artifact_revision
x-ess-entities:
  sdc.daemon.ClientId:
    title: ClientId
    description: 'The client a session belongs to. UNMAPPED: what identifies a client (the subject of the bearer token, a name the client gives) is not stated in the design sheet; the daemon''s security floor says only that a non-loopback listener needs a token.'
    x-ess-name: sdc.daemon.ClientId
    x-ess-kind: newtype
    type: string
  sdc.daemon.ConfinementLevel:
    title: ConfinementLevel
    description: 'How strongly a run is sandboxed, weakest first. UNMAPPED: names to be aligned with the runtime; unconfined, workspace and strict are placeholders for the levels the runtime offers through Substrate. Only their order is decided: a higher level confines more.'
    x-ess-name: sdc.daemon.ConfinementLevel
    x-ess-kind: enum
    type: string
    enum:
    - unconfined
    - workspace
    - strict
  sdc.daemon.Daemon:
    title: Daemon
    description: 'The configuration row of the daemon: what it was started with and what every run is held to. One row, created when the daemon starts.'
    x-ess-name: sdc.daemon.Daemon
    x-ess-kind: entity
    type: object
    properties:
      daemon_id:
        $ref: '#/x-ess-entities/sdc.daemon.DaemonId'
      confinement_floor:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
        description: The lowest level the daemon takes (runbook serve --min-confinement). A run below it is refused.
      started_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Daemon.State'
    required:
    - daemon_id
    - confinement_floor
    - started_at
    - state
    additionalProperties: false
  sdc.daemon.Daemon.State:
    title: State
    x-ess-name: sdc.daemon.Daemon.State
    x-ess-kind: enum
    type: string
    enum:
    - Up
  sdc.daemon.DaemonId:
    title: DaemonId
    description: 'The id of the one daemon the specification describes: the configuration row it holds is keyed by it.'
    x-ess-name: sdc.daemon.DaemonId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DecisionRequest:
    title: DecisionRequest
    description: 'A question a waiting run raised: the options it offers and, once a client answered, the answer and who gave it. The decision contract of the runbook (sdc.decision) decides who may answer and how a request is recommended; the daemon relays the request and takes the answer. UNMAPPED: whether this entity is the sdc.decision.DecisionRequest itself or a mirror of it that the driver feeds is not decided; the options reuse sdc.decision.DecisionOption.'
    x-ess-name: sdc.daemon.DecisionRequest
    x-ess-kind: entity
    type: object
    properties:
      request_id:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequestId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: decision_requests
          kind: owns
          source: sdc.daemon.Run
          target: sdc.daemon.DecisionRequest
          cardinality: many
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      question:
        type: string
      options:
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.decision.DecisionOption'
      opened_at:
        type: string
        format: date-time
      answer:
        description: The option letter, or the free text for a question that takes one; present once Answered.
        type: string
      answered_by:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
      answered_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequest.State'
    required:
    - request_id
    - run_id
    - question
    - options
    - opened_at
    - state
    additionalProperties: false
  sdc.daemon.DecisionRequest.State:
    title: State
    x-ess-name: sdc.daemon.DecisionRequest.State
    x-ess-kind: enum
    type: string
    enum:
    - Answered
    - Open
  sdc.daemon.DecisionRequestId:
    title: DecisionRequestId
    description: The id of a decision request, chosen by the runtime when it asks.
    x-ess-name: sdc.daemon.DecisionRequestId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DocumentRef:
    title: DocumentRef
    description: 'A reference to a document the run reads: a path inside the run''s state directory, or a digest. UNMAPPED: the reference form (path, digest, URL) is not decided; the daemon keeps what the client sends.'
    x-ess-name: sdc.daemon.DocumentRef
    x-ess-kind: newtype
    type: string
  sdc.daemon.EventId:
    title: EventId
    description: The id the daemon gives a recorded event; the stream's own id is the run's sequence number.
    x-ess-name: sdc.daemon.EventId
    x-ess-kind: newtype
    type: string
  sdc.daemon.EventKind:
    title: EventKind
    description: 'The kind of the runtime''s record, copied from it. UNMAPPED: the runtime''s record kinds are Loom''s and are not known here; the daemon does not interpret them.'
    x-ess-name: sdc.daemon.EventKind
    x-ess-kind: newtype
    type: string
  sdc.daemon.Run:
    title: Run
    description: 'One run of a runbook on the daemon: its inputs as submitted, its confinement, where it stands and how it ended.'
    x-ess-name: sdc.daemon.Run
    x-ess-kind: entity
    type: object
    properties:
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
      runbook_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookId'
      runbook_version:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookVersion'
      intake_ref:
        $ref: '#/x-ess-entities/sdc.daemon.DocumentRef'
      context_ref:
        $ref: '#/x-ess-entities/sdc.daemon.DocumentRef'
        description: The context directory the run reads (runbook run --context); absent when none was given.
      settings:
        $ref: '#/x-ess-entities/sdc.daemon.RunSettings'
      confinement:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
        description: The session the run was submitted into; absent for a run of no session.
        x-ess-relation:
          name: session
          kind: references
          source: sdc.daemon.Run
          target: sdc.daemon.Session
          cardinality: one
          via: session_id
          $ref: '#/x-ess-entities/sdc.daemon.Session'
      submitted_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
      ended_at:
        description: 'When the run left its last live state: ended, cancelled or failed to start.'
        type: string
        format: date-time
      outcome:
        $ref: '#/x-ess-entities/sdc.daemon.RunOutcome'
        description: Set when the run Ended; absent in every other state.
      failure:
        description: Why the run failed to start; absent in every other state.
        type: string
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Run.State'
    required:
    - run_id
    - runbook_id
    - runbook_version
    - intake_ref
    - settings
    - confinement
    - submitted_at
    - state
    additionalProperties: false
  sdc.daemon.Run.State:
    title: State
    x-ess-name: sdc.daemon.Run.State
    x-ess-kind: enum
    type: string
    enum:
    - Cancelled
    - Ended
    - FailedToStart
    - Running
    - Submitted
    - WaitingOnDecision
  sdc.daemon.RunEvent:
    title: RunEvent
    description: 'One record of a run, in the order the runtime wrote it. The runtime''s own record is carried unchanged, as an opaque document; the daemon adds the run, the sequence number and the time. The sequence number only grows per run: it is the stream''s event id, and a client resumes after the last one it saw.'
    x-ess-name: sdc.daemon.RunEvent
    x-ess-kind: entity
    type: object
    properties:
      event_id:
        $ref: '#/x-ess-entities/sdc.daemon.EventId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: events
          kind: owns
          source: sdc.daemon.Run
          target: sdc.daemon.RunEvent
          cardinality: many
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      sequence:
        description: '1 for a run''s first event; each later event has a larger number. The runs of one session or of the whole daemon have no common order: a sequence number is per run.'
        type: integer
        minimum: 1
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.EventKind'
      record:
        description: The runtime's record, byte for byte as a document; no secret appears in it (design sheet, decision 10).
      at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.RunEvent.State'
    required:
    - event_id
    - run_id
    - sequence
    - kind
    - record
    - at
    - state
    additionalProperties: false
    x-ess-invariants:
    - sequence >= 1
  sdc.daemon.RunEvent.State:
    title: State
    x-ess-name: sdc.daemon.RunEvent.State
    x-ess-kind: enum
    type: string
    enum:
    - Recorded
  sdc.daemon.RunId:
    title: RunId
    description: 'The id of a run, chosen by the submitting client (a UUID it generated, or any unique text). The state directory of the run is named after it. UNMAPPED: the design sheet leaves open whether the client or the daemon mints the id; the client chooses here so that a retried submit names the same run and a scenario can name it. A daemon-minted id needs a typed response and `{generated: true}`. UNMAPPED: a submit with an id that is already taken is not refused in this model (see SubmitRun).'
    x-ess-name: sdc.daemon.RunId
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunOutcome:
    title: RunOutcome
    description: 'How an ended run ended, as the runbook''s protocol names it. UNMAPPED: whether the set is closed (the Canon case outcomes) is not known here.'
    x-ess-name: sdc.daemon.RunOutcome
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunSettings:
    title: RunSettings
    description: 'The settings of a run: the free map of host values (runbook run --set key=value) is every member the struct does not declare, kept as written. UNMAPPED: the typed members the runtime knows are not listed in any source read here; each is added as a declared member when the runtime names it.'
    x-ess-name: sdc.daemon.RunSettings
    x-ess-kind: struct
    type: object
    additionalProperties: true
  sdc.daemon.RunbookId:
    title: RunbookId
    description: 'The id of a runbook: an embedded preset such as sdc or sdc-bugfix, or a runbook run from a directory.'
    x-ess-name: sdc.daemon.RunbookId
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunbookVersion:
    title: RunbookVersion
    description: The version of a runbook, as runbook list shows it.
    x-ess-name: sdc.daemon.RunbookVersion
    x-ess-kind: newtype
    type: string
  sdc.daemon.Session:
    title: Session
    description: A named group of runs of one client. Open until the client closes it; a closed session takes no new run and keeps the runs it has.
    x-ess-name: sdc.daemon.Session
    x-ess-kind: entity
    type: object
    properties:
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
      client:
        $ref: '#/x-ess-entities/sdc.daemon.ClientId'
      opened_at:
        type: string
        format: date-time
      closed_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Session.State'
    required:
    - session_id
    - client
    - opened_at
    - state
    additionalProperties: false
  sdc.daemon.Session.State:
    title: State
    x-ess-name: sdc.daemon.Session.State
    x-ess-kind: enum
    type: string
    enum:
    - Closed
    - Open
  sdc.daemon.SessionId:
    title: SessionId
    description: The name of a session, chosen by the client that opens it.
    x-ess-name: sdc.daemon.SessionId
    x-ess-kind: newtype
    type: string
