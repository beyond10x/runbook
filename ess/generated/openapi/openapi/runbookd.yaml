          $ref: '#/components/schemas/sdc.decision.RecordStore'
        record_id:
          type: string
      required:
      - store
      - record_id
      additionalProperties: false
    sdc.decision.RecordStore:
      title: RecordStore
      description: 'Where a cited record id is looked up: the decision request log, a case''s evidence/ (canon-evidence/1 id), authority.json, decisions.json, or an AEP planning store (kind:name).'
      x-ess-name: sdc.decision.RecordStore
      x-ess-kind: enum
      type: string
      enum:
      - sdc_decisions
      - canon_evidence
      - canon_authority
      - canon_decisions
      - aep_artifact
    sdc.decision.Revision:
      title: Revision
      description: An artifact or case revision as the case snapshot writes it.
      x-ess-name: sdc.decision.Revision
      x-ess-kind: newtype
      type: string
    sdc.decision.Strength:
      title: Strength
      description: 'How strongly the grounds support the recommended option. none: the request carries no recommendation (stored before Recommend and after a withheld one; a Recommend sending none is refused). strong: a vision, requirement, PRD, story or spec states it, or a prior decision on the same question and subject stands with its grounds unchanged. moderate: a policy, an autonomy rule or an evidence record supports it by inference. weak: the grounds make it plausible only.'
      x-ess-name: sdc.decision.Strength
      x-ess-kind: enum
      type: string
      enum:
      - none
      - weak
      - moderate
      - strong
x-ess-entities:
  sdc.daemon.ClientLabel:
    title: ClientLabel
    description: 'A label the client gives when it opens a session: free text, at most 200 characters, for display. It grants nothing: who may call is decided by the bearer token alone, and the token''s subject is not a member of any entity.'
    x-ess-name: sdc.daemon.ClientLabel
    x-ess-kind: newtype
    type: string
    maxLength: 200
    x-ess-invariants:
    - value.count <= 200
  sdc.daemon.ConfinementLevel:
    title: ConfinementLevel
    description: 'How strongly a run is sandboxed, weakest first: the runtime''s names. local is not confined; linux is. oci and pod are the runtime''s planned levels and are not in the set until it offers them. A submit that names no level runs at the daemon''s default level (runbook serve --default-confinement, or `confinement` of runbook.toml); a daemon with none refuses the submit by name and writes nothing, as the binary has no built-in default; the handler fills it. The daemon''s floor is linux unless it is started lower; the default is never below the floor, and a daemon whose default is below its floor does not start. local must be asked for by name or set as the default, and is refused under a linux floor.'
    x-ess-name: sdc.daemon.ConfinementLevel
    x-ess-kind: enum
    type: string
    enum:
    - local
    - linux
  sdc.daemon.ConfinementSource:
    title: ConfinementSource
    description: 'Where a run''s level came from: submit (the client named it) or daemon-default (the client named none and the daemon''s default level applied). There is no third source: a daemon with no default refuses a submit that names none.'
    x-ess-name: sdc.daemon.ConfinementSource
    x-ess-kind: enum
    type: string
    enum:
    - submit
    - daemon-default
  sdc.daemon.ContextPath:
    title: ContextPath
    description: A directory on the daemon's host, given as an absolute path. The daemon accepts it only when it lies under one of its context roots (runbook serve --context-root <dir>, repeatable; none given means no context from a path), and copies it into the run's workspace before the run starts.
    x-ess-name: sdc.daemon.ContextPath
    x-ess-kind: newtype
    type: string
  sdc.daemon.Daemon:
    title: Daemon
    description: 'The configuration row of the daemon: what it was started with and what every run is held to. One row, created when the daemon starts.'
    x-ess-name: sdc.daemon.Daemon
    x-ess-kind: entity
    type: object
    properties:
      daemon_id:
        $ref: '#/x-ess-entities/sdc.daemon.DaemonId'
      confinement_floor:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
        description: The lowest level the daemon takes (runbook serve --min-confinement). A run below it is refused.
      principal:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: 'Who the daemon acts as: person:<id> or agent:<id> (runbook serve --principal, required, no default). Fixed for the life of the process: no command, header, MCP input or HTTP input changes it. The daemon passes it, and nothing a client typed, to the runtime as the principal of an answer.'
      started_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Daemon.State'
    required:
    - daemon_id
    - confinement_floor
    - principal
    - started_at
    - state
    additionalProperties: false
  sdc.daemon.Daemon.State:
    title: State
    x-ess-name: sdc.daemon.Daemon.State
    x-ess-kind: enum
    type: string
    enum:
    - Up
  sdc.daemon.DaemonId:
    title: DaemonId
    description: 'The id of the one daemon the specification describes: the configuration row it holds is keyed by it. The HTTP handler fills it; one process is one daemon.'
    x-ess-name: sdc.daemon.DaemonId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DeciderKind:
    title: DeciderKind
    description: 'The name of a decider kind the operator configured (a table [deciders.<kind>] of runbook.toml): rule or model. A run names a kind, never a program or a path; a kind that is not configured is refused at the submit before anything is written.'
    x-ess-name: sdc.daemon.DeciderKind
    x-ess-kind: newtype
    type: string
    minLength: 1
    maxLength: 63
    x-ess-invariants:
    - value.count >= 1
    - value.count <= 63
  sdc.daemon.DecisionArtifact:
    title: DecisionArtifact
    description: 'What a decision request read from its case carries beside its question and its options: the recommendation, its grounds and whether the request takes a free answer (docs/engine.md, ''A request read from the case''). The runtime reads it from the case and never writes it; a request the runtime built itself has none, and only a request that has one refuses an answer that names none of its options (AnswerDecision, unknown-option).'
    x-ess-name: sdc.daemon.DecisionArtifact
    x-ess-kind: struct
    type: object
    properties:
      recommended_option:
        $ref: '#/x-ess-entities/sdc.decision.OptionLetter'
        description: The letter of the option the case recommends.
      recommended_answer:
        description: A free answer the case recommends in place of an option, for a question.
        type: string
      recommendation_strength:
        $ref: '#/x-ess-entities/sdc.decision.Strength'
        description: How strongly the grounds support the recommendation; none where the request carries no recommendation.
      grounds:
        description: The grounds of the recommendation, each with a citation the runtime checked before the request opened.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.decision.Ground'
      free_answer:
        description: Whether an answer that names no option is taken as a free answer (a question request).
        type: boolean
    required:
    - recommendation_strength
    - grounds
    - free_answer
    additionalProperties: false
  sdc.daemon.DecisionRequest:
    title: DecisionRequest
    description: 'A question a waiting run raised, as a mirror of the runtime''s decision request: the daemon copies id, case, action, capability, question and options from the runtime''s record and adds the run id. Once a client answered, it holds the answer and who gave it. The runbook''s decision contract (sdc.decision) stays the rule for who may answer: the daemon passes the answer and the principal to the runtime, which decides. A request is Withdrawn when its run is cancelled or ended as orphaned (CancelRun and EndOrphanedRun move every Open request of the run in their own step) or when the runtime withdraws it (WithdrawDecision): it stays on record, shows no more as open, and takes no answer.'
    x-ess-name: sdc.daemon.DecisionRequest
    x-ess-kind: entity
    type: object
    properties:
      request_id:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequestId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: decision_requests
          kind: owns
          source: sdc.daemon.Run
          target: sdc.daemon.DecisionRequest
          cardinality: many
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      case_id:
        description: The case the runtime opened the request for.
        type: string
      action:
        type: string
      capability:
        type: string
      question:
        type: string
      options:
        description: The options of a request read from its case (DecisionArtifact) are the case's, in the contract's shape; a request the runtime built itself names each option by the answer that takes it and its effect.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.decision.DecisionOption'
      artifact:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionArtifact'
        description: What the request read from its case; absent for a request the runtime built itself.
      opened_at:
        type: string
        format: date-time
      answer:
        description: The option letter, or the free text for a question that takes one; present once Answered.
        type: string
      answered_by:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: 'The label the client gave (at most 200 characters): stored and shown, never passed to the runtime and never the principal. A rule or a decider of the run answers under its own name instead, `rule:<name>` or `decider:<kind>`, and a client cannot take a name that starts with either, in any case, or with `router:`, nor one with a non-ASCII or a control character (400).'
      principal:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: The daemon's principal at the answer, the one the runtime was given; present once Answered. Absent in a record written before the daemon had one. For an answer of a rule or a decider it is that rule's or decider's own principal (`decider:<verdict>`, `rule:<name>`), never the daemon's, which may be a person's.
      answered_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequest.State'
    required:
    - request_id
    - run_id
    - case_id
    - action
    - capability
    - question
    - options
    - opened_at
    - state
    additionalProperties: false
  sdc.daemon.DecisionRequest.State:
    title: State
    x-ess-name: sdc.daemon.DecisionRequest.State
    x-ess-kind: enum
    type: string
    enum:
    - Answered
    - Open
    - Withdrawn
  sdc.daemon.DecisionRequestId:
    title: DecisionRequestId
    description: 'The id of a decision request: the runtime''s, copied. A request id that is already taken cannot occur, because the runtime mints it; the specification has no refusal for it.'
    x-ess-name: sdc.daemon.DecisionRequestId
    x-ess-kind: newtype
    type: string
  sdc.daemon.EventId:
    title: EventId
    description: The id the daemon gives a recorded event. It is the row's identity only; the stream's id is the event's position.
    x-ess-name: sdc.daemon.EventId
    x-ess-kind: newtype
    type: string
  sdc.daemon.EventKind:
    title: EventKind
    description: 'Open text: the kind of the runtime''s run-log line, copied. Events the daemon writes itself have a kind that starts with `runbook.`, and the command that writes each one declares it: runbook.submitted (SubmitRun), runbook.cancel-requested (CancelRun), runbook.start-failed (FailRunStart), runbook.run-orphaned (EndOrphanedRun), runbook.answer-undeliverable (AnswerDecision) and runbook.runtime-failed (written by the daemon just before it issues EndRun with the outcome runtime-failure) and runbook.action-started (written by the daemon when the runtime tells that a program of an action, or its `handoff_when` check, is about to start, before the program starts; record: case, action, role (`program` or `check`) and try, each absent when unknown; the language cannot write a RunEvent from a command, so it is stated here, and the view RunDetail shows the step while the program runs). Not a closed set for the runtime''s own kinds.'
    x-ess-name: sdc.daemon.EventKind
    x-ess-kind: newtype
    type: string
  sdc.daemon.IdempotencyKey:
    title: IdempotencyKey
    description: 'Optional text, at most 200 characters, unique per daemon, that a client sends to retry a submit safely: a second submit with a key already used returns the first run and creates none.'
    x-ess-name: sdc.daemon.IdempotencyKey
    x-ess-kind: newtype
    type: string
    maxLength: 200
    x-ess-invariants:
    - value.count <= 200
  sdc.daemon.ProductFile:
    title: ProductFile
    description: 'One file of a run''s work/ directory as the listing names it: a regular file with one name, reached through no link.'
    x-ess-name: sdc.daemon.ProductFile
    x-ess-kind: struct
    type: object
    properties:
      path:
        $ref: '#/x-ess-entities/sdc.daemon.ProductPath'
      size:
        description: Its length in bytes.
        type: integer
      modified_at:
        description: When it was last written.
        type: string
        format: date-time
    required:
    - path
    - size
    - modified_at
    additionalProperties: false
  sdc.daemon.ProductKind:
    title: ProductKind
    description: 'What a read found: text (the bytes shown are UTF-8 without a NUL byte; a partial character at a cut does not count) or binary (anything else: no text is answered).'
    x-ess-name: sdc.daemon.ProductKind
    x-ess-kind: enum
    type: string
    enum:
    - text
    - binary
  sdc.daemon.ProductPath:
    title: ProductPath
    description: 'The path of a file of a run, relative to the run''s work/ directory (its workspace, which the cases of the run share): names joined by `/`, none of them `..` and none starting with a dot. Never absolute and never a path of the host.'
    x-ess-name: sdc.daemon.ProductPath
    x-ess-kind: newtype
    type: string
  sdc.daemon.Run:
    title: Run
    description: One run of a runbook on the daemon:its inputs as submitted, its confinement, where it stands and how it ended.
    x-ess-name: sdc.daemon.Run
    x-ess-kind: entity
    type: object
    properties:
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
      runbook_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookId'
      runbook_version:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookVersion'
      intake:
        description: 'The intake document itself, inline in the submit: text, at most 1 MiB.'
        type: string
      context_path:
        $ref: '#/x-ess-entities/sdc.daemon.ContextPath'
        description: The context directory the run reads (runbook run --context), under one of the daemon context roots; absent when none was given.
      settings:
        $ref: '#/x-ess-entities/sdc.daemon.RunSettings'
      confinement:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
      confinement_source:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementSource'
        description: 'Where the level came from: the submit or the daemon''s default. Absent for a run recorded before the daemon kept it.'
      autonomy:
        $ref: '#/x-ess-entities/sdc.decision.AutonomyLevel'
        description: 'The level the run was submitted with, or took from the daemon''s default; absent when none: every decision of the run waits for a client. Fixed at the submit and read from the record, never from the daemon''s policy of the day.'
      decider:
        $ref: '#/x-ess-entities/sdc.daemon.DeciderKind'
        description: The kind of decider of the run, fixed like the level.
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
        description: The session the run was submitted into; absent for a run of no session.
        x-ess-relation:
          name: session
          kind: references
          source: sdc.daemon.Run
          target: sdc.daemon.Session
          cardinality: one
          via: session_id
          $ref: '#/x-ess-entities/sdc.daemon.Session'
      idempotency_key:
        $ref: '#/x-ess-entities/sdc.daemon.IdempotencyKey'
        description: The key the submit carried, when it carried one; a later submit with the same key returns this run.
      submitted_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
      ended_at:
        description: 'When the run left its last live state: ended, cancelled or failed to start.'
        type: string
        format: date-time
      outcome:
        $ref: '#/x-ess-entities/sdc.daemon.RunOutcome'
        description: 'Set when the run Ended; absent in every other state. Besides the outcome names of the runbook''s protocol it holds the daemon''s own causes: `orphaned` (the daemon stopped while the run was live and the runtime could not take it up again) and `runtime-failure` (the runtime failed after the run started).'
      failure:
        description: Why the run failed to start; absent in every other state.
        type: string
      step_in_flight:
        $ref: '#/x-ess-entities/sdc.daemon.StepInFlight'
        description: 'The step whose program runs now, while the run is Running; absent otherwise (no program runs, the run waits, ended, was cancelled, or the daemon started again). No command of the language sets it: the daemon keeps it in its process from the run event `runbook.action-started` until the program ends, like the rows of Runbook, and a restarted daemon has none.'
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Run.State'
    required:
    - run_id
    - runbook_id
    - intake
    - settings
    - confinement
    - submitted_at
    - state
    additionalProperties: false
  sdc.daemon.Run.State:
    title: State
    x-ess-name: sdc.daemon.Run.State
    x-ess-kind: enum
    type: string
    enum:
    - Cancelled
    - Ended
    - FailedToStart
    - Running
    - Submitted
    - WaitingOnDecision
  sdc.daemon.RunEvent:
    title: RunEvent
    description: 'One record of a run, in the order the runtime wrote it. The runtime''s own record is carried unchanged, as an opaque document; the daemon adds the run, the session, two numbers and the time. `sequence` counts per run, `position` counts per daemon over all runs: the stream''s event id is the position, and a client resumes after the last position it saw.'
    x-ess-name: sdc.daemon.RunEvent
    x-ess-kind: entity
    type: object
    properties:
      event_id:
        $ref: '#/x-ess-entities/sdc.daemon.EventId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: events
          kind: owns
          source: sdc.daemon.Run
          target: sdc.daemon.RunEvent
          cardinality: many
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
        description: The session of the run, copied from it by the handler when it records the event; absent for a run of no session. It is what lets the events of a session be paged by position.
        x-ess-relation:
          name: session
          kind: references
          source: sdc.daemon.RunEvent
          target: sdc.daemon.Session
          cardinality: one
          via: session_id
          $ref: '#/x-ess-entities/sdc.daemon.Session'
      sequence:
        description: Per run, from 1; each later event of the run has a larger number.
        type: integer
        minimum: 1
      position:
        description: Per daemon, from 1, strictly increasing over all runs; minted by the daemon when it records the event.
        type: integer
        minimum: 1
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.EventKind'
      record:
        description: The runtime's record, byte for byte as a document; no secret appears in it (design sheet, decision 10).
      at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.RunEvent.State'
    required:
    - event_id
    - run_id
    - sequence
    - position
    - kind
    - record
    - at
    - state
    additionalProperties: false
    x-ess-invariants:
    - sequence >= 1
    - position >= 1
  sdc.daemon.RunEvent.State:
    title: State
    x-ess-name: sdc.daemon.RunEvent.State
    x-ess-kind: enum
    type: string
    enum:
    - Recorded
  sdc.daemon.RunId:
    title: RunId
    description: The id of a run. The daemon mints it (a UUID, version 7) in the HTTP handler and returns it in the answer to the submit; the handler fills the `run_id` input of SubmitRun and a client never chooses it. The state directory of the run is named after it. A run id that is already taken cannot occur, because the daemon mints it; the specification has no refusal for it.
    x-ess-name: sdc.daemon.RunId
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunOutcome:
    title: RunOutcome
    description: 'Open text: the outcome name of the runbook''s protocol for the root case, or one of the daemon''s own causes (`orphaned`, `runtime-failure`). The run''s state is the closed set; the outcome is not.'
    x-ess-name: sdc.daemon.RunOutcome
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunProduct:
    title: RunProduct
    description: One file of a run's work/ directory, read when a client asks for the view ProductOfRun. The reader opens each directory on the path and the file relative to the one before without following a link, reads the type and the link count from the open file before a byte, and reads at most `limit` bytes in the daemon's process; no program opens the file. As with RunProducts, no command creates or changes a row.
    x-ess-name: sdc.daemon.RunProduct
    x-ess-kind: entity
    type: object
    properties:
      path:
        $ref: '#/x-ess-entities/sdc.daemon.ProductPath'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: run
          kind: references
          source: sdc.daemon.RunProduct
          target: sdc.daemon.Run
          cardinality: one
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      size:
        description: The length of the file in bytes.
        type: integer
      modified_at:
        type: string
        format: date-time
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.ProductKind'
      text:
        description: The first `limit` bytes as text; absent when kind is binary.
        type: string
      shown:
        description: The bytes of `text`; 0 for binary.
        type: integer
      truncated:
        description: 'True when the file holds more than `limit` bytes: `text` is its start.'
        type: boolean
      limit:
        description: 'The most bytes a read answers: 1048576.'
        type: integer
      state:
        $ref: '#/x-ess-entities/sdc.daemon.RunProduct.State'
    required:
    - path
    - run_id
    - size
    - modified_at
    - kind
    - shown
    - truncated
    - limit
    - state
    additionalProperties: false
  sdc.daemon.RunProduct.State:
    title: State
    x-ess-name: sdc.daemon.RunProduct.State
    x-ess-kind: enum
    type: string
    enum:
    - Read
  sdc.daemon.RunProducts:
    title: RunProducts
    description: 'What a run wrote under its work/ directory, as the daemon finds it when a client asks for the view ProductsOfRun: one row per run the daemon knows. The daemon reads the directory from the host through one reader (runbook/src/engine/products.rs) with the guards of the inspector''s file route: no link is followed or listed, a file with more than one name is not listed, a name that starts with a dot is neither listed nor entered, and the walk stops at 500 files, 2000 directories, 20000 entries and 6 levels. The language cannot read a file system, so no command creates or changes a row, as with Runbook.'
    x-ess-name: sdc.daemon.RunProducts
    x-ess-kind: entity
    type: object
    properties:
      work_id:
        $ref: '#/x-ess-entities/sdc.daemon.WorkId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        description: The run whose work/ directory this is.
        x-ess-relation:
          name: run
          kind: references
          source: sdc.daemon.RunProducts
          target: sdc.daemon.Run
          cardinality: one
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      files:
        description: The files, by path.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.ProductFile'
      cut:
        description: 'The bound the listing stopped at: files, directories, entries or depth; absent when it walked the whole directory.'
        type: string
      hidden:
        description: 'Entries whose name starts with a dot: neither listed nor served.'
        type: integer
      left_out:
        description: 'Links and files with more than one name: neither listed nor served.'
        type: integer
      state:
        $ref: '#/x-ess-entities/sdc.daemon.RunProducts.State'
    required:
    - work_id
    - run_id
    - files
    - hidden
    - left_out
    - state
    additionalProperties: false
  sdc.daemon.RunProducts.State:
    title: State
    x-ess-name: sdc.daemon.RunProducts.State
    x-ess-kind: enum
    type: string
    enum:
    - Listed
  sdc.daemon.RunSettings:
    title: RunSettings
    description: 'The settings of a run: a map from text to text (runbook run --set key=value), kept as written. Typed members come with the runtime''s run-settings story; none are declared now.'
    x-ess-name: sdc.daemon.RunSettings
    x-ess-kind: newtype
    type: object
    additionalProperties:
      type: string
    x-ess-map-key: String
  sdc.daemon.Runbook:
    title: Runbook
    description: 'A runbook the daemon can start, as its host lists it: a script of the stub runtime, a runbook of the runbook home (runbook serve --runbook-home, runtime loom) or a runbook of --runbook-dir. The daemon reads the list from the host when a client asks for the view Runbooks; the language cannot read a file system, so no command of the specification creates or changes a row, and a client reads the list only.'
    x-ess-name: sdc.daemon.Runbook
    x-ess-kind: entity
    type: object
    properties:
      runbook_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookName'
      runbook_version:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookVersion'
        description: The version the runtime has for the runbook (for the runbook home, the revision of its root protocol); absent when the host names none.
      runtime:
        $ref: '#/x-ess-entities/sdc.daemon.RuntimeKind'
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Runbook.State'
    required:
    - runbook_id
    - runtime
    - state
    additionalProperties: false
  sdc.daemon.Runbook.State:
    title: State
    x-ess-name: sdc.daemon.Runbook.State
    x-ess-kind: enum
    type: string
    enum:
    - Listed
  sdc.daemon.RunbookId:
    title: RunbookId
    description: 'The name of a runbook: a preset (sdc, sdc-bugfix) or the name of a runbook in the daemon''s --runbook-dir.'
    x-ess-name: sdc.daemon.RunbookId
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunbookName:
    title: RunbookName
    description: 'The name of a runbook in the list the view Runbooks gives: the text a client puts into the runbook_id of a SubmitRun. A type of its own, not RunbookId, because a row of that list names a runbook the daemon can start and is not a reference of a run to it.'
    x-ess-name: sdc.daemon.RunbookName
    x-ess-kind: newtype
    type: string
  sdc.daemon.RunbookVersion:
    title: RunbookVersion
    description: 'The version of a runbook, as runbook list shows it. Optional in a submit: absent means the version the daemon has.'
    x-ess-name: sdc.daemon.RunbookVersion
    x-ess-kind: newtype
    type: string
  sdc.daemon.RuntimeKind:
    title: RuntimeKind
    description: 'The runtime that runs the daemon''s runs (runbook serve --runtime): stub is scripted and executes nothing; loom runs the runbook through Loom''s library entry in the daemon''s process.'
    x-ess-name: sdc.daemon.RuntimeKind
    x-ess-kind: enum
    type: string
    enum:
    - stub
    - loom
  sdc.daemon.Session:
    title: Session
    description: A named group of runs of one client. Open until the client closes it; a closed session takes no new run and keeps the runs it has.
    x-ess-name: sdc.daemon.Session
    x-ess-kind: entity
    type: object
    properties:
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
      client:
        $ref: '#/x-ess-entities/sdc.daemon.ClientLabel'
      opened_at:
        type: string
        format: date-time
      closed_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Session.State'
    required:
    - session_id
    - client
    - opened_at
    - state
    additionalProperties: false
  sdc.daemon.Session.State:
    title: State
    x-ess-name: sdc.daemon.Session.State
    x-ess-kind: enum
    type: string
    enum:
    - Closed
    - Open
  sdc.daemon.SessionId:
    title: SessionId
    description: The name of a session, chosen by the client that opens it.
    x-ess-name: sdc.daemon.SessionId
    x-ess-kind: newtype
    type: string
  sdc.daemon.StepInFlight:
    title: StepInFlight
    description: 'The step of a run whose program is running now: the action the bindings bind to the program, the case it runs for and when it started, the start the event `runbook.action-started` recorded. `seconds` is the time since `started_at` by the daemon''s clock, read when the view is read.'
    x-ess-name: sdc.daemon.StepInFlight
    x-ess-kind: struct
    type: object
    properties:
      action:
        description: The action whose program (or `handoff_when` check) runs; absent when no single action of the runbook's bindings binds the program.
        type: string
      case_id:
        description: The case the program runs for; absent when the runtime names none.
        type: string
      started_at:
        description: The `at` of the event `runbook.action-started` of this step.
        type: string
        format: date-time
      seconds:
        description: Whole seconds from started_at to the moment the view is read, 0 or more.
        type: integer
    required:
    - started_at
    - seconds
    additionalProperties: false
  sdc.daemon.WorkId:
    title: WorkId
    description: 'The work/ directory of a run as a row of RunProducts: its text is the run''s id. A type of its own, not RunId, because a row of that view is the listing of a directory and not the run.'
    x-ess-name: sdc.daemon.WorkId
    x-ess-kind: newtype
    type: string
  sdc.decision.ActionId:
    title: ActionId
    description: A protocol action id, such as roadmap.approve.
    x-ess-name: sdc.decision.ActionId
    x-ess-kind: newtype
    type: string
  sdc.decision.ArtifactId:
    title: ArtifactId
    description: A case artifact id (canon-case/1 artifacts key), such as roadmap.
    x-ess-name: sdc.decision.ArtifactId
    x-ess-kind: newtype
    type: string
  sdc.decision.ArtifactRevisionCitation:
    title: ArtifactRevisionCitation
    x-ess-name: sdc.decision.ArtifactRevisionCitation
    x-ess-kind: struct
    type: object
    properties:
      artifact:
        $ref: '#/x-ess-entities/sdc.decision.ArtifactId'
      revision:
        $ref: '#/x-ess-entities/sdc.decision.Revision'
      case:
        $ref: '#/x-ess-entities/sdc.decision.CaseId'
        description: The case whose snapshot holds the artifact; absent means the request's case.
      entry:
        description: 'One entry of the artifact, for artifact goals: the entry id (product/p1). The ground rests on that entry: it must exist in the current goals layers, apply at the check''s instant (inside its validity window, not overridden by a lower layer) and still have the digest. A revision that moved since is noted (revision_moved), not refused (docs/requester.md decision 3).'
        type: string
      digest:
        description: sha256:<hex> of the cited entry as sdc-goals digest prints it; written by the grounding check when absent, so a later check sees a change.
        type: string
    required:
    - artifact
    - revision
    additionalProperties: false
  sdc.decision.AutonomyLevel:
    title: AutonomyLevel
    description: 'The run''s autonomy level, docs/autonomy-levels.md:36-42 and :205-213: A0 Manual, A1 Advised, A2 Internal, A3 To merge, A4 To release, A5 Unattended (eval runs, :41-42). The level does not decide eligibility by itself: with the request''s decision class it gives the holder (:241-256, overrides :297-320), and the guards read the holder.'
    x-ess-name: sdc.decision.AutonomyLevel
    x-ess-kind: enum
    type: string
    enum:
    - A0
    - A1
    - A2
    - A3
    - A4
    - A5
  sdc.decision.CaseId:
    title: CaseId
    description: A Canon case id (canon-case/1 id), such as IDEA-1.direction.
    x-ess-name: sdc.decision.CaseId
    x-ess-kind: newtype
    type: string
  sdc.decision.Citation:
    title: Citation
