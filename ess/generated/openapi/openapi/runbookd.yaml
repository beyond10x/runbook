  /daemon/views/events:
    get:
      operationId: sdc.daemon.EventsAfter
      summary: Events of a run after a sequence number
      description: 'The events of one run with a sequence number above `after`, in sequence order: the page the event stream serves. SSE: the language has no construct for a server-sent event stream or a subscription (ESS 0.96.0 has `asyncapi` for the events components publish, which describes a broker and not an HTTP stream), so the stream is not declared. GET /runs/{run_id}/events with `Accept: text/event-stream` streams this view: every row with sequence > after, each as one SSE event whose `id` is the row''s sequence number, then each new event as it is recorded; a reconnect sends `Last-Event-ID: n` and the stream continues with after = n; after = 0 is the whole run. Without that header the same path answers the rows as a JSON page. UNMAPPED: the design sheet (decision 4) also asks for a stream per session and one for the whole daemon, each with ids; sequence numbers are per run only, so those two streams need an order across runs that no entity here carries.'
      tags:
      - daemon
      x-ess-consistency: read_your_writes
      parameters:
      - name: run_id
        in: query
        description: Read by the view's filter as `param.run_id`; it selects which rows the view holds.
        required: true
        schema:
          $ref: '#/components/schemas/sdc.daemon.RunId'
      - name: after
        in: query
        description: Read by the view's filter as `param.after`; it selects which rows the view holds.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 'Every row of `sdc.daemon.EventsAfter`, a projection of `sdc.daemon.RunEvent`. Contains the instances where `(run_id == param.run_id and sequence > param.after)` holds. Read-your-writes: a caller that has just issued a command sees its effect here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.EventsAfter.Response'
