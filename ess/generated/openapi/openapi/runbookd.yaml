      - value
      additionalProperties: false
    - title: path_line
      type: object
      properties:
        form:
          type: string
          const: path_line
        value:
          $ref: '#/x-ess-entities/sdc.decision.PathLineCitation'
      required:
      - form
      - value
      additionalProperties: false
    - title: record_id
      type: object
      properties:
        form:
          type: string
          const: record_id
        value:
          $ref: '#/x-ess-entities/sdc.decision.RecordCitation'
      required:
      - form
      - value
      additionalProperties: false
    x-ess-union-tag: form
  sdc.decision.Consequence:
    title: Consequence
