      description: 'Submit a run of a runbook: its intake (inline), its context (a path under a daemon context root), its settings and its confinement (optional: a submit that names none runs at the daemon''s default level; a daemon with none refuses it by name, and nothing is written), and optionally an autonomy level and a decider kind (a submit that names none takes the daemon''s defaults; a kind the operator did not configure, or a level with no kind to take it, is refused before anything is written and creates no run), into a session or alone. The run is Submitted; the runtime starts it. The accepted outcome (submitted) also makes the daemon write the run''s first event: kind `runbook.submitted`, sequence 1, record {run_id, runbook_id, confinement, confinement_source, and autonomy, decider, model_route, model_route_alias and model_route_source when the run has them}, and the next position of the daemon; the run''s next sequence starts at 2, so the first event the runtime records for the run is sequence 2 (RecordRunEvent). A replayed submit (already-submitted) writes no event and creates no run; a refused submit (every error outcome) creates no run and writes none. The language cannot write a RunEvent from this command (an outcome creates or moves rows of one entity), so this is stated here and in the summaries of the daemon''s other own events, and read through the event views only: the interpreted target keeps no row for it and accepts sequence 1, the daemon refuses it as not ascending. The daemon mints the run id and the HTTP handler fills `run_id` and `daemon_id`; a client never chooses them. A client that wants a safe retry sends an `idempotency_key`: a second submit with a key already used returns the first run and creates none (outcome already-submitted, answered with the first run). The handler also reports three facts it reads from the host, because the language cannot read a file system: `runbook_known`, `context_inside_roots` and the size of the inline intake (checked here); the checks themselves are outside the language and are tested in the story daemon-skeleton-on-a-runtime-trait. The client names no daemon: `daemon_id` is an input because a guard that reads the Daemon row through a row set cannot be synthesized (ESS-SYNTH-001), while `via` plus `predicate` can. The floor guard spells the order of the two levels out, one outcome for the one floor that refuses something, because the ordered comparison `confinement_floor > input.confinement` validates but the interpreted target then accepts every level (a defect of the interpreted target of ESS 0.96.0); the outcome changes with the level names. A run that makes model calls (its decider is a model at a level above A0) takes a model route (docs/model-routes.md, section 2): the one the submit names by name in `model_route` (and per role in `model_routes`), else the daemon''s `route_policy.default`; the handler resolves it against the routes the daemon''s file declares, fills `model_route`, `model_route_alias` and `model_route_source`, and reports a route it refuses in the fact `route_refused` before anything is written. The route is recorded on the run; the runtime sends every model call of the run through the daemon''s relay to that route''s gateway, with the route''s alias as the model. Before anything is written the handler also asks the gateway of each route of the run the daemon''s file declares (`GET /ready`, `GET /v1/models` and the status of the model; docs/model-routes.md, section 3): a gateway that is not ready or does not answer refuses the submit with the HTTP status 503 `route-unavailable`, outside this specification like the 503 of a submit while the daemon drains (no outcome of the language has that status), and one that does not list the route''s alias refuses it route-refused; a route whose model cannot answer yet leaves the run accepted, and the daemon holds it WaitingForRoute (WaitForRoute). The interim route `default` of a daemon with a lone `[gateway]` and no route of its own is not asked, as before routes, nor is a submit that repeats an idempotency key already used: it is answered already-submitted with the first run. No wake is sent.'
      tags:
      - daemon
      x-ess-may-invoke:
      - sdc.daemon.Client
      requestBody:
        description: The input `sdc.daemon.SubmitRun` declares.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sdc.daemon.SubmitRun.Input'
      responses:
        '202':
          description: 'Outcomes `already-submitted` and `submitted`: the branch the specification declares for this input. Events this branch emits are listed under `published`: `SubmitReplayed` and `RunSubmitted` are not published and stay inside the component.'
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    already-submitted: '#/components/schemas/sdc.daemon.SubmitRun.already-submitted.Response'
                    submitted: '#/components/schemas/sdc.daemon.SubmitRun.submitted.Response'
                  propertyName: outcome
                oneOf:
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.already-submitted.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.submitted.Response'
        '403':
          description: 'No declared outcome: the standard refusal for an actor no grant admits: the request was authenticated as no actor, or as one `x-ess-may-invoke` does not list. It is checked before the command runs, so nothing was read, written or published, and the same request from a granted actor is decided by the command. Its body carries `refused` and `actor`, never the `outcome` and `error` a declared branch carries.'
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  actor:
                    description: The qualified name of the actor the request was authenticated as, or null where it was authenticated as none.
                    type:
                    - string
                    - 'null'
                  refused:
                    description: The standard refusal for an actor no grant admits.
                    enum:
                    - not granted
                    type: string
                required:
                - refused
                - actor
                type: object
        '409':
          description: 'Outcomes `no-daemon`, `no-session`, `below-floor` and `session-closed`: the input was acceptable and the subject is in a state this command does not act from. Resending the same request changes nothing until something else moves it.'
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    below-floor: '#/components/schemas/sdc.daemon.SubmitRun.below-floor.Response'
                    no-daemon: '#/components/schemas/sdc.daemon.SubmitRun.no-daemon.Response'
                    no-session: '#/components/schemas/sdc.daemon.SubmitRun.no-session.Response'
                    session-closed: '#/components/schemas/sdc.daemon.SubmitRun.session-closed.Response'
                  propertyName: outcome
                oneOf:
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.no-daemon.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.no-session.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.below-floor.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.session-closed.Response'
        '422':
          description: 'Outcomes `intake-too-large`, `no-runbook`, `context-outside-roots` and `route-refused`: the request was understood and refused on domain grounds. The body names the declared error and carries whatever that error declares.'
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    context-outside-roots: '#/components/schemas/sdc.daemon.SubmitRun.context-outside-roots.Response'
                    intake-too-large: '#/components/schemas/sdc.daemon.SubmitRun.intake-too-large.Response'
                    no-runbook: '#/components/schemas/sdc.daemon.SubmitRun.no-runbook.Response'
                    route-refused: '#/components/schemas/sdc.daemon.SubmitRun.route-refused.Response'
                  propertyName: outcome
                oneOf:
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.intake-too-large.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.no-runbook.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.context-outside-roots.Response'
                - $ref: '#/components/schemas/sdc.daemon.SubmitRun.route-refused.Response'
        '501':
          description: 'No declared outcome: the realization is unfinished. Either a port this command runs reported an unmet obligation, and nothing was written: `committed` is `false`. Or the command''s effect was committed and delivering what this command published to a binding failed: `committed` is `true`, the effect and its events stand, and each binding whose delivery failed keeps its event and is attempted again on a later delivery, while no other binding receives it twice. Do not retry: after a failed delivery a retry performs the command a second time.'
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  committed:
                    description: '`true` when the command''s effect and events were committed and delivering what it published failed; `false` when an unmet obligation stopped the command before anything was written.'
                    type: boolean
                  refused:
                    description: What was left unfinished, in words.
                    type: string
                required:
                - refused
                - committed
                type: object
