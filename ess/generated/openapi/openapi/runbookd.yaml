  /daemon/commands/answer-decision:
    post:
      operationId: sdc.daemon.AnswerDecision
      summary: Answer a decision
      description: 'A client answers an Open decision request of a run that waits. An answer to a request that is already answered is refused: the first answer stands. An answer to a withdrawn request (its run was cancelled or ended as orphaned) is refused as DecisionWithdrawn. When the answer stands but the runtime cannot take it up (its run is gone), the daemon writes the run event `runbook.answer-undeliverable` (record: request_id) after the request is Answered (see CancelRun for why it is stated here).'
      tags:
      - daemon
      x-ess-may-invoke:
      - sdc.daemon.Client
      requestBody:
        description: The input `sdc.daemon.AnswerDecision` declares.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sdc.daemon.AnswerDecision.Input'
      responses:
        '202':
          description: 'Outcome `answered`: the branch the specification declares for this input. Events this branch emits are listed under `published`: `DecisionAnswered` is not published and stays inside the component.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.AnswerDecision.answered.Response'
        '403':
          description: 'No declared outcome: the standard refusal for an actor no grant admits: the request was authenticated as no actor, or as one `x-ess-may-invoke` does not list. It is checked before the command runs, so nothing was read, written or published, and the same request from a granted actor is decided by the command. Its body carries `refused` and `actor`, never the `outcome` and `error` a declared branch carries.'
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  actor:
                    description: The qualified name of the actor the request was authenticated as, or null where it was authenticated as none.
                    type:
                    - string
                    - 'null'
                  refused:
                    description: The standard refusal for an actor no grant admits.
                    enum:
                    - not granted
                    type: string
                required:
                - refused
                - actor
                type: object
        '404':
          description: 'Outcome `no-request`: the branch the specification declares for this input. Events this branch emits are published to consumers and listed under `published`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.AnswerDecision.no-request.Response'
        '409':
          description: 'Outcomes `not-of-run`, `withdrawn`, `already-answered`, `no-run` and `run-not-waiting`: the input was acceptable and the subject is in a state this command does not act from. Resending the same request changes nothing until something else moves it.'
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    already-answered: '#/components/schemas/sdc.daemon.AnswerDecision.already-answered.Response'
                    no-run: '#/components/schemas/sdc.daemon.AnswerDecision.no-run.Response'
                    not-of-run: '#/components/schemas/sdc.daemon.AnswerDecision.not-of-run.Response'
