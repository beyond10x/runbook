tags:
- name: daemon
  description: 'The API of the Runbook daemon (runbookd, the same binary as runbook serve): runs, the sessions that group them, the decision requests a waiting run raises, and the ordered events each run records. HTTP carries the commands and the views; the event stream is the view EventsAfter served as server-sent events (see the note below the views). docs/layers.md says what the runtime is; the runtime behind the daemon sits behind a trait, so the daemon''s commands and views do not change with it.'
