        '422':
          description: 'Outcome `unknown-option`: the request was understood and refused on domain grounds. The body names the declared error and carries whatever that error declares.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sdc.daemon.AnswerDecision.unknown-option.Response'
