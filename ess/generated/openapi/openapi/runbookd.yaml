      type: object
    sdc.daemon.ProductsOfRun.Row:
      title: Products of a run row
      description: 'The files a run wrote under its work/ directory, in one row: GET /daemon/views/products?run_id=... (the MCP tool list_products). A view has no outcome in the language, so the refusals are the daemon''s {refused, message} answers: 404 `no such run` for a run id the daemon does not know, 403 `link` when the work/ directory itself is a link. No path of the host is in a row or a refusal.'
      x-ess-name: sdc.daemon.ProductsOfRun
      x-ess-kind: view-row
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        files:
          type: array
          items:
