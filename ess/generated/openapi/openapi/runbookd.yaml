    sdc.daemon.Delegate.Input:
      title: Delegate agent work input
      description: 'Ask the daemon for a piece of agent work on a named model route (docs/model-routes.md, section 8): the request as text, the route by name, and optionally a protocol (a runbook the daemon can run), a workspace (a directory under a daemon context root, copied into the run''s workspace), settings, a session and an idempotency key. A delegation is a run: the accepted outcome (delegated) creates the Run as SubmitRun does, with the request as its intake, at the daemon''s default level, and the daemon writes the run''s first event `runbook.submitted` (sequence 1) and its second, `runbook.delegated` (the route, the path and the protocol), before the runtime records any; cancel-run, the run views and the events work on it unchanged. With a protocol that runbook runs (path `named`); with the protocol `delegation-free`, or without one on a daemon that has no classifier route, the free run (path `free`): one agent node whose instruction is the request, on the delegation''s route, in the run''s workspace, writing `result.md`; its runbook is `delegation-free`, the handler fills `runbook_id` with it. Without a protocol on a daemon with a classifier route (`[route_policy] classifier`) the daemon takes the path when the run starts (docs/model-routes.md, section 9): `runbook_id` is `delegation` and RunDelegated holds no path; one call on the classifier route through the relay, with the request and the catalog of the daemon''s runbooks, answers a runbook and a confidence, and at 0.8 or above, when that runbook takes every input the answer fills, it runs with the request as its intake (path `classified`); below it a second call writes a protocol whose every action is the daemon''s agent node (`sdc-node delegation.free`), which the daemon checks with the loader of a runbook and runs (path `generated`). The run event `runbook.delegation-resolved` records the path, the protocol, the confidence, the classifier route and the digest of a generated protocol; the classifier''s answer and the generated protocol are files of the run''s work/ directory under `delegation/`. A call the route does not serve fails the run''s start `route-unavailable: ...`, an answer that is not the JSON asked for (after two more calls that quote the validator''s error) `classifier-answer: ...`, and a generated protocol the loader refuses `protocol-refused: <the loader''s line>` (FailRunStart, outside this command). Every model call of the run goes to that route through the daemon''s relay. The run''s result is read by its id from the view DelegationResult. The handler mints the run id and fills `run_id`, `runbook_id`, `confinement`, `route`, `model_route_alias`, `model_route_source`, `daemon_id` and `at`, and reports four facts it reads from the host: `route_declared` (the route the delegation names, or the daemon''s default route when it names none, is one the daemon declares), `runbook_known`, `context_inside_roots` and the size of the request (checked here). Before anything is written the handler also asks the route''s gateway what a submit asks (docs/model-routes.md, section 3: `GET /ready`, `GET /v1/models`, the status of the route''s model): a gateway that is not ready or does not answer refuses the delegation with 503 `route-unavailable` naming the route, the daemon''s `{refused, message}` answer, outside the language as a draining daemon''s refusal is; an alias the gateway does not list refuses it `route-refused`; a model that cannot answer yet leaves the run waiting for its route (WaitForRoute) as a submitted run waits. A delegation whose path is still open (it names no protocol on a daemon with a classifier route) is read with the classifier route as well: no classify call goes to that route before it can answer.'
      x-ess-name: sdc.daemon.Delegate
      x-ess-kind: command-input
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        request:
          description: 'The work asked for, as text: the run''s intake, at most 1 MiB.'
          type: string
        model_route:
          description: 'The route the run''s model calls take, by the name the daemon declares it under; absent: the daemon''s default route, and a daemon with none refuses the delegation as route-refused. Never an address, a token or an alias.'
          type: string
        protocol:
          $ref: '#/components/schemas/sdc.daemon.RunbookId'
          description: 'The runbook to run with the request as its intake, or delegation-free for the free run; absent: the daemon classifies the request when it has a classifier route, else the free run.'
        workspace:
          $ref: '#/components/schemas/sdc.daemon.ContextPath'
          description: 'A directory under one of the daemon''s context roots: its files are copied into the run''s workspace before the run starts.'
        settings:
          $ref: '#/components/schemas/sdc.daemon.RunSettings'
        session_id:
          $ref: '#/components/schemas/sdc.daemon.SessionId'
        idempotency_key:
          $ref: '#/components/schemas/sdc.daemon.IdempotencyKey'
        runbook_id:
          $ref: '#/components/schemas/sdc.daemon.RunbookId'
          description: 'The runbook the run takes: the protocol; delegation-free for the free run; delegation for a delegation the daemon classifies when its run starts. The handler fills it.'
        confinement:
          $ref: '#/components/schemas/sdc.daemon.ConfinementLevel'
          description: 'The daemon''s default level: a delegation names none. The handler fills it; a daemon with no default refuses the delegation by name (400) and writes nothing.'
        route:
          $ref: '#/components/schemas/sdc.daemon.RouteName'
          description: 'The route the run takes, by name: model_route, else the daemon''s default route. The handler fills it.'
        model_route_alias:
          description: The alias of route at its gateway, as the daemon's file declares it. The handler fills it.
          type: string
        model_route_source:
          $ref: '#/components/schemas/sdc.daemon.RouteSource'
          description: run when the delegation named its route, default when it took route_policy.default. The handler fills it.
        path:
          $ref: '#/components/schemas/sdc.daemon.DelegationPath'
          description: named when the delegation names a runbook, free for the free run; absent for a delegation the daemon classifies when its run starts. The handler fills it.
        route_declared:
          type: boolean
        runbook_known:
          type: boolean
        context_inside_roots:
          type: boolean
        daemon_id:
          $ref: '#/components/schemas/sdc.daemon.DaemonId'
        at:
          type: string
          format: date-time
      required:
      - run_id
      - request
      - settings
      - runbook_id
      - confinement
      - route
      - model_route_alias
      - model_route_source
      - route_declared
      - runbook_known
      - context_inside_roots
      - daemon_id
      - at
      additionalProperties: false
