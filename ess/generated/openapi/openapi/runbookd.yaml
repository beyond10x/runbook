    sdc.decision.AutonomyLevel:
      title: AutonomyLevel
      description: 'The run''s autonomy level, docs/autonomy-levels.md:36-42 and :205-213: A0 Manual, A1 Advised, A2 Internal, A3 To merge, A4 To release, A5 Unattended (eval runs, :41-42). The level does not decide eligibility by itself: with the request''s decision class it gives the holder (:241-256, overrides :297-320), and the guards read the holder.'
      x-ess-name: sdc.decision.AutonomyLevel
      x-ess-kind: enum
      type: string
      enum:
      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
    sdc.decision.CaseId:
      title: CaseId
      description: A Canon case id (canon-case/1 id), such as IDEA-1.direction.
      x-ess-name: sdc.decision.CaseId
      x-ess-kind: newtype
      type: string
    sdc.decision.Citation:
      title: Citation
      description: 'Where a ground is: path:line, a record id, artifact@revision, or one entry of an artifact (goals@<revision>#<entry id>). A program checks that each resolves (tools/decision-grounds.sh; a goals entry through sdc-goals ground).'
      x-ess-name: sdc.decision.Citation
      x-ess-kind: union
      oneOf:
      - title: artifact_revision
        type: object
        properties:
          form:
            type: string
            const: artifact_revision
          value:
            $ref: '#/components/schemas/sdc.decision.ArtifactRevisionCitation'
        required:
        - form
        - value
        additionalProperties: false
      - title: path_line
        type: object
        properties:
          form:
            type: string
            const: path_line
          value:
            $ref: '#/components/schemas/sdc.decision.PathLineCitation'
        required:
        - form
        - value
        additionalProperties: false
      - title: record_id
        type: object
        properties:
          form:
            type: string
            const: record_id
          value:
            $ref: '#/components/schemas/sdc.decision.RecordCitation'
        required:
        - form
        - value
        additionalProperties: false
      x-ess-union-tag: form
    sdc.decision.Consequence:
      title: Consequence
      description: What choosing the option does to the protocol.
      x-ess-name: sdc.decision.Consequence
      x-ess-kind: struct
      type: object
      properties:
        admits:
          description: Actions that become admissible.
          type: array
          items:
            $ref: '#/components/schemas/sdc.decision.ActionId'
        blocks:
          description: Actions that become blocked.
          type: array
          items:
            $ref: '#/components/schemas/sdc.decision.ActionId'
        grant:
          $ref: '#/components/schemas/sdc.decision.Grant'
          description: The authority entry the option writes, for an approval.
        answer:
          description: The answer written to questions.yaml, for a question.
          type: string
        produces:
          $ref: '#/components/schemas/sdc.decision.ProducedDocument'
          description: The kind of Canon record the option produces when decided; absent when it produces none, such as 'leave it untaken' on an outcome request. Only a decided option that produces a record goes through RecordProduced before the run resumes.
      required:
      - admits
      - blocks
      additionalProperties: false
    sdc.decision.DecisionOption:
      title: DecisionOption
      description: One option of a decision request.
      x-ess-name: sdc.decision.DecisionOption
      x-ess-kind: struct
      type: object
      properties:
        letter:
          $ref: '#/components/schemas/sdc.decision.OptionLetter'
        does:
          description: What the option does, one sentence.
          type: string
        cost:
          description: 'What it costs: work, time, scope or risk.'
          type: string
        consequence:
          $ref: '#/components/schemas/sdc.decision.Consequence'
      required:
      - letter
      - does
      - cost
      - consequence
      additionalProperties: false
    sdc.decision.Grant:
      title: Grant
      description: A canon-authority/1 decision (documents.md:123-132).
      x-ess-name: sdc.decision.Grant
      x-ess-kind: enum
      type: string
      enum:
      - granted
      - denied
    sdc.decision.Ground:
      title: Ground
      description: 'One ground of a recommendation: its source kind, a citation that resolves, the option it supports (or the free answer) and how.'
      x-ess-name: sdc.decision.Ground
      x-ess-kind: struct
      type: object
      properties:
        source:
          $ref: '#/components/schemas/sdc.decision.GroundSource'
        citation:
          $ref: '#/components/schemas/sdc.decision.Citation'
        supports:
          $ref: '#/components/schemas/sdc.decision.OptionLetter'
          description: 'The option the ground supports; absent: it supports the recommended free answer.'
        how:
          description: How the cited text supports the option, one sentence.
          type: string
      required:
      - source
      - citation
      - how
      additionalProperties: false
    sdc.decision.GroundSource:
      title: GroundSource
      description: 'The kind of source a ground cites. idea: the person''s own input and its dissection items (work/idea.yaml, work/dissection.yaml), which the decider cites (d1 to d4 in runs/trial-todo-1/decisions.jsonl). goals: one entry of the requester''s goals document (sdc.goals/1, docs/requester.md § 2), cited as artifact_revision of artifact goals with its entry id and the entry''s digest, displayed goals@<revision>#<entry id>.'
      x-ess-name: sdc.decision.GroundSource
      x-ess-kind: enum
      type: string
      enum:
      - idea
      - vision
      - requirement
      - prior_decision
      - prd
      - story
      - spec
      - policy
      - evidence_record
      - autonomy_rule
      - goals
    sdc.decision.OptionLetter:
      title: OptionLetter
      description: 'The letter of an option: A, B, C, in the order presented.'
      x-ess-name: sdc.decision.OptionLetter
      x-ess-kind: newtype
      type: string
    sdc.decision.PathLineCitation:
      title: PathLineCitation
      x-ess-name: sdc.decision.PathLineCitation
      x-ess-kind: struct
      type: object
      properties:
        path:
          description: A file path relative to the repository root.
          type: string
        line:
          type: integer
        line_end:
          type: integer
        digest:
          description: sha256:<hex> of the cited lines when the ground was checked; a different digest later means the ground changed.
          type: string
      required:
      - path
      - line
      additionalProperties: false
    sdc.decision.Principal:
      title: Principal
      description: 'Who decides: a person''s name (operator), decider:<kind> (decider:model, decider:approve, decider:reject; decider:haiku in runs before D149), or silence for a default taken because nobody answered. Recorded as given, as Canon records a principal (canon-decisions/1).'
      x-ess-name: sdc.decision.Principal
      x-ess-kind: newtype
      type: string
    sdc.decision.ProducedDocument:
      title: ProducedDocument
      description: 'The Canon record a decided request produced. canon_authority: an AuthorityDecision entry bound to the case revision (approval). canon_decisions: an ExplicitDecision entry (outcome). canon_evidence: the approval evidence a manual action produced (context_approval, vision_approval, roadmap_approval). artifact_revision: the new revision of questions.yaml holding the answer (question).'
      x-ess-name: sdc.decision.ProducedDocument
      x-ess-kind: enum
      type: string
      enum:
      - canon_authority
      - canon_decisions
      - canon_evidence
      - artifact_revision
    sdc.decision.RecordCitation:
      title: RecordCitation
      x-ess-name: sdc.decision.RecordCitation
      x-ess-kind: struct
      type: object
      properties:
        store:
          $ref: '#/components/schemas/sdc.decision.RecordStore'
        record_id:
          type: string
      required:
      - store
      - record_id
      additionalProperties: false
    sdc.decision.RecordStore:
      title: RecordStore
      description: 'Where a cited record id is looked up: the decision request log, a case''s evidence/ (canon-evidence/1 id), authority.json, decisions.json, or an AEP planning store (kind:name).'
      x-ess-name: sdc.decision.RecordStore
      x-ess-kind: enum
      type: string
      enum:
      - sdc_decisions
      - canon_evidence
      - canon_authority
      - canon_decisions
      - aep_artifact
    sdc.decision.Revision:
      title: Revision
      description: An artifact or case revision as the case snapshot writes it.
      x-ess-name: sdc.decision.Revision
      x-ess-kind: newtype
      type: string
    sdc.decision.Strength:
      title: Strength
      description: 'How strongly the grounds support the recommended option. none: the request carries no recommendation (stored before Recommend and after a withheld one; a Recommend sending none is refused). strong: a vision, requirement, PRD, story or spec states it, or a prior decision on the same question and subject stands with its grounds unchanged. moderate: a policy, an autonomy rule or an evidence record supports it by inference. weak: the grounds make it plausible only.'
      x-ess-name: sdc.decision.Strength
      x-ess-kind: enum
      type: string
      enum:
      - none
      - weak
      - moderate
      - strong
x-ess-entities:
  sdc.daemon.CaseKey:
    title: CaseKey
    description: 'One case of one run as a row of RunCase: the run''s id and the case''s id. A type of its own, not RunId, because a row is a case and not the run.'
    x-ess-name: sdc.daemon.CaseKey
    x-ess-kind: newtype
    type: string
  sdc.daemon.CaseState:
    title: CaseState
    description: 'Where a case stands as the daemon reads its run''s tree: Ended when it has an outcome; else AwaitingPerson or AwaitingAuthority when its last stop waits on that and the run waits on a decision; else Stuck when its last stop is Stuck or BudgetSpent and the run ended by its tree (Ended and not orphaned; a wait or a cancel that ended with the run, or an orphaned run, leaves it Open); else Running when the run''s step in flight names the case; else Open. A type and not a lifecycle: no command moves a case, the daemon reads where it stands.'
    x-ess-name: sdc.daemon.CaseState
    x-ess-kind: enum
    type: string
    enum:
    - Open
    - Running
    - AwaitingPerson
    - AwaitingAuthority
    - Stuck
    - Ended
  sdc.daemon.CatalogId:
    title: CatalogId
    description: 'The catalog as a row of DaemonCatalog: its text is the daemon''s id. A type of its own, not DaemonId, because the row is what the daemon reads of its file, its gateways and its runbooks when a client asks, and not the configuration row.'
    x-ess-name: sdc.daemon.CatalogId
    x-ess-kind: newtype
    type: string
  sdc.daemon.CatalogRoute:
    title: CatalogRoute
    description: 'A declared model route as the catalog lists it: what the view Routes says of it (the name, the gateway by name, the alias, the kind, the wires, the status, the phase and when the gateway was read, with the context length and the tool calling the gateway listed), and what the daemon''s file declares of it beside its address: the prices and the wait. No address, token or token file.'
    x-ess-name: sdc.daemon.CatalogRoute
    x-ess-kind: struct
    type: object
    properties:
      route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
      gateway:
        description: The name of the route's gateway in the daemon's file, never its address.
        type: string
      alias:
        type: string
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.ModelRouteKind'
      wires:
        type: array
        items:
          type: string
      status:
        $ref: '#/x-ess-entities/sdc.daemon.RouteStatus'
      phase:
        type: string
      max_model_len:
        description: The context length `GET /v1/models` gave for the alias; absent when the gateway gave none.
        type: integer
      tool_calling:
        description: Whether the model calls tools, as `GET /v1/models` gave it for the alias; absent when the gateway gave nothing.
        type: boolean
      price_in_micro_usd_per_mtok:
        description: 'What a call on the route books per million input tokens; absent when the file declares no price: the call books its reservation and its cost is not known.'
        type: integer
      price_out_micro_usd_per_mtok:
        description: The same per million output tokens.
        type: integer
      start_wait_seconds:
        description: How long a run waits for the route's model to be ready; absent when the file sets none.
        type: integer
      read_at:
        description: When the daemon read the gateway for this route.
        type: string
        format: date-time
    required:
    - route
    - gateway
    - alias
    - kind
    - wires
    - status
    - read_at
    additionalProperties: false
  sdc.daemon.CatalogRunbook:
    title: CatalogRunbook
    description: 'A runbook a delegation may name as its protocol, as the catalog lists it: the name and version of the view Runbooks, its purpose in one line and its description as its root protocol gives them, the inputs a delegation''s request fills, and its route entries with the daemon''s admission of each. A runbook whose entries cannot be admitted is listed with the reason. No path of the host.'
    x-ess-name: sdc.daemon.CatalogRunbook
    x-ess-kind: struct
    type: object
    properties:
      runbook_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookName'
      runbook_version:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookVersion'
      title:
        description: 'Its purpose in one line: the root protocol''s title, else the first sentence of its description; absent when it has neither.'
        type: string
      description:
        description: The root protocol's description, at most 2000 characters; absent when it has none.
        type: string
      inputs:
        description: 'The artifacts a delegation''s request becomes: `idea` when the runbook''s root bindings place it (the request is the run''s intake); none when they place no idea, and such a runbook cannot take a request.'
        type: array
        items:
          type: string
      route_entries:
        description: 'One per role of its route entries file, by role; none when it has no such file: every declared route may serve it.'
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.RouteEntry'
      routes_allowed:
        description: The routes the file allows to serve the runbook; absent when it narrows nothing.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.RouteName'
      admitted:
        description: Whether every route entry is admitted and the file could be read.
        type: boolean
      refusal:
        description: 'Why the runbook''s route entries cannot be admitted: the file''s own fault, else the reason of each entry that is not admitted, joined by `; `. Absent when admitted.'
        type: string
    required:
    - runbook_id
    - inputs
    - route_entries
    - admitted
    additionalProperties: false
  sdc.daemon.ClientLabel:
    title: ClientLabel
    description: 'A label the client gives when it opens a session: free text, at most 200 characters, for display. It grants nothing: who may call is decided by the bearer token alone, and the token''s subject is not a member of any entity.'
    x-ess-name: sdc.daemon.ClientLabel
    x-ess-kind: newtype
    type: string
    maxLength: 200
    x-ess-invariants:
    - value.count <= 200
  sdc.daemon.ConfinementLevel:
    title: ConfinementLevel
    description: 'How strongly a run is sandboxed, weakest first: the runtime''s names. local is not confined; linux is. oci and pod are the runtime''s planned levels and are not in the set until it offers them. A submit that names no level runs at the daemon''s default level (runbook serve --default-confinement, or `confinement` of runbook.toml); a daemon with none refuses the submit by name and writes nothing, as the binary has no built-in default; the handler fills it. The daemon''s floor is linux unless it is started lower; the default is never below the floor, and a daemon whose default is below its floor does not start. local must be asked for by name or set as the default, and is refused under a linux floor.'
    x-ess-name: sdc.daemon.ConfinementLevel
    x-ess-kind: enum
    type: string
    enum:
    - local
    - linux
  sdc.daemon.ConfinementSource:
    title: ConfinementSource
    description: 'Where a run''s level came from: submit (the client named it) or daemon-default (the client named none and the daemon''s default level applied). There is no third source: a daemon with no default refuses a submit that names none.'
    x-ess-name: sdc.daemon.ConfinementSource
    x-ess-kind: enum
    type: string
    enum:
    - submit
    - daemon-default
  sdc.daemon.ContextPath:
    title: ContextPath
    description: A directory on the daemon's host, given as an absolute path. The daemon accepts it only when it lies under one of its context roots (runbook serve --context-root <dir>, repeatable; none given means no context from a path), and copies it into the run's workspace before the run starts.
    x-ess-name: sdc.daemon.ContextPath
    x-ess-kind: newtype
    type: string
  sdc.daemon.Daemon:
    title: Daemon
    description: 'The configuration row of the daemon: what it was started with and what every run is held to. One row, created when the daemon starts.'
    x-ess-name: sdc.daemon.Daemon
    x-ess-kind: entity
    type: object
    properties:
      daemon_id:
        $ref: '#/x-ess-entities/sdc.daemon.DaemonId'
      confinement_floor:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
        description: The lowest level the daemon takes (runbook serve --min-confinement). A run below it is refused.
      principal:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: 'Who the daemon acts as: person:<id> or agent:<id> (runbook serve --principal, required, no default). Fixed for the life of the process: no command, header, MCP input or HTTP input changes it. The daemon passes it, and nothing a client typed, to the runtime as the principal of an answer.'
      started_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Daemon.State'
    required:
    - daemon_id
    - confinement_floor
    - principal
    - started_at
    - state
    additionalProperties: false
  sdc.daemon.Daemon.State:
    title: State
    x-ess-name: sdc.daemon.Daemon.State
    x-ess-kind: enum
    type: string
    enum:
    - Up
  sdc.daemon.DaemonCatalog:
    title: DaemonCatalog
    description: 'What a delegation may name on this daemon, read when a client asks for the view Catalog: one row with the declared model routes (the view Routes with the prices and the wait the file declares), the runbooks a delegation may name as its protocol (the view Runbooks with their purpose, their inputs and the admission of their route entries) and the terms of a delegation. The daemon reads its file when it starts, the gateways as the view Routes does and the runbooks'' files when the client asks; the language cannot read a file or a gateway, so no command creates or changes the row, as with Runbook.'
    x-ess-name: sdc.daemon.DaemonCatalog
    x-ess-kind: entity
    type: object
    properties:
      catalog_id:
        $ref: '#/x-ess-entities/sdc.daemon.CatalogId'
      routes:
        description: The declared routes, in order of name; none when the file declares none.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.CatalogRoute'
      runbooks:
        description: The runbooks of the view Runbooks, in order of name.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.CatalogRunbook'
      delegation:
        $ref: '#/x-ess-entities/sdc.daemon.DelegationTerms'
      state:
        $ref: '#/x-ess-entities/sdc.daemon.DaemonCatalog.State'
    required:
    - catalog_id
    - routes
    - runbooks
    - delegation
    - state
    additionalProperties: false
  sdc.daemon.DaemonCatalog.State:
    title: State
    x-ess-name: sdc.daemon.DaemonCatalog.State
    x-ess-kind: enum
    type: string
    enum:
    - Read
  sdc.daemon.DaemonId:
    title: DaemonId
    description: 'The id of the one daemon the specification describes: the configuration row it holds is keyed by it. The HTTP handler fills it; one process is one daemon.'
    x-ess-name: sdc.daemon.DaemonId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DeciderKind:
    title: DeciderKind
    description: 'The name of a decider kind the operator configured (a table [deciders.<kind>] of runbook.toml): rule or model. A run names a kind, never a program or a path; a kind that is not configured is refused at the submit before anything is written.'
    x-ess-name: sdc.daemon.DeciderKind
    x-ess-kind: newtype
    type: string
    minLength: 1
    maxLength: 63
    x-ess-invariants:
    - value.count >= 1
    - value.count <= 63
  sdc.daemon.DecisionArtifact:
    title: DecisionArtifact
    description: 'What a decision request read from its case carries beside its question and its options: the recommendation, its grounds and whether the request takes a free answer (docs/engine.md, ''A request read from the case''). The runtime reads it from the case and never writes it; a request the runtime built itself has none, and only a request that has one refuses an answer that names none of its options (AnswerDecision, unknown-option).'
    x-ess-name: sdc.daemon.DecisionArtifact
    x-ess-kind: struct
    type: object
    properties:
      recommended_option:
        $ref: '#/x-ess-entities/sdc.decision.OptionLetter'
        description: The letter of the option the case recommends.
      recommended_answer:
        description: A free answer the case recommends in place of an option, for a question.
        type: string
      recommendation_strength:
        $ref: '#/x-ess-entities/sdc.decision.Strength'
        description: How strongly the grounds support the recommendation; none where the request carries no recommendation.
      grounds:
        description: The grounds of the recommendation, each with a citation the runtime checked before the request opened.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.decision.Ground'
      free_answer:
        description: Whether an answer that names no option is taken as a free answer (a question request).
        type: boolean
    required:
    - recommendation_strength
    - grounds
    - free_answer
    additionalProperties: false
  sdc.daemon.DecisionRequest:
    title: DecisionRequest
    description: 'A question a waiting run raised, as a mirror of the runtime''s decision request: the daemon copies id, case, action, capability, question and options from the runtime''s record and adds the run id. Once a client answered, it holds the answer and who gave it. The runbook''s decision contract (sdc.decision) stays the rule for who may answer: the daemon passes the answer and the principal to the runtime, which decides. A request is Withdrawn when its run is cancelled or ended as orphaned (CancelRun and EndOrphanedRun move every Open request of the run in their own step) or when the runtime withdraws it (WithdrawDecision): it stays on record, shows no more as open, and takes no answer.'
    x-ess-name: sdc.daemon.DecisionRequest
    x-ess-kind: entity
    type: object
    properties:
      request_id:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequestId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: decision_requests
          kind: owns
          source: sdc.daemon.Run
          target: sdc.daemon.DecisionRequest
          cardinality: many
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      case_id:
        description: The case the runtime opened the request for.
        type: string
      action:
        type: string
      capability:
        type: string
      question:
        type: string
      options:
        description: The options of a request read from its case (DecisionArtifact) are the case's, in the contract's shape; a request the runtime built itself names each option by the answer that takes it and its effect.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.decision.DecisionOption'
      artifact:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionArtifact'
        description: What the request read from its case; absent for a request the runtime built itself.
      opened_at:
        type: string
        format: date-time
      answer:
        description: The option letter, or the free text for a question that takes one; present once Answered.
        type: string
      answered_by:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: 'The label the client gave (at most 200 characters): stored and shown, never passed to the runtime and never the principal. A rule or a decider of the run answers under its own name instead, `rule:<name>` or `decider:<kind>`, and a client cannot take a name that starts with either, in any case, or with `router:`, nor one with a non-ASCII or a control character (400).'
      principal:
        $ref: '#/x-ess-entities/sdc.decision.Principal'
        description: The daemon's principal at the answer, the one the runtime was given; present once Answered. Absent in a record written before the daemon had one. For an answer of a rule or a decider it is that rule's or decider's own principal (`decider:<verdict>`, `rule:<name>`), never the daemon's, which may be a person's.
      answered_at:
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.DecisionRequest.State'
    required:
    - request_id
    - run_id
    - case_id
    - action
    - capability
    - question
    - options
    - opened_at
    - state
    additionalProperties: false
  sdc.daemon.DecisionRequest.State:
    title: State
    x-ess-name: sdc.daemon.DecisionRequest.State
    x-ess-kind: enum
    type: string
    enum:
    - Answered
    - Open
    - Withdrawn
  sdc.daemon.DecisionRequestId:
    title: DecisionRequestId
    description: 'The id of a decision request: the runtime''s, copied. A request id that is already taken cannot occur, because the runtime mints it; the specification has no refusal for it.'
    x-ess-name: sdc.daemon.DecisionRequestId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DelegateMember:
    title: DelegateMember
    description: A member of the input of Delegate a client sends, as the OpenAPI document of the daemon gives it (the members the handler fills are left out).
    x-ess-name: sdc.daemon.DelegateMember
    x-ess-kind: struct
    type: object
    properties:
      name:
        type: string
      required:
        type: boolean
      summary:
        description: What the document says of it.
        type: string
      max_length:
        description: The most characters it may hold, where the document bounds it.
        type: integer
    required:
    - name
    - required
    additionalProperties: false
  sdc.daemon.Delegation:
    title: Delegation
    description: 'What a delegation''s run has come to, as the daemon reads it when a client asks for the view DelegationResult: one row per run that a Delegate created. The route, the path and the protocol are the run''s event `runbook.delegated`, and for a delegation the daemon classified its event `runbook.delegation-resolved` (path, protocol, confidence, classifier route and the digest of a generated protocol, recorded when the run started); the state, the outcome and the failure are the Run''s; the calls, the tokens and the cost are the sum of the run''s events `runbook.model-call` (one per call the relay booked); the result text is the file result.md of the run''s work/ directory, read through the reader of ProductOfRun (no link followed, at most `result_limit` bytes), and the products are the paths ProductsOfRun lists. The language cannot read a file system, so no command creates or changes a row, as with RunProducts.'
    x-ess-name: sdc.daemon.Delegation
    x-ess-kind: entity
    type: object
    properties:
      delegation_id:
        $ref: '#/x-ess-entities/sdc.daemon.DelegationId'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: run
          kind: references
          source: sdc.daemon.Delegation
          target: sdc.daemon.Run
          cardinality: one
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      run_state:
        $ref: '#/x-ess-entities/sdc.daemon.Run.State'
        description: 'Where the run stands. Not `state`: that member of an entity is its lifecycle, and no command moves a row of this one.'
      outcome:
        $ref: '#/x-ess-entities/sdc.daemon.RunOutcome'
        description: The run's outcome once it Ended.
      failure:
        description: Why the run failed to start, or what failed it after it started (the runtime's reason); absent otherwise.
        type: string
      route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
        description: The model route of the run, by name.
        x-ess-relation:
          name: route
          kind: references
          source: sdc.daemon.Delegation
          target: sdc.daemon.ModelRoute
          cardinality: one
          via: route
          $ref: '#/x-ess-entities/sdc.daemon.ModelRoute'
      route_phase:
        description: 'The last phase the gateway gave of a route of the run that could not answer: set while the run waits for its route and when it ended `stopped: route`; absent for a run that never waited.'
        type: string
      path:
        $ref: '#/x-ess-entities/sdc.daemon.DelegationPath'
        description: Absent while the daemon classifies the delegation (from its submit until its run starts, or fails to).
      protocol:
        description: 'The protocol the run runs, by the id its document declares: the named runbook, delegation-free, the runbook the classifier picked, or the id of the generated protocol; absent while the path is.'
        type: string
      confidence:
        description: The classifier's confidence, a number from 0 to 1, for a classified or generated delegation; null for the paths named and free.
      classifier_route:
        description: The route of the classify and build calls, by name, for a delegation the daemon classified.
        type: string
      protocol_digest:
        description: sha256:<hex> of the protocol document the builder wrote, for a generated delegation.
        type: string
      result_text:
        description: The text of result.md in the run's work/ directory, at most `result_limit` bytes; absent while the run has written none, and for a file that is not text.
        type: string
      result_truncated:
        description: 'True when result.md holds more than `result_limit` bytes: `result_text` is its start.'
        type: boolean
      result_limit:
        description: 'The most bytes of result.md the view answers: 1048576.'
        type: integer
      products:
        description: The paths of the files of the run's work/ directory, as ProductsOfRun lists them.
        type: array
        items:
          type: string
      calls:
        description: The model calls the relay booked for the run.
        type: integer
      input_tokens:
        description: The input tokens those calls reported; a call that reported none adds 0.
        type: integer
      output_tokens:
        type: integer
      cost_micro_usd:
        description: 'What the calls booked: the route''s declared price times the tokens, else the reservation of a call of unknown cost.'
        type: integer
      cost_known:
        description: False when any call was booked at its reservation because its cost was not known.
        type: boolean
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Delegation.State'
    required:
    - delegation_id
    - run_id
    - run_state
    - route
    - result_truncated
    - result_limit
    - products
    - calls
    - input_tokens
    - output_tokens
    - cost_micro_usd
    - cost_known
    - state
    additionalProperties: false
  sdc.daemon.Delegation.State:
    title: State
    x-ess-name: sdc.daemon.Delegation.State
    x-ess-kind: enum
    type: string
    enum:
    - Read
  sdc.daemon.DelegationId:
    title: DelegationId
    description: 'A delegation as a row of Delegation: its text is the run''s id. A type of its own, not RunId, because a row is what the daemon reads of the run''s record and files, not the run.'
    x-ess-name: sdc.daemon.DelegationId
    x-ess-kind: newtype
    type: string
  sdc.daemon.DelegationPath:
    title: DelegationPath
    description: 'How a delegation became a run (docs/model-routes.md, section 9): named (it named a protocol, and that runbook runs with the request as its intake), free (the free run, one agent node whose instruction is the request, writing result.md: asked for by the protocol delegation-free, or taken by a delegation that names no protocol on a daemon without a classifier route), classified (it named none, and one call on the classifier route picked a runbook of the daemon at or above the threshold of confidence, 0.8) or generated (the classifier''s confidence was below it, and one call on the classifier route wrote a protocol of the daemon''s parts, which the loader accepted).'
    x-ess-name: sdc.daemon.DelegationPath
    x-ess-kind: enum
    type: string
    enum:
    - named
    - free
    - classified
    - generated
  sdc.daemon.DelegationTerms:
    title: DelegationTerms
    description: 'What a delegation on this daemon takes and where it goes: the members of Delegate, the paths a delegation may take here, the route of one that names none, the route of the classify and build calls, the level every delegation runs at and the most bytes of a request.'
    x-ess-name: sdc.daemon.DelegationTerms
    x-ess-kind: struct
    type: object
    properties:
      members:
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.DelegateMember'
      paths:
        description: named when the daemon can run a runbook the catalog lists; free when it runs the free run. A daemon that lists neither takes no delegation.
        type: array
        items:
          $ref: '#/x-ess-entities/sdc.daemon.DelegationPath'
      default_route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
        description: '`route_policy.default`: the route of a delegation that names none; absent: a delegation must name one.'
      classifier_route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
        description: '`route_policy.classifier`: the route of a delegation''s classify and build calls; absent when the file names none.'
      confinement:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
        description: 'The daemon''s default level, the level of every delegation; absent: the daemon has none and refuses every delegation.'
      request_limit:
        description: 'The most bytes of a request: 1048576.'
        type: integer
    required:
    - members
    - paths
    - request_limit
    additionalProperties: false
  sdc.daemon.EventId:
    title: EventId
    description: The id the daemon gives a recorded event. It is the row's identity only; the stream's id is the event's position.
    x-ess-name: sdc.daemon.EventId
    x-ess-kind: newtype
    type: string
  sdc.daemon.EventKind:
    title: EventKind
    description: 'Open text: the kind of the runtime''s run-log line, copied. Events the daemon writes itself have a kind that starts with `runbook.`, and the command that writes each one declares it: runbook.submitted (SubmitRun), runbook.cancel-requested (CancelRun), runbook.start-failed (FailRunStart), runbook.run-orphaned (EndOrphanedRun), runbook.answer-undeliverable (AnswerDecision) and runbook.runtime-failed (written by the daemon just before it issues EndRun with the outcome runtime-failure) and runbook.action-started (written by the daemon when the runtime tells that a program of an action, or its `handoff_when` check, is about to start, before the program starts; record: case, action, role (`program` or `check`) and try, each absent when unknown; the language cannot write a RunEvent from a command, so it is stated here, and the view RunDetail shows the step while the program runs). Not a closed set for the runtime''s own kinds.'
    x-ess-name: sdc.daemon.EventKind
    x-ess-kind: newtype
    type: string
  sdc.daemon.IdempotencyKey:
    title: IdempotencyKey
    description: 'Optional text, at most 200 characters, unique per daemon, that a client sends to retry a submit safely: a second submit with a key already used returns the first run and creates none.'
    x-ess-name: sdc.daemon.IdempotencyKey
    x-ess-kind: newtype
    type: string
    maxLength: 200
    x-ess-invariants:
    - value.count <= 200
  sdc.daemon.ModelRoute:
    title: ModelRoute
    description: 'A model route the daemon declares: a name, the gateway it goes through ([gateways.<name>] of runbook.toml; a lone [gateway] table is the gateway `default`), the gateway''s alias of the model and its kind (a daemon that declares no route but has a lone [gateway] table and a model decider declares the interim route `default` on that gateway: kind hosted, its alias the model of the decider, no price), with what the daemon last read of the gateway: the wires `GET /v1/models` lists for the alias and the route''s status. The daemon reads its file when it starts and the gateway when a client asks for the view Routes, at most once every 15 seconds (the rows of a read are kept and answered until then); the language cannot read a file or a gateway, so no command creates or changes a row, as with Runbook. No address, token, token file or price is in a row.'
    x-ess-name: sdc.daemon.ModelRoute
    x-ess-kind: entity
    type: object
    properties:
      route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
      gateway:
        description: The name of the route's gateway in the daemon's file, never its address.
        type: string
      alias:
        description: 'The model''s alias at the gateway: what the gateway''s `GET /v1/models` lists and a model call names.'
        type: string
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.ModelRouteKind'
      wires:
        description: The wires the gateway lists for the alias (chat, responses, messages), in its order; none when the gateway did not answer or does not list the alias.
        type: array
        items:
          type: string
      status:
        $ref: '#/x-ess-entities/sdc.daemon.RouteStatus'
      phase:
        description: The phase the gateway gave for the route's model (ready, starting, stopped, stopping, unreachable, or a phase the gateway adds later); absent when no status of the model was read.
        type: string
      max_model_len:
        description: The context length `GET /v1/models` gave for the alias; absent when the gateway gave none.
        type: integer
      tool_calling:
        description: Whether the model calls tools, as `GET /v1/models` gave it for the alias (a boolean `tool_calling`); absent when the gateway gave nothing.
        type: boolean
      read_at:
        description: When the daemon read the gateway for this row.
        type: string
        format: date-time
      state:
        $ref: '#/x-ess-entities/sdc.daemon.ModelRoute.State'
    required:
    - route
    - gateway
    - alias
    - kind
    - wires
    - status
    - read_at
    - state
    additionalProperties: false
  sdc.daemon.ModelRoute.State:
    title: State
    x-ess-name: sdc.daemon.ModelRoute.State
    x-ess-kind: enum
    type: string
    enum:
    - Declared
  sdc.daemon.ModelRouteKind:
    title: ModelRouteKind
    description: 'What stands behind a route''s alias at its gateway: managed (a model on a pod the gateway starts and stops), hosted (a fixed upstream, nothing started) or local (a model server on the gateway''s machine, such as Ollama). The daemon''s file says which; the daemon reads the status of a managed or a local route from the gateway, and sends a hosted route no call to probe it.'
    x-ess-name: sdc.daemon.ModelRouteKind
    x-ess-kind: enum
    type: string
    enum:
    - managed
    - hosted
    - local
  sdc.daemon.ProductFile:
    title: ProductFile
    description: 'One file of a run''s work/ directory as the listing names it: a regular file with one name, reached through no link.'
    x-ess-name: sdc.daemon.ProductFile
    x-ess-kind: struct
    type: object
    properties:
      path:
        $ref: '#/x-ess-entities/sdc.daemon.ProductPath'
      size:
        description: Its length in bytes.
        type: integer
      modified_at:
        description: When it was last written.
        type: string
        format: date-time
    required:
    - path
    - size
    - modified_at
    additionalProperties: false
  sdc.daemon.ProductKind:
    title: ProductKind
    description: 'What a read found: text (the bytes shown are UTF-8 without a NUL byte; a partial character at a cut does not count) or binary (anything else: no text is answered).'
    x-ess-name: sdc.daemon.ProductKind
    x-ess-kind: enum
    type: string
    enum:
    - text
    - binary
  sdc.daemon.ProductPath:
    title: ProductPath
    description: 'The path of a file of a run, relative to the run''s work/ directory (its workspace, which the cases of the run share): names joined by `/`, none of them `..` and none starting with a dot. Never absolute and never a path of the host.'
    x-ess-name: sdc.daemon.ProductPath
    x-ess-kind: newtype
    type: string
  sdc.daemon.RoleRoutes:
    title: RoleRoutes
    description: 'The route of each named role of a run (`writer`, `review`, ...) besides the role `default`: a role is the word a model process of the run names as its model, and the daemon''s relay sends the call to the role''s route. A role and a route are each one to 64 characters of letters, digits, `.`, `_` and `-`.'
    x-ess-name: sdc.daemon.RoleRoutes
    x-ess-kind: newtype
    type: object
    additionalProperties:
      $ref: '#/x-ess-entities/sdc.daemon.RouteName'
    x-ess-map-key: String
  sdc.daemon.RouteEntry:
    title: RouteEntry
    description: 'One role of a runbook''s route entries (the file `bindings/<runbook>.routes.yaml` of its runbook directory, format runbook.routes/1) and what the daemon''s admission made of it: an entry that names a route is admitted when the daemon declares the route and the runbook''s routes_allowed, when it has one, holds it; an entry that states needs is admitted with the daemon''s default route when that meets them, else with the one allowed route that meets them, and none or several is a refusal.'
    x-ess-name: sdc.daemon.RouteEntry
    x-ess-kind: struct
    type: object
    properties:
      role:
        description: The role the entry is for (writer, review, default, ...).
        type: string
      route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
        description: 'The route that serves the role: the one the entry names, or the route that meets its needs; absent when none does.'
      needs:
        $ref: '#/x-ess-entities/sdc.daemon.RouteNeeds'
        description: The requirements of an entry that names no route; absent for an entry that names one.
      admitted:
        type: boolean
      reason:
        description: Why the entry is not admitted, naming the role and the route or the requirement; absent when it is.
        type: string
    required:
    - role
    - admitted
    additionalProperties: false
  sdc.daemon.RouteName:
    title: RouteName
    description: 'The name of a model route the daemon declares (a table [routes.<name>] of its runbook.toml): one to 64 characters of letters, digits, `.`, `_` and `-`. A client names a route by it, never by an address, a token or an alias; the address, the token file and the prices stay in the daemon''s file.'
    x-ess-name: sdc.daemon.RouteName
    x-ess-kind: newtype
    type: string
  sdc.daemon.RouteNeeds:
    title: RouteNeeds
    description: 'What a route entry of a runbook asks of a route when it names none (docs/model-routes.md, section 2): each member that is present is a requirement, checked against what the route''s gateway lists for its alias (`GET /v1/models`: the wires, max_model_len, tool_calling) and the route''s kind in the daemon''s file. A fact the gateway did not give does not meet a requirement.'
    x-ess-name: sdc.daemon.RouteNeeds
    x-ess-kind: struct
    type: object
    properties:
      wire:
        description: 'A wire the gateway lists for the alias: chat, responses or messages.'
        type: string
      min_context:
        description: The least max_model_len the gateway lists for the alias.
        type: integer
      tool_calling:
        description: 'true: the gateway lists tool calling for the alias.'
        type: boolean
      kind:
        $ref: '#/x-ess-entities/sdc.daemon.ModelRouteKind'
    additionalProperties: false
  sdc.daemon.RouteSource:
    title: RouteSource
    description: 'The setting that chose a run''s route: run (the submit named it, `model_route` or `model_routes.<role>`) or default (the submit named none and the daemon''s `route_policy.default` applied; a daemon whose file declares no route but a lone `[gateway]` table and a model decider declares the interim route `default` on that gateway and takes it as its default, so a model run that names none says default too). The protocol''s own word comes with its story.'
    x-ess-name: sdc.daemon.RouteSource
    x-ess-kind: enum
    type: string
    enum:
    - run
    - default
  sdc.daemon.RouteStatus:
    title: RouteStatus
    description: 'Where a route stands as the daemon last read its gateway: gateway-unreachable (no answer from `GET /ready` or `GET /v1/models`, or an address the daemon does not speak, https), gateway-not-ready (`/ready` answered, not 200, or `/v1/models` gave no list), model-unknown (the gateway is ready and `GET /v1/models` does not list the route''s alias), ready or not-ready (the gateway read the route''s model: `callable` of `GET /v1/status`, else the phase of `GET /v1/models/{alias}/status` for a managed or a local route, ready only for the phase ready), listed (the gateway is ready and lists the alias, and no status of the model was read: a hosted route on a gateway without `/v1/status`, or a status route that did not answer). A read sends no model call and starts nothing.'
    x-ess-name: sdc.daemon.RouteStatus
    x-ess-kind: enum
    type: string
    enum:
    - ready
    - not-ready
    - listed
    - model-unknown
    - gateway-not-ready
    - gateway-unreachable
  sdc.daemon.Run:
    title: Run
    description: One run of a runbook on the daemon:its inputs as submitted, its confinement, where it stands and how it ended.
    x-ess-name: sdc.daemon.Run
    x-ess-kind: entity
    type: object
    properties:
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
      runbook_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookId'
      runbook_version:
        $ref: '#/x-ess-entities/sdc.daemon.RunbookVersion'
      intake:
        description: 'The intake document itself, inline in the submit: text, at most 1 MiB.'
        type: string
      context_path:
        $ref: '#/x-ess-entities/sdc.daemon.ContextPath'
        description: The context directory the run reads (runbook run --context), under one of the daemon context roots; absent when none was given.
      settings:
        $ref: '#/x-ess-entities/sdc.daemon.RunSettings'
      confinement:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementLevel'
      confinement_source:
        $ref: '#/x-ess-entities/sdc.daemon.ConfinementSource'
        description: 'Where the level came from: the submit or the daemon''s default. Absent for a run recorded before the daemon kept it.'
      autonomy:
        $ref: '#/x-ess-entities/sdc.decision.AutonomyLevel'
        description: 'The level the run was submitted with, or took from the daemon''s default; absent when none: every decision of the run waits for a client. Fixed at the submit and read from the record, never from the daemon''s policy of the day.'
      decider:
        $ref: '#/x-ess-entities/sdc.daemon.DeciderKind'
        description: The kind of decider of the run, fixed like the level.
      session_id:
        $ref: '#/x-ess-entities/sdc.daemon.SessionId'
        description: The session the run was submitted into; absent for a run of no session.
        x-ess-relation:
          name: session
          kind: references
          source: sdc.daemon.Run
          target: sdc.daemon.Session
          cardinality: one
          via: session_id
          $ref: '#/x-ess-entities/sdc.daemon.Session'
      idempotency_key:
        $ref: '#/x-ess-entities/sdc.daemon.IdempotencyKey'
        description: The key the submit carried, when it carried one; a later submit with the same key returns this run.
      submitted_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
      ended_at:
        description: 'When the run left its last live state: ended, cancelled or failed to start.'
        type: string
        format: date-time
      outcome:
        $ref: '#/x-ess-entities/sdc.daemon.RunOutcome'
        description: 'Set when the run Ended; absent in every other state. Besides the outcome names of the runbook''s protocol it holds the daemon''s own causes: `orphaned` (the daemon stopped while the run was live and the runtime could not take it up again) and `runtime-failure` (the runtime failed after the run started).'
      failure:
        description: Why the run failed to start; absent in every other state.
        type: string
      step_in_flight:
        $ref: '#/x-ess-entities/sdc.daemon.StepInFlight'
        description: 'The step whose program runs now, while the run is Running; absent otherwise (no program runs, the run waits, ended, was cancelled, or the daemon started again). No command of the language sets it: the daemon keeps it in its process from the run event `runbook.action-started` until the program ends, like the rows of Runbook, and a restarted daemon has none.'
      model_route:
        $ref: '#/x-ess-entities/sdc.daemon.RouteName'
        description: 'The route of the run''s role `default`, the role a model process names when it names none of its own: the one the submit named, else the daemon''s `route_policy.default`. Absent for a run that makes no model call (its decider is not a model, or its level is A0) and for a run of a daemon with no route. Always a route of the view Routes. Fixed at the submit.'
        x-ess-relation:
          name: model_route
          kind: references
          source: sdc.daemon.Run
          target: sdc.daemon.ModelRoute
          cardinality: one
          via: model_route
          $ref: '#/x-ess-entities/sdc.daemon.ModelRoute'
      model_route_alias:
        description: 'The gateway''s alias of the model behind model_route, as the daemon''s file declared it at the submit: what every call of the role names at the gateway. Absent with model_route.'
        type: string
      model_route_source:
        $ref: '#/x-ess-entities/sdc.daemon.RouteSource'
        description: 'The setting that chose model_route: run or default. Absent with model_route.'
      model_routes:
        $ref: '#/x-ess-entities/sdc.daemon.RoleRoutes'
        description: The routes of the other roles the submit named (`model_routes.<role>`), each chosen by the run; absent when it named none.
      route_phase:
        description: 'The last phase the gateway gave of a route of the run that could not answer when the run was submitted: set when the run waits for its route (WaitingForRoute) and when it ends `stopped: route`; absent for a run that never waited.'
        type: string
      path:
        $ref: '#/x-ess-entities/sdc.daemon.DelegationPath'
        description: 'For a run a Delegate created: how it became a run, read from its run events `runbook.delegated` and `runbook.delegation-resolved` (the path a classified delegation took when its run started); absent for any other run, and while the daemon classifies. No command of the language sets it.'
      protocol:
        description: 'For a run a Delegate created, once its path is taken: the protocol it runs, by the id its document declares (the named runbook, delegation-free, the runbook the classifier picked, or the id of the generated protocol). Read like `path`.'
        type: string
      confidence:
        description: 'For a classified or generated delegation: the classifier''s confidence, a number from 0 to 1. Read like `path`.'
      classifier_route:
        description: 'For a classified or generated delegation: the route of its classify and build calls (route_policy.classifier), by name. Read like `path`.'
        type: string
      protocol_digest:
        description: 'For a generated delegation: sha256:<hex> of the protocol document the builder wrote, as the run took it. Read like `path`.'
        type: string
      state:
        $ref: '#/x-ess-entities/sdc.daemon.Run.State'
    required:
    - run_id
    - runbook_id
    - intake
    - settings
    - confinement
    - submitted_at
    - state
    additionalProperties: false
  sdc.daemon.Run.State:
    title: State
    x-ess-name: sdc.daemon.Run.State
    x-ess-kind: enum
    type: string
    enum:
    - Cancelled
    - Ended
    - FailedToStart
    - Running
    - Submitted
    - WaitingForRoute
    - WaitingOnDecision
  sdc.daemon.RunCase:
    title: RunCase
    description: 'One case of a run''s tree, as the runtime reads the run''s store when a client asks for the view CasesOfRun: the Loom runtime answers it from Loom''s tree status of the store, which it reads without holding it, so it answers while the run goes on; the stub runtime has no tree and answers none. No path of the store or of a case file is in a row. The language cannot read a store, so no command creates or changes a row, as with Runbook.'
    x-ess-name: sdc.daemon.RunCase
    x-ess-kind: entity
    type: object
    properties:
      case_key:
        $ref: '#/x-ess-entities/sdc.daemon.CaseKey'
      run_id:
        $ref: '#/x-ess-entities/sdc.daemon.RunId'
        x-ess-relation:
          name: run
          kind: references
          source: sdc.daemon.RunCase
          target: sdc.daemon.Run
          cardinality: one
          via: run_id
          $ref: '#/x-ess-entities/sdc.daemon.Run'
      case_id:
        description: The case's id in the run's tree.
        type: string
      parent:
        description: The case that opened this one; absent for the root.
        type: string
      name:
        description: The name the opening action gave the case (its link name); absent for the root.
        type: string
      protocol:
        description: The id of the case's protocol.
        type: string
      case_state:
        $ref: '#/x-ess-entities/sdc.daemon.CaseState'
        description: 'Where the case stands when the daemon reads the tree. Not `state`: that member of an entity is its lifecycle, and no command moves a case.'
      outcome:
        description: The outcome the case ended through; absent while it is not ended.
        type: string
      state:
        $ref: '#/x-ess-entities/sdc.daemon.RunCase.State'
