    sdc.daemon.SubmitRun.Input:
      title: Submit a run input
      description: 'Submit a run of a runbook: its intake (inline), its context (a path under a daemon context root), its settings and its confinement (optional: a submit that names none runs at the daemon''s default level; a daemon with none refuses it by name, and nothing is written), and optionally an autonomy level and a decider kind (a submit that names none takes the daemon''s defaults; a kind the operator did not configure, or a level with no kind to take it, is refused before anything is written and creates no run), into a session or alone. The run is Submitted; the runtime starts it. The accepted outcome (submitted) also makes the daemon write the run''s first event: kind `runbook.submitted`, sequence 1, record {run_id, runbook_id, confinement, confinement_source, and autonomy and decider when the run has them}, and the next position of the daemon; the run''s next sequence starts at 2, so the first event the runtime records for the run is sequence 2 (RecordRunEvent). A replayed submit (already-submitted) writes no event and creates no run; a refused submit (every error outcome) creates no run and writes none. The language cannot write a RunEvent from this command (an outcome creates or moves rows of one entity), so this is stated here and in the summaries of the daemon''s other own events, and read through the event views only: the interpreted target keeps no row for it and accepts sequence 1, the daemon refuses it as not ascending. The daemon mints the run id and the HTTP handler fills `run_id` and `daemon_id`; a client never chooses them. A client that wants a safe retry sends an `idempotency_key`: a second submit with a key already used returns the first run and creates none (outcome already-submitted, answered with the first run). The handler also reports three facts it reads from the host, because the language cannot read a file system: `runbook_known`, `context_inside_roots` and the size of the inline intake (checked here); the checks themselves are outside the language and are tested in the story daemon-skeleton-on-a-runtime-trait. The client names no daemon: `daemon_id` is an input because a guard that reads the Daemon row through a row set cannot be synthesized (ESS-SYNTH-001), while `via` plus `predicate` can. The floor guard spells the order of the two levels out, one outcome for the one floor that refuses something, because the ordered comparison `confinement_floor > input.confinement` validates but the interpreted target then accepts every level (a defect of the interpreted target of ESS 0.96.0); the outcome changes with the level names.'
      x-ess-name: sdc.daemon.SubmitRun
      x-ess-kind: command-input
      type: object
      properties:
        run_id:
          $ref: '#/components/schemas/sdc.daemon.RunId'
        runbook_id:
          $ref: '#/components/schemas/sdc.daemon.RunbookId'
        runbook_version:
          $ref: '#/components/schemas/sdc.daemon.RunbookVersion'
        intake:
          type: string
        context_path:
          $ref: '#/components/schemas/sdc.daemon.ContextPath'
        settings:
          $ref: '#/components/schemas/sdc.daemon.RunSettings'
        confinement:
          $ref: '#/components/schemas/sdc.daemon.ConfinementLevel'
          description: The level the client named; absent when it named none, and the run then takes the daemon's default level (a daemon with none refuses the submit by name; the handler fills it and says which in confinement_source).
        confinement_source:
          $ref: '#/components/schemas/sdc.daemon.ConfinementSource'
          description: 'Where the level came from: the handler fills it. A client never sends it.'
        autonomy:
          $ref: '#/components/schemas/sdc.decision.AutonomyLevel'
          description: 'The autonomy level of the run, A0 to A5: how much of its decisions a decider takes over from a person. Absent: the daemon''s default level, and when it has none every decision of the run waits for a client.'
        decider:
          $ref: '#/components/schemas/sdc.daemon.DeciderKind'
          description: 'The kind of the decider that answers what the level gives it, a name among the kinds the operator configured. Absent: the daemon''s default kind. A kind that is not configured, and a level with no kind to take it, are refused before anything is written (400).'
        session_id:
          $ref: '#/components/schemas/sdc.daemon.SessionId'
        idempotency_key:
          $ref: '#/components/schemas/sdc.daemon.IdempotencyKey'
        runbook_known:
          type: boolean
        context_inside_roots:
          type: boolean
        daemon_id:
          $ref: '#/components/schemas/sdc.daemon.DaemonId'
        at:
          type: string
          format: date-time
      required:
