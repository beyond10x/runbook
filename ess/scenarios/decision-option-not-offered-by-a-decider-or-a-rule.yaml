type: ess-scenario/1
domain: sdc.decision
scenario: decision-option-not-offered-by-a-decider-or-a-rule
summary: "Decide refuses a letter the request does not offer whoever decides: a decider and a rule are refused as a person is, and the request stays open for a person."

timeline:
  - at: 2026-11-22T14:00:00Z
    command: sdc.decision.Request
    actor: sdc.decision.Driver
    input:
      request_id: "DR-IDEA-6.billing.limits-change.merge-1"
      case_id: "IDEA-6.billing.limits"
      question_key: "IDEA-6.billing.limits|change.merge|"
      unblocks: {kind: approval, action: "change.merge", capability: "change.merge"}
      subject_artifact: "change"
      subject_revision: "t5r1"
      subject_path: "impl/"
      question: "Merge the change at revision t5r1 into mainline?"
      options:
        - letter: "A"
          does: "Grant change.merge at this case revision."
          cost: "None beyond the merge."
          consequence: {admits: ["change.merge"], blocks: [], grant: granted, produces: canon_authority}
        - letter: "B"
          does: "Deny change.merge."
          cost: "The run ends as refused."
          consequence: {admits: [], blocks: ["change.merge"], grant: denied, produces: canon_authority}
      autonomy_level: A3
      decision_class: merge
      holder: decider
      eligible: ["operator", "decider:haiku", "rule:autopilot"]
      addressed_to: "decider:haiku"
      opened_at: 2026-11-22T14:00:00Z
    outcome: requested
    events:
      - event: sdc.decision.DecisionRequested
        payload:
          request_id: "DR-IDEA-6.billing.limits-change.merge-1"
          case_id: "IDEA-6.billing.limits"
          subject_artifact: "change"
          subject_revision: "t5r1"

  - at: 2026-11-22T14:01:00Z
    command: sdc.decision.Decide
    actor: sdc.decision.Decider
    input:
      request_id: "DR-IDEA-6.billing.limits-change.merge-1"
      option: "Z"
      principal: "decider:haiku"
      principal_kind: decider
      decided_at: 2026-11-22T14:01:00Z
      reasons: ["Answered with a letter that is not on the list."]
    outcome: option-not-offered

  - at: 2026-11-22T14:02:00Z
    command: sdc.decision.Decide
    actor: sdc.decision.Decider
    input:
      request_id: "DR-IDEA-6.billing.limits-change.merge-1"
      option: "Z"
      principal: "rule:autopilot"
      principal_kind: rule
      decided_at: 2026-11-22T14:02:00Z
      reasons: ["The rule named a letter that is not on the list."]
    outcome: option-not-offered

  - at: 2026-11-22T14:03:00Z
    command: sdc.decision.Decide
    actor: sdc.decision.Decider
    input:
      request_id: "DR-IDEA-6.billing.limits-change.merge-1"
      option: "A"
      principal: "decider:haiku"
      principal_kind: decider
      decided_at: 2026-11-22T14:03:00Z
      reasons: ["The change is within the limits."]
    outcome: decided
    events:
      - event: sdc.decision.DecisionTaken
        payload:
          request_id: "DR-IDEA-6.billing.limits-change.merge-1"
          option: "A"
          principal: "decider:haiku"

assert:
  - view: sdc.decision.ArtifactDecisionHistory
    params: {artifact: "change"}
    contains: {request_id: "DR-IDEA-6.billing.limits-change.merge-1", state: Decided, decided_option: "A", decided_by: "decider:haiku"}
