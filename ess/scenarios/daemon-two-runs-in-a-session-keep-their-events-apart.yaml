type: ess-scenario/1
domain: sdc.daemon
scenario: daemon-two-runs-in-a-session-keep-their-events-apart
summary: "Two runs of one session keep their own sequence numbers (from 2, after the submit event); the session page shows both in position order."

timeline:
  - at: 2026-11-22T10:00:00Z
    command: sdc.daemon.StartDaemon
    actor: sdc.daemon.Operator
    input:
      daemon_id: "runbookd"
      confinement_floor: linux
      at: 2026-11-22T10:00:00Z
    outcome: started

  - at: 2026-11-22T10:00:30Z
    command: sdc.daemon.OpenSession
    actor: sdc.daemon.Client
    input:
      session_id: "nightly"
      client: "ci"
      at: 2026-11-22T10:00:30Z
    outcome: opened
    events:
      - event: sdc.daemon.SessionOpened
        payload:
          session_id: "nightly"
          client: "ci"

  - at: 2026-11-22T10:01:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-a"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake: "intake-a.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      session_id: "nightly"
      at: 2026-11-22T10:01:00Z
    outcome: submitted

  - at: 2026-11-22T10:01:30Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-b"
      runbook_id: "sdc-bugfix"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake: "intake-b.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      session_id: "nightly"
      at: 2026-11-22T10:01:30Z
    outcome: submitted

  - at: 2026-11-22T10:02:00Z
    command: sdc.daemon.StartRun
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-a"
      at: 2026-11-22T10:02:00Z
    outcome: started

  - at: 2026-11-22T10:02:30Z
    command: sdc.daemon.StartRun
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-b"
      at: 2026-11-22T10:02:30Z
    outcome: started

  - at: 2026-11-22T10:03:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-a"
      session_id: "nightly"
      sequence: 2
      position: 3
      kind: "step.done"
      record: {step: "a1"}
      at: 2026-11-22T10:03:00Z
    outcome: recorded

  - at: 2026-11-22T10:03:30Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-b"
      session_id: "nightly"
      sequence: 2
      position: 4
      kind: "step.done"
      record: {step: "b1"}
      at: 2026-11-22T10:03:30Z
    outcome: recorded

  - at: 2026-11-22T10:04:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-a"
      session_id: "nightly"
      sequence: 3
      position: 5
      kind: "step.done"
      record: {step: "a2"}
      at: 2026-11-22T10:04:00Z
    outcome: recorded

  - at: 2026-11-22T10:04:30Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-a"
      session_id: "nightly"
      sequence: 3
      position: 6
      kind: "step.done"
      record: {step: "a2-again"}
      at: 2026-11-22T10:04:30Z
    outcome: not-ascending

  - at: 2026-11-22T10:04:45Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-b"
      session_id: "nightly"
      sequence: 3
      position: 5
      kind: "step.done"
      record: {step: "b2-late"}
      at: 2026-11-22T10:04:45Z
    outcome: position-not-ascending

  - at: 2026-11-22T10:05:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-b"
      session_id: "nightly"
      sequence: 3
      position: 6
      kind: "step.done"
      record: {step: "b2"}
      at: 2026-11-22T10:05:00Z
    outcome: recorded

assert:
  - view: sdc.daemon.RunsOfSession
    params: {session_id: "nightly"}
    contains: {run_id: "run-a", runbook_id: "sdc", state: Running, session_id: "nightly"}
  - view: sdc.daemon.RunsOfSession
    params: {session_id: "nightly"}
    contains: {run_id: "run-b", runbook_id: "sdc-bugfix", state: Running, session_id: "nightly"}
  - view: sdc.daemon.RunsOfSessionInState
    params: {session_id: "nightly", state: Running}
    contains: {run_id: "run-a"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-a", after_position: 2}
    at:
      row: first
      fields:
        run_id: "run-a"
        sequence: 2
        position: 3
        record: {step: "a1"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-a", after_position: 2}
    at:
      row: last
      fields:
        run_id: "run-a"
        sequence: 3
        position: 5
        record: {step: "a2"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-b", after_position: 2}
    at:
      row: first
      fields:
        run_id: "run-b"
        sequence: 2
        position: 4
        record: {step: "b1"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-b", after_position: 2}
    at:
      row: last
      fields:
        run_id: "run-b"
        sequence: 3
        position: 6
        record: {step: "b2"}
  - view: sdc.daemon.EventsOfSessionAfter
    params: {session_id: "nightly", after_position: 2}
    at:
      row: first
      fields:
        run_id: "run-a"
        position: 3
  - view: sdc.daemon.EventsOfSessionAfter
    params: {session_id: "nightly", after_position: 3}
    at:
      row: first
      fields:
        run_id: "run-b"
        position: 4
  - view: sdc.daemon.EventsOfSessionAfter
    params: {session_id: "nightly", after_position: 4}
    at:
      row: first
      fields:
        run_id: "run-a"
        position: 5
  - view: sdc.daemon.EventsOfSessionAfter
    params: {session_id: "nightly", after_position: 2}
    at:
      row: last
      fields:
        run_id: "run-b"
        position: 6
  - view: sdc.daemon.EventsOfDaemonAfter
    params: {after_position: 5}
    at:
      row: first
      fields:
        run_id: "run-b"
        position: 6
