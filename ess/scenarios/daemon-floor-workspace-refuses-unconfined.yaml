type: ess-scenario/1
domain: sdc.daemon
scenario: daemon-floor-workspace-refuses-unconfined
summary: "A daemon started with the workspace floor refuses a run at unconfined and takes one at workspace and one at strict."

timeline:
  - at: 2026-11-22T10:00:00Z
    command: sdc.daemon.StartDaemon
    actor: sdc.daemon.Operator
    input:
      daemon_id: "runbookd"
      confinement_floor: workspace
      at: 2026-11-22T10:00:00Z
    outcome: started

  - at: 2026-11-22T10:01:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-low"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake_ref: "intake.md"
      settings: {}
      confinement: unconfined
      at: 2026-11-22T10:01:00Z
    outcome: below-floor-workspace

  - at: 2026-11-22T10:02:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-at-floor"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake_ref: "intake.md"
      settings: {}
      confinement: workspace
      at: 2026-11-22T10:02:00Z
    outcome: submitted

  - at: 2026-11-22T10:03:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-above-floor"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake_ref: "intake.md"
      settings: {}
      confinement: strict
      at: 2026-11-22T10:03:00Z
    outcome: submitted

assert:
  - view: sdc.daemon.RunsInState
    params: {state: Submitted}
    contains: {run_id: "run-at-floor", confinement: workspace}
  - view: sdc.daemon.RunsInState
    params: {state: Submitted}
    contains: {run_id: "run-above-floor", confinement: strict}
