type: ess-scenario/1
domain: sdc.daemon
scenario: daemon-submit-below-the-floor-is-refused
summary: "A daemon started with the linux floor refuses a run at local with BelowConfinementFloor, and takes a run at linux."

timeline:
  - at: 2026-11-22T10:00:00Z
    command: sdc.daemon.StartDaemon
    actor: sdc.daemon.Operator
    input:
      daemon_id: "runbookd"
      confinement_floor: linux
      at: 2026-11-22T10:00:00Z
    outcome: started

  - at: 2026-11-22T10:01:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-low"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: local
      at: 2026-11-22T10:01:00Z
    outcome: below-floor

  - at: 2026-11-22T10:03:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-at-floor"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      at: 2026-11-22T10:03:00Z
    outcome: submitted
    events:
      - event: sdc.daemon.RunSubmitted
        payload:
          run_id: "run-at-floor"
          runbook_id: "sdc"
          confinement: linux

assert:
  - view: sdc.daemon.Runs
    contains: {run_id: "run-at-floor", state: Submitted, confinement: linux}
  - view: sdc.daemon.DaemonConfiguration
    contains: {daemon_id: "runbookd", confinement_floor: linux}
