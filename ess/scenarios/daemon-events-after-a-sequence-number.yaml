type: ess-scenario/1
domain: sdc.daemon
scenario: daemon-events-after-a-sequence-number
summary: "The events page after a position holds only the events with a larger position; the runtime records from sequence 2, after the submit event."

timeline:
  - at: 2026-11-22T10:00:00Z
    command: sdc.daemon.StartDaemon
    actor: sdc.daemon.Operator
    input:
      daemon_id: "runbookd"
      confinement_floor: local
      at: 2026-11-22T10:00:00Z
    outcome: started

  - at: 2026-11-22T10:01:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-1"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      runbook_version: "0.3.0"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: local
      at: 2026-11-22T10:01:00Z
    outcome: submitted

  - at: 2026-11-22T10:02:00Z
    command: sdc.daemon.StartRun
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      at: 2026-11-22T10:02:00Z
    outcome: started

  - at: 2026-11-22T10:03:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      sequence: 2
      position: 2
      kind: "step.done"
      record: {step: "s1"}
      at: 2026-11-22T10:03:00Z
    outcome: recorded

  - at: 2026-11-22T10:04:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      sequence: 3
      position: 3
      kind: "step.done"
      record: {step: "s2"}
      at: 2026-11-22T10:04:00Z
    outcome: recorded

  - at: 2026-11-22T10:05:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      sequence: 4
      position: 4
      kind: "step.done"
      record: {step: "s3"}
      at: 2026-11-22T10:05:00Z
    outcome: recorded

assert:
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-1", after_position: 1}
    at:
      row: first
      fields:
        sequence: 2
        position: 2
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-1", after_position: 2}
    at:
      row: first
      fields:
        sequence: 3
        position: 3
        record: {step: "s2"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-1", after_position: 2}
    at:
      row: last
      fields:
        sequence: 4
        position: 4
        record: {step: "s3"}
  - view: sdc.daemon.EventsAfter
    params: {run_id: "run-1", after_position: 3}
    at:
      row: first
      fields:
        sequence: 4
        position: 4
