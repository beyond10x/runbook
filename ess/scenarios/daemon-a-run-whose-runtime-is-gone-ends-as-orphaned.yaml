type: ess-scenario/1
domain: sdc.daemon
scenario: daemon-a-run-whose-runtime-is-gone-ends-as-orphaned
summary: "A Running and a WaitingOnDecision run whose runtime is gone end as orphaned; the end withdraws the waiting run's Open request itself."

timeline:
  - at: 2026-11-22T10:00:00Z
    command: sdc.daemon.StartDaemon
    actor: sdc.daemon.Operator
    input:
      daemon_id: "runbookd"
      confinement_floor: linux
      principal: "agent:conformance"
      at: 2026-11-22T10:00:00Z
    outcome: started

  - at: 2026-11-22T10:01:00Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-1"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      at: 2026-11-22T10:01:00Z
    outcome: submitted

  - at: 2026-11-22T10:01:10Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-2"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      at: 2026-11-22T10:01:10Z
    outcome: submitted

  - at: 2026-11-22T10:01:20Z
    command: sdc.daemon.SubmitRun
    actor: sdc.daemon.Client
    input:
      run_id: "run-3"
      runbook_id: "sdc"
      daemon_id: "runbookd"
      intake: "intake.md"
      runbook_known: true
      context_inside_roots: true
      settings: {}
      confinement: linux
      at: 2026-11-22T10:01:20Z
    outcome: submitted

  - at: 2026-11-22T10:02:00Z
    command: sdc.daemon.StartRun
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      at: 2026-11-22T10:02:00Z
    outcome: started

  - at: 2026-11-22T10:02:10Z
    command: sdc.daemon.StartRun
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-2"
      at: 2026-11-22T10:02:10Z
    outcome: started

  - at: 2026-11-22T10:03:00Z
    command: sdc.daemon.WaitOnDecision
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-2"
    outcome: waiting

  - at: 2026-11-22T10:04:00Z
    command: sdc.daemon.RequestDecision
    actor: sdc.daemon.Runtime
    input:
      request_id: "dr-1"
      run_id: "run-2"
      question: "Merge the change?"
      case_id: "IDEA-1"
      action: "merge"
      capability: "change.merge"
      options:
        - letter: "A"
          does: "Grant change.merge."
          cost: "None beyond the merge."
          consequence: {admits: ["change.merge"], blocks: [], grant: granted, produces: canon_authority}
        - letter: "B"
          does: "Deny change.merge."
          cost: "The run ends as refused."
          consequence: {admits: [], blocks: ["change.merge"], grant: denied, produces: canon_authority}
      at: 2026-11-22T10:04:00Z
    outcome: requested

  - at: 2026-11-22T11:00:00Z
    command: sdc.daemon.EndOrphanedRun
    actor: sdc.daemon.DaemonProcess
    input:
      run_id: "run-3"
      at: 2026-11-22T11:00:00Z
    outcome: wrong-state

  - at: 2026-11-22T11:00:10Z
    command: sdc.daemon.EndOrphanedRun
    actor: sdc.daemon.DaemonProcess
    input:
      run_id: "run-1"
      at: 2026-11-22T11:00:10Z
    outcome: orphaned
    events:
      - event: sdc.daemon.RunOrphaned
        payload:
          run_id: "run-1"

  - at: 2026-11-22T11:00:20Z
    command: sdc.daemon.EndOrphanedRun
    actor: sdc.daemon.DaemonProcess
    input:
      run_id: "run-2"
      at: 2026-11-22T11:00:20Z
    outcome: orphaned
    events:
      - event: sdc.daemon.RunOrphaned
        payload:
          run_id: "run-2"

  - at: 2026-11-22T11:00:30Z
    command: sdc.daemon.WithdrawDecision
    actor: sdc.daemon.Runtime
    input:
      request_id: "dr-1"
    outcome: not-open

  - at: 2026-11-22T11:00:40Z
    command: sdc.daemon.EndOrphanedRun
    actor: sdc.daemon.DaemonProcess
    input:
      run_id: "run-1"
      at: 2026-11-22T11:00:40Z
    outcome: wrong-state

  - at: 2026-11-22T11:00:50Z
    command: sdc.daemon.EndOrphanedRun
    actor: sdc.daemon.DaemonProcess
    input:
      run_id: "run-unknown"
      at: 2026-11-22T11:00:50Z
    outcome: no-run

  - at: 2026-11-22T11:01:00Z
    command: sdc.daemon.AnswerDecision
    actor: sdc.daemon.Client
    input:
      run_id: "run-2"
      request_id: "dr-1"
      answer: "A"
      answered_by: "operator"
      principal: "agent:conformance"
      answer_offered: true
      at: 2026-11-22T11:01:00Z
    outcome: withdrawn

  - at: 2026-11-22T11:02:00Z
    command: sdc.daemon.RecordRunEvent
    actor: sdc.daemon.Runtime
    input:
      run_id: "run-1"
      sequence: 3
      position: 6
      kind: "case.opened"
      record: {case: "IDEA-1"}
      at: 2026-11-22T11:02:00Z
    outcome: run-closed

assert:
  - view: sdc.daemon.RunDetail
    params: {run_id: "run-1"}
    contains: {run_id: "run-1", state: Ended, outcome: "orphaned", ended_at: 2026-11-22T11:00:10Z}
  - view: sdc.daemon.RunDetail
    params: {run_id: "run-2"}
    contains: {run_id: "run-2", state: Ended, outcome: "orphaned"}
  - view: sdc.daemon.RunDetail
    params: {run_id: "run-3"}
    contains: {run_id: "run-3", state: Submitted}
  - view: sdc.daemon.DecisionsOfRun
    params: {run_id: "run-2"}
    contains: {request_id: "dr-1", state: Withdrawn}
