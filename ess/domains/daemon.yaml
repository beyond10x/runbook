domain: sdc.daemon
summary: "The API of the Runbook daemon (runbookd, the same binary as runbook serve): runs, the sessions that group them, the decision requests a waiting run raises, and the ordered events each run records. HTTP carries the commands and the views; each event stream is a view paged by position and served as server-sent events (EventsAfter, EventsOfSessionAfter, EventsOfDaemonAfter; see the note on EventsAfter). docs/layers.md says what the runtime is; the runtime behind the daemon sits behind a trait, so the daemon's commands and views do not change with it."

naming:
  wire: daemon
  display: Daemon

types:
  - name: sdc.daemon.SessionId
    kind: newtype
    of: String
    naming:
      summary: "The name of a session, chosen by the client that opens it."

  - name: sdc.daemon.ClientLabel
    kind: newtype
    of: String
    invariants:
      - value.count <= 200
    naming:
      summary: "A label the client gives when it opens a session: free text, at most 200 characters, for display. It grants nothing: who may call is decided by the bearer token alone, and the token's subject is not a member of any entity."

  - name: sdc.daemon.AnswererLabel
    kind: newtype
    of: String
    invariants:
      - value.count <= 200
    naming:
      summary: "The name a client gives when it answers a decision (the answered_by of AnswerDecision): ASCII text without control characters, at most 200 characters. The daemon trims it of ASCII whitespace and refuses (400) a longer one, one that holds a non-ASCII or a control character, and one whose lower case starts with `rule:`, `decider:` or `router:`, the names it keeps for the answers of a rule, a decider and a router. It is stored and shown trimmed and is never the principal: the principal of an answer is the daemon's own (runbook serve --principal), fixed when the daemon starts, and a label a client types grants nothing."

  - name: sdc.daemon.DaemonId
    kind: newtype
    of: String
    naming:
      summary: "The id of the one daemon the specification describes: the configuration row it holds is keyed by it. The HTTP handler fills it; one process is one daemon."

  - name: sdc.daemon.RunId
    kind: newtype
    of: String
    naming:
      summary: "The id of a run. The daemon mints it (a UUID, version 7) in the HTTP handler and returns it in the answer to the submit; the handler fills the `run_id` input of SubmitRun and a client never chooses it. The state directory of the run is named after it. A run id that is already taken cannot occur, because the daemon mints it; the specification has no refusal for it."

  - name: sdc.daemon.DecisionRequestId
    kind: newtype
    of: String
    naming:
      summary: "The id of a decision request: the runtime's, copied. A request id that is already taken cannot occur, because the runtime mints it; the specification has no refusal for it."

  - name: sdc.daemon.EventId
    kind: newtype
    of: String
    naming:
      summary: "The id the daemon gives a recorded event. It is the row's identity only; the stream's id is the event's position."

  - name: sdc.daemon.RunbookId
    kind: newtype
    of: String
    naming:
      summary: "The name of a runbook: a preset (sdc, sdc-bugfix) or the name of a runbook in the daemon's --runbook-dir."

  - name: sdc.daemon.RunbookName
    kind: newtype
    of: String
    naming:
      summary: "The name of a runbook in the list the view Runbooks gives: the text a client puts into the runbook_id of a SubmitRun. A type of its own, not RunbookId, because a row of that list names a runbook the daemon can start and is not a reference of a run to it."

  - name: sdc.daemon.RunbookVersion
    kind: newtype
    of: String
    naming:
      summary: "The version of a runbook, as runbook list shows it. Optional in a submit: absent means the version the daemon has."

  - name: sdc.daemon.ContextPath
    kind: newtype
    of: String
    naming:
      summary: "A directory on the daemon's host, given as an absolute path. The daemon accepts it only when it lies under one of its context roots (runbook serve --context-root <dir>, repeatable; none given means no context from a path), and copies it into the run's workspace before the run starts."

  - name: sdc.daemon.IdempotencyKey
    kind: newtype
    of: String
    invariants:
      - value.count <= 200
    naming:
      summary: "Optional text, at most 200 characters, unique per daemon, that a client sends to retry a submit safely: a second submit with a key already used returns the first run and creates none."

  - name: sdc.daemon.EventKind
    kind: newtype
    of: String
    naming:
      summary: "Open text: the kind of the runtime's run-log line, copied. Events the daemon writes itself have a kind that starts with `runbook.`, and the command that writes each one declares it: runbook.submitted (SubmitRun), runbook.cancel-requested (CancelRun), runbook.start-failed (FailRunStart), runbook.run-orphaned (EndOrphanedRun), runbook.answer-undeliverable (AnswerDecision) and runbook.runtime-failed (written by the daemon just before it issues EndRun with the outcome runtime-failure) and runbook.action-started (written by the daemon when the runtime tells that a program of an action, or its `handoff_when` check, is about to start, before the program starts; record: case, action, role (`program` or `check`) and try, each absent when unknown; the language cannot write a RunEvent from a command, so it is stated here, and the view RunDetail shows the step while the program runs). Not a closed set for the runtime's own kinds."

  - name: sdc.daemon.RunOutcome
    kind: newtype
    of: String
    naming:
      summary: "Open text: the outcome name of the runbook's protocol for the root case, or one of the daemon's own causes (`orphaned`, `runtime-failure`). The run's state is the closed set; the outcome is not."

  - name: sdc.daemon.ConfinementLevel
    kind: enum
    ordered: true
    variants: [local, linux]
    naming:
      summary: "How strongly a run is sandboxed, weakest first: the runtime's names. local is not confined; linux is. oci and pod are the runtime's planned levels and are not in the set until it offers them. A submit that names no level runs at the daemon's default level (runbook serve --default-confinement, or `confinement` of runbook.toml); a daemon with none refuses the submit by name and writes nothing, as the binary has no built-in default; the handler fills it. The daemon's floor is linux unless it is started lower; the default is never below the floor, and a daemon whose default is below its floor does not start. local must be asked for by name or set as the default, and is refused under a linux floor."

  - name: sdc.daemon.ConfinementSource
    kind: enum
    variants: [submit, daemon-default]
    naming:
      summary: "Where a run's level came from: submit (the client named it) or daemon-default (the client named none and the daemon's default level applied). There is no third source: a daemon with no default refuses a submit that names none."

  - name: sdc.daemon.DeciderKind
    kind: newtype
    of: String
    invariants:
      - value.count >= 1
      - value.count <= 63
    naming:
      summary: "The name of a decider kind the operator configured (a table [deciders.<kind>] of runbook.toml): rule or model. A run names a kind, never a program or a path; a kind that is not configured is refused at the submit before anything is written."

  - name: sdc.daemon.RuntimeKind
    kind: enum
    variants: [stub, loom]
    naming:
      summary: "The runtime that runs the daemon's runs (runbook serve --runtime): stub is scripted and executes nothing; loom runs the runbook through Loom's library entry in the daemon's process."

  - name: sdc.daemon.RunSettings
    kind: newtype
    of: "Map<String, String>"
    naming:
      summary: "The settings of a run: a map from text to text (runbook run --set key=value), kept as written. Typed members come with the runtime's run-settings story; none are declared now."

  - name: sdc.daemon.StepInFlight
    kind: struct
    naming:
      summary: "The step of a run whose program is running now: the action the bindings bind to the program, the case it runs for and when it started, the start the event `runbook.action-started` recorded. `seconds` is the time since `started_at` by the daemon's clock, read when the view is read."
    fields:
      - {name: action, type: Optional<String>, summary: "The action whose program (or `handoff_when` check) runs; absent when no single action of the runbook's bindings binds the program."}
      - {name: case_id, type: Optional<String>, summary: "The case the program runs for; absent when the runtime names none."}
      - {name: started_at, type: Timestamp, summary: "The `at` of the event `runbook.action-started` of this step."}
      - {name: seconds, type: Integer, summary: "Whole seconds from started_at to the moment the view is read, 0 or more."}

  - name: sdc.daemon.DecisionArtifact
    kind: struct
    naming:
      summary: "What a decision request read from its case carries beside its question and its options: the recommendation, its grounds and whether the request takes a free answer (docs/engine.md, 'A request read from the case'). The runtime reads it from the case and never writes it; a request the runtime built itself has none, and only a request that has one refuses an answer that names none of its options (AnswerDecision, unknown-option)."
    fields:
      - {name: recommended_option, type: Optional<sdc.decision.OptionLetter>, summary: "The letter of the option the case recommends."}
      - {name: recommended_answer, type: Optional<String>, summary: "A free answer the case recommends in place of an option, for a question."}
      - {name: recommendation_strength, type: sdc.decision.Strength, summary: "How strongly the grounds support the recommendation; none where the request carries no recommendation."}
      - {name: grounds, type: "List<sdc.decision.Ground>", summary: "The grounds of the recommendation, each with a citation the runtime checked before the request opened."}
      - {name: free_answer, type: Boolean, summary: "Whether an answer that names no option is taken as a free answer (a question request)."}

  - name: sdc.daemon.WorkId
    kind: newtype
    of: String
    naming:
      summary: "The work/ directory of a run as a row of RunProducts: its text is the run's id. A type of its own, not RunId, because a row of that view is the listing of a directory and not the run."

  - name: sdc.daemon.DelegationPath
    kind: enum
    variants: [named, free]
    naming:
      summary: "How a delegation became a run (docs/model-routes.md, section 9): named (it named a protocol, and that runbook runs with the request as its intake) or free (it named none: the free run, one agent node whose instruction is the request, writing result.md). The paths classified and generated come with classify and build and are not in the set until the daemon takes them."

  - name: sdc.daemon.DelegationId
    kind: newtype
    of: String
    naming:
      summary: "A delegation as a row of Delegation: its text is the run's id. A type of its own, not RunId, because a row is what the daemon reads of the run's record and files, not the run."

  - name: sdc.daemon.ProductPath
    kind: newtype
    of: String
    naming:
      summary: "The path of a file of a run, relative to the run's work/ directory (its workspace, which the cases of the run share): names joined by `/`, none of them `..` and none starting with a dot. Never absolute and never a path of the host."

  - name: sdc.daemon.ProductFile
    kind: struct
    naming:
      summary: "One file of a run's work/ directory as the listing names it: a regular file with one name, reached through no link."
    fields:
      - {name: path, type: sdc.daemon.ProductPath}
      - {name: size, type: Integer, summary: "Its length in bytes."}
      - {name: modified_at, type: Timestamp, summary: "When it was last written."}

  - name: sdc.daemon.CaseKey
    kind: newtype
    of: String
    naming:
      summary: "One case of one run as a row of RunCase: the run's id and the case's id. A type of its own, not RunId, because a row is a case and not the run."

  - name: sdc.daemon.CaseState
    kind: enum
    variants: [Open, Running, AwaitingPerson, AwaitingAuthority, Stuck, Ended]
    naming:
      summary: "Where a case stands as the daemon reads its run's tree: Ended when it has an outcome; else AwaitingPerson or AwaitingAuthority when its last stop waits on that and the run waits on a decision; else Stuck when its last stop is Stuck or BudgetSpent and the run ended by its tree (Ended and not orphaned; a wait or a cancel that ended with the run, or an orphaned run, leaves it Open); else Running when the run's step in flight names the case; else Open. A type and not a lifecycle: no command moves a case, the daemon reads where it stands."

  - name: sdc.daemon.ProductKind
    kind: enum
    variants: [text, binary]
    naming:
      summary: "What a read found: text (the bytes shown are UTF-8 without a NUL byte; a partial character at a cut does not count) or binary (anything else: no text is answered)."

  - name: sdc.daemon.RouteName
    kind: newtype
    of: String
    naming:
      summary: "The name of a model route the daemon declares (a table [routes.<name>] of its runbook.toml): one to 64 characters of letters, digits, `.`, `_` and `-`. A client names a route by it, never by an address, a token or an alias; the address, the token file and the prices stay in the daemon's file."

  - name: sdc.daemon.ModelRouteKind
    kind: enum
    variants: [managed, hosted, local]
    naming:
      summary: "What stands behind a route's alias at its gateway: managed (a model on a pod the gateway starts and stops), hosted (a fixed upstream, nothing started) or local (a model server on the gateway's machine, such as Ollama). The daemon's file says which; the daemon reads the status of a managed or a local route from the gateway, and sends a hosted route no call to probe it."

  - name: sdc.daemon.RouteStatus
    kind: enum
    variants: [ready, not-ready, listed, model-unknown, gateway-not-ready, gateway-unreachable]
    naming:
      summary: "Where a route stands as the daemon last read its gateway: gateway-unreachable (no answer from `GET /ready` or `GET /v1/models`, or an address the daemon does not speak, https), gateway-not-ready (`/ready` answered, not 200, or `/v1/models` gave no list), model-unknown (the gateway is ready and `GET /v1/models` does not list the route's alias), ready or not-ready (the gateway read the route's model: `callable` of `GET /v1/status`, else the phase of `GET /v1/models/{alias}/status` for a managed or a local route, ready only for the phase ready), listed (the gateway is ready and lists the alias, and no status of the model was read: a hosted route on a gateway without `/v1/status`, or a status route that did not answer). A read sends no model call and starts nothing."

  - name: sdc.daemon.RouteSource
    kind: enum
    variants: [run, default]
    naming:
      summary: "The setting that chose a run's route: run (the submit named it, `model_route` or `model_routes.<role>`) or default (the submit named none and the daemon's `route_policy.default` applied; a daemon whose file declares no route but a lone `[gateway]` table and a model decider declares the interim route `default` on that gateway and takes it as its default, so a model run that names none says default too). The protocol's own word comes with its story."

  - name: sdc.daemon.RoleRoutes
    kind: newtype
    of: "Map<String, sdc.daemon.RouteName>"
    naming:
      summary: "The route of each named role of a run (`writer`, `review`, ...) besides the role `default`: a role is the word a model process of the run names as its model, and the daemon's relay sends the call to the role's route. A role and a route are each one to 64 characters of letters, digits, `.`, `_` and `-`."

conversions:
  - from: Optional<sdc.daemon.ConfinementLevel>
    to: sdc.daemon.ConfinementLevel
    because: A submit that names no level takes the daemon's default level, and a daemon with none refuses it by name before the command runs; the handler fills the level and a default is never below the floor, so an absent level cannot be refused as below it.
  - from: sdc.daemon.AnswererLabel
    to: sdc.decision.Principal
    because: The label is recorded as the principal that answered; the daemon takes the name as given and only bounds its length.
  - from: sdc.daemon.AnswererLabel
    to: Optional<sdc.decision.Principal>
    because: The request row holds the answerer as an optional principal, set when it is answered.

entities:
  - name: sdc.daemon.Session
    naming:
      summary: "A named group of runs of one client. Open until the client closes it; a closed session takes no new run and keeps the runs it has."
    identity:
      name: session_id
      type: sdc.daemon.SessionId
    fields:
      - {name: client, type: sdc.daemon.ClientLabel}
      - {name: opened_at, type: Timestamp}
      - {name: closed_at, type: Optional<Timestamp>}
    lifecycle:
      initial: Open
      states: [Open, Closed]
      terminal: [Closed]
      transitions:
        - {name: close, from: [Open], to: Closed}

  - name: sdc.daemon.Daemon
    naming:
      summary: "The configuration row of the daemon: what it was started with and what every run is held to. One row, created when the daemon starts."
    identity:
      name: daemon_id
      type: sdc.daemon.DaemonId
    fields:
      - {name: confinement_floor, type: sdc.daemon.ConfinementLevel, summary: "The lowest level the daemon takes (runbook serve --min-confinement). A run below it is refused."}
      - {name: principal, type: sdc.decision.Principal, summary: "Who the daemon acts as: person:<id> or agent:<id> (runbook serve --principal, required, no default). Fixed for the life of the process: no command, header, MCP input or HTTP input changes it. The daemon passes it, and nothing a client typed, to the runtime as the principal of an answer."}
      - {name: started_at, type: Timestamp}
    lifecycle:
      initial: Up
      states: [Up]
      terminal: [Up]

  - name: sdc.daemon.Runbook
    naming:
      summary: "A runbook the daemon can start, as its host lists it: a script of the stub runtime, a runbook of the runbook home (runbook serve --runbook-home, runtime loom) or a runbook of --runbook-dir. The daemon reads the list from the host when a client asks for the view Runbooks; the language cannot read a file system, so no command of the specification creates or changes a row, and a client reads the list only."
    identity:
      name: runbook_id
      type: sdc.daemon.RunbookName
    fields:
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>, summary: "The version the runtime has for the runbook (for the runbook home, the revision of its root protocol); absent when the host names none."}
      - {name: runtime, type: sdc.daemon.RuntimeKind}
    lifecycle:
      initial: Listed
      states: [Listed]
      terminal: [Listed]

  - name: sdc.daemon.ModelRoute
    naming:
      summary: "A model route the daemon declares: a name, the gateway it goes through ([gateways.<name>] of runbook.toml; a lone [gateway] table is the gateway `default`), the gateway's alias of the model and its kind (a daemon that declares no route but has a lone [gateway] table and a model decider declares the interim route `default` on that gateway: kind hosted, its alias the model of the decider, no price), with what the daemon last read of the gateway: the wires `GET /v1/models` lists for the alias and the route's status. The daemon reads its file when it starts and the gateway when a client asks for the view Routes, at most once every 15 seconds (the rows of a read are kept and answered until then); the language cannot read a file or a gateway, so no command creates or changes a row, as with Runbook. No address, token, token file or price is in a row."
    identity:
      name: route
      type: sdc.daemon.RouteName
    fields:
      - {name: gateway, type: String, summary: "The name of the route's gateway in the daemon's file, never its address."}
      - {name: alias, type: String, summary: "The model's alias at the gateway: what the gateway's `GET /v1/models` lists and a model call names."}
      - {name: kind, type: sdc.daemon.ModelRouteKind}
      - {name: wires, type: "List<String>", summary: "The wires the gateway lists for the alias (chat, responses, messages), in its order; none when the gateway did not answer or does not list the alias."}
      - {name: status, type: sdc.daemon.RouteStatus}
      - {name: phase, type: Optional<String>, summary: "The phase the gateway gave for the route's model (ready, starting, stopped, stopping, unreachable, or a phase the gateway adds later); absent when no status of the model was read."}
      - {name: read_at, type: Timestamp, summary: "When the daemon read the gateway for this row."}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: sdc.daemon.Run
    naming:
      summary: "One run of a runbook on the daemon:its inputs as submitted, its confinement, where it stands and how it ended."
    identity:
      name: run_id
      type: sdc.daemon.RunId
    fields:
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: intake, type: String, summary: "The intake document itself, inline in the submit: text, at most 1 MiB."}
      - {name: context_path, type: Optional<sdc.daemon.ContextPath>, summary: "The context directory the run reads (runbook run --context), under one of the daemon context roots; absent when none was given."}
      - {name: settings, type: sdc.daemon.RunSettings}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>, summary: "Where the level came from: the submit or the daemon's default. Absent for a run recorded before the daemon kept it."}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>, summary: "The level the run was submitted with, or took from the daemon's default; absent when none: every decision of the run waits for a client. Fixed at the submit and read from the record, never from the daemon's policy of the day."}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>, summary: "The kind of decider of the run, fixed like the level."}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>, summary: "The session the run was submitted into; absent for a run of no session."}
      - {name: idempotency_key, type: Optional<sdc.daemon.IdempotencyKey>, summary: "The key the submit carried, when it carried one; a later submit with the same key returns this run."}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>, summary: "When the run left its last live state: ended, cancelled or failed to start."}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>, summary: "Set when the run Ended; absent in every other state. Besides the outcome names of the runbook's protocol it holds the daemon's own causes: `orphaned` (the daemon stopped while the run was live and the runtime could not take it up again) and `runtime-failure` (the runtime failed after the run started)."}
      - {name: failure, type: Optional<String>, summary: "Why the run failed to start; absent in every other state."}
      - {name: step_in_flight, type: Optional<sdc.daemon.StepInFlight>, summary: "The step whose program runs now, while the run is Running; absent otherwise (no program runs, the run waits, ended, was cancelled, or the daemon started again). No command of the language sets it: the daemon keeps it in its process from the run event `runbook.action-started` until the program ends, like the rows of Runbook, and a restarted daemon has none."}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>, summary: "The route of the run's role `default`, the role a model process names when it names none of its own: the one the submit named, else the daemon's `route_policy.default`. Absent for a run that makes no model call (its decider is not a model, or its level is A0) and for a run of a daemon with no route. Always a route of the view Routes. Fixed at the submit."}
      - {name: model_route_alias, type: Optional<String>, summary: "The gateway's alias of the model behind model_route, as the daemon's file declared it at the submit: what every call of the role names at the gateway. Absent with model_route."}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>, summary: "The setting that chose model_route: run or default. Absent with model_route."}
      - {name: model_routes, type: Optional<sdc.daemon.RoleRoutes>, summary: "The routes of the other roles the submit named (`model_routes.<role>`), each chosen by the run; absent when it named none."}
    relations:
      - name: session
        kind: references
        target: sdc.daemon.Session
        cardinality: one
        via: session_id
      - name: model_route
        kind: references
        target: sdc.daemon.ModelRoute
        cardinality: one
        via: model_route
      - name: decision_requests
        kind: owns
        target: sdc.daemon.DecisionRequest
        cardinality: many
        via: run_id
      - name: events
        kind: owns
        target: sdc.daemon.RunEvent
        cardinality: many
        via: run_id
    lifecycle:
      initial: Submitted
      states: [Submitted, Running, WaitingOnDecision, Ended, Cancelled, FailedToStart]
      terminal: [Ended, Cancelled, FailedToStart]
      transitions:
        - {name: start, from: [Submitted], to: Running, summary: "The runtime took the run up."}
        - {name: fail_to_start, from: [Submitted], to: FailedToStart, summary: "The runtime could not take the run up."}
        - {name: wait, from: [Running], to: WaitingOnDecision, summary: "The run stopped on a decision."}
        - {name: end, from: [Running], to: Ended, summary: "The run reached an outcome."}
        - {name: resume, from: [WaitingOnDecision], to: Running, summary: "Every decision the run waited on is answered and the runtime took the answers up."}
        - {name: cancel, from: [Submitted, Running, WaitingOnDecision], to: Cancelled, summary: "A client cancelled the run before it ended."}
        - {name: orphan, from: [Running, WaitingOnDecision], to: Ended, summary: "The daemon started again and the runtime holds no live run of this id: the run ends with the outcome orphaned."}

  - name: sdc.daemon.DecisionRequest
    naming:
      summary: "A question a waiting run raised, as a mirror of the runtime's decision request: the daemon copies id, case, action, capability, question and options from the runtime's record and adds the run id. Once a client answered, it holds the answer and who gave it. The runbook's decision contract (sdc.decision) stays the rule for who may answer: the daemon passes the answer and the principal to the runtime, which decides. A request is Withdrawn when its run is cancelled or ended as orphaned (CancelRun and EndOrphanedRun move every Open request of the run in their own step) or when the runtime withdraws it (WithdrawDecision): it stays on record, shows no more as open, and takes no answer."
    identity:
      name: request_id
      type: sdc.daemon.DecisionRequestId
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: case_id, type: String, summary: "The case the runtime opened the request for."}
      - {name: action, type: String}
      - {name: capability, type: String}
      - {name: question, type: String}
      - {name: options, type: "List<sdc.decision.DecisionOption>", summary: "The options of a request read from its case (DecisionArtifact) are the case's, in the contract's shape; a request the runtime built itself names each option by the answer that takes it and its effect."}
      - {name: artifact, type: Optional<sdc.daemon.DecisionArtifact>, summary: "What the request read from its case; absent for a request the runtime built itself."}
      - {name: opened_at, type: Timestamp}
      - {name: answer, type: Optional<String>, summary: "The option letter, or the free text for a question that takes one; present once Answered."}
      - {name: answered_by, type: Optional<sdc.decision.Principal>, summary: "The label the client gave (at most 200 characters): stored and shown, never passed to the runtime and never the principal. A rule or a decider of the run answers under its own name instead, `rule:<name>` or `decider:<kind>`, and a client cannot take a name that starts with either, in any case, or with `router:`, nor one with a non-ASCII or a control character (400)."}
      - {name: principal, type: Optional<sdc.decision.Principal>, summary: "The daemon's principal at the answer, the one the runtime was given; present once Answered. Absent in a record written before the daemon had one. For an answer of a rule or a decider it is that rule's or decider's own principal (`decider:<verdict>`, `rule:<name>`), never the daemon's, which may be a person's."}
      - {name: answered_at, type: Optional<Timestamp>}
    lifecycle:
      initial: Open
      states: [Open, Answered, Withdrawn]
      terminal: [Answered, Withdrawn]
      transitions:
        - {name: answer, from: [Open], to: Answered}
        - {name: withdraw, from: [Open], to: Withdrawn, summary: "The request is no longer waited on: its run was cancelled or ended as orphaned (the command of the run moves it), or the runtime withdrew it."}

  - name: sdc.daemon.RunEvent
    naming:
      summary: "One record of a run, in the order the runtime wrote it. The runtime's own record is carried unchanged, as an opaque document; the daemon adds the run, the session, two numbers and the time. `sequence` counts per run, `position` counts per daemon over all runs: the stream's event id is the position, and a client resumes after the last position it saw."
    identity:
      name: event_id
      type: sdc.daemon.EventId
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>, summary: "The session of the run, copied from it by the handler when it records the event; absent for a run of no session. It is what lets the events of a session be paged by position."}
      - {name: sequence, type: Integer, summary: "Per run, from 1; each later event of the run has a larger number."}
      - {name: position, type: Integer, summary: "Per daemon, from 1, strictly increasing over all runs; minted by the daemon when it records the event."}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json, summary: "The runtime's record, byte for byte as a document; no secret appears in it (design sheet, decision 10)."}
      - {name: at, type: Timestamp}
    relations:
      - name: session
        kind: references
        target: sdc.daemon.Session
        cardinality: one
        via: session_id
    invariants:
      - sequence >= 1
      - position >= 1
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: sdc.daemon.RunProducts
    naming:
      summary: "What a run wrote under its work/ directory, as the daemon finds it when a client asks for the view ProductsOfRun: one row per run the daemon knows. The daemon reads the directory from the host through one reader (runbook/src/engine/products.rs) with the guards of the inspector's file route: no link is followed or listed, a file with more than one name is not listed, a name that starts with a dot is neither listed nor entered, and the walk stops at 500 files, 2000 directories, 20000 entries and 6 levels. The language cannot read a file system, so no command creates or changes a row, as with Runbook."
    identity:
      name: work_id
      type: sdc.daemon.WorkId
    fields:
      - {name: run_id, type: sdc.daemon.RunId, summary: "The run whose work/ directory this is."}
      - {name: files, type: "List<sdc.daemon.ProductFile>", summary: "The files, by path."}
      - {name: cut, type: Optional<String>, summary: "The bound the listing stopped at: files, directories, entries or depth; absent when it walked the whole directory."}
      - {name: hidden, type: Integer, summary: "Entries whose name starts with a dot: neither listed nor served."}
      - {name: left_out, type: Integer, summary: "Links and files with more than one name: neither listed nor served."}
    relations:
      - {name: run, kind: references, target: sdc.daemon.Run, cardinality: one, via: run_id}
    lifecycle:
      initial: Listed
      states: [Listed]
      terminal: [Listed]

  - name: sdc.daemon.RunProduct
    naming:
      summary: "One file of a run's work/ directory, read when a client asks for the view ProductOfRun. The reader opens each directory on the path and the file relative to the one before without following a link, reads the type and the link count from the open file before a byte, and reads at most `limit` bytes in the daemon's process; no program opens the file. As with RunProducts, no command creates or changes a row."
    identity:
      name: path
      type: sdc.daemon.ProductPath
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: size, type: Integer, summary: "The length of the file in bytes."}
      - {name: modified_at, type: Timestamp}
      - {name: kind, type: sdc.daemon.ProductKind}
      - {name: text, type: Optional<String>, summary: "The first `limit` bytes as text; absent when kind is binary."}
      - {name: shown, type: Integer, summary: "The bytes of `text`; 0 for binary."}
      - {name: truncated, type: Boolean, summary: "True when the file holds more than `limit` bytes: `text` is its start."}
      - {name: limit, type: Integer, summary: "The most bytes a read answers: 1048576."}
    relations:
      - {name: run, kind: references, target: sdc.daemon.Run, cardinality: one, via: run_id}
    lifecycle:
      initial: Read
      states: [Read]
      terminal: [Read]

  - name: sdc.daemon.Delegation
    naming:
      summary: "What a delegation's run has come to, as the daemon reads it when a client asks for the view DelegationResult: one row per run that a Delegate created. The route, the path and the protocol are the run's event `runbook.delegated`; the state, the outcome and the failure are the Run's; the calls, the tokens and the cost are the sum of the run's events `runbook.model-call` (one per call the relay booked); the result text is the file result.md of the run's work/ directory, read through the reader of ProductOfRun (no link followed, at most `result_limit` bytes), and the products are the paths ProductsOfRun lists. The language cannot read a file system, so no command creates or changes a row, as with RunProducts."
    identity:
      name: delegation_id
      type: sdc.daemon.DelegationId
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: run_state, type: sdc.daemon.Run.State, summary: "Where the run stands. Not `state`: that member of an entity is its lifecycle, and no command moves a row of this one."}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>, summary: "The run's outcome once it Ended."}
      - {name: failure, type: Optional<String>, summary: "Why the run failed to start, or what failed it after it started (the runtime's reason); absent otherwise."}
      - {name: route, type: sdc.daemon.RouteName, summary: "The model route of the run, by name."}
      - {name: path, type: sdc.daemon.DelegationPath}
      - {name: protocol, type: sdc.daemon.RunbookId, summary: "The runbook the run runs: the named one, or delegation-free."}
      - {name: confidence, type: Optional<Json>, summary: "The classifier's confidence, a number from 0 to 1, for a classified delegation; null for the paths named and free."}
      - {name: result_text, type: Optional<String>, summary: "The text of result.md in the run's work/ directory, at most `result_limit` bytes; absent while the run has written none, and for a file that is not text."}
      - {name: result_truncated, type: Boolean, summary: "True when result.md holds more than `result_limit` bytes: `result_text` is its start."}
      - {name: result_limit, type: Integer, summary: "The most bytes of result.md the view answers: 1048576."}
      - {name: products, type: "List<String>", summary: "The paths of the files of the run's work/ directory, as ProductsOfRun lists them."}
      - {name: calls, type: Integer, summary: "The model calls the relay booked for the run."}
      - {name: input_tokens, type: Integer, summary: "The input tokens those calls reported; a call that reported none adds 0."}
      - {name: output_tokens, type: Integer}
      - {name: cost_micro_usd, type: Integer, summary: "What the calls booked: the route's declared price times the tokens, else the reservation of a call of unknown cost."}
      - {name: cost_known, type: Boolean, summary: "False when any call was booked at its reservation because its cost was not known."}
    relations:
      - {name: run, kind: references, target: sdc.daemon.Run, cardinality: one, via: run_id}
      - {name: route, kind: references, target: sdc.daemon.ModelRoute, cardinality: one, via: route}
    lifecycle:
      initial: Read
      states: [Read]
      terminal: [Read]

  - name: sdc.daemon.RunCase
    naming:
      summary: "One case of a run's tree, as the runtime reads the run's store when a client asks for the view CasesOfRun: the Loom runtime answers it from Loom's tree status of the store, which it reads without holding it, so it answers while the run goes on; the stub runtime has no tree and answers none. No path of the store or of a case file is in a row. The language cannot read a store, so no command creates or changes a row, as with Runbook."
    identity:
      name: case_key
      type: sdc.daemon.CaseKey
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: case_id, type: String, summary: "The case's id in the run's tree."}
      - {name: parent, type: Optional<String>, summary: "The case that opened this one; absent for the root."}
      - {name: name, type: Optional<String>, summary: "The name the opening action gave the case (its link name); absent for the root."}
      - {name: protocol, type: String, summary: "The id of the case's protocol."}
      - {name: case_state, type: sdc.daemon.CaseState, summary: "Where the case stands when the daemon reads the tree. Not `state`: that member of an entity is its lifecycle, and no command moves a case."}
      - {name: outcome, type: Optional<String>, summary: "The outcome the case ended through; absent while it is not ended."}
    relations:
      - {name: run, kind: references, target: sdc.daemon.Run, cardinality: one, via: run_id}
    lifecycle:
      initial: Seen
      states: [Seen]
      terminal: [Seen]

actors:
  - name: sdc.daemon.Runtime
    naming:
      display: Runtime
      summary: "The engine behind the daemon (Loom, or a stub in the tests): reports how each run goes. Not reachable over the network: the daemon issues these commands on the runtime's behalf."
    may:
      - sdc.daemon.StartRun
      - sdc.daemon.FailRunStart
      - sdc.daemon.WaitOnDecision
      - sdc.daemon.RequestDecision
      - sdc.daemon.WithdrawDecision
      - sdc.daemon.ResumeRun
      - sdc.daemon.RecordRunEvent
      - sdc.daemon.EndRun

  - name: sdc.daemon.DaemonProcess
    naming:
      display: Daemon process
      summary: "The daemon acting on its own, with no client and no runtime report behind it: at start it ends a live run whose runtime is gone; that command withdraws the run's Open decision requests itself. Not reachable over the network: an actor that is not Client has no route in the HTTP contract."
    may:
      - sdc.daemon.EndOrphanedRun

  - name: sdc.daemon.Operator
    naming:
      display: Operator
      summary: "Whoever starts the daemon (runbook serve): sets what every run is held to."
    may:
      - sdc.daemon.StartDaemon

  - name: sdc.daemon.Client
    naming:
      display: Client
      summary: "A caller of the API: the CLI, the web UI or an MCP tool, over HTTP."
    may:
      - sdc.daemon.OpenSession
      - sdc.daemon.CloseSession
      - sdc.daemon.SubmitRun
      - sdc.daemon.CancelRun
      - sdc.daemon.AnswerDecision
      - sdc.daemon.Delegate

errors:
  - name: sdc.daemon.NoSuchDecisionRequest
    summary: "No decision request has this id."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}

  - name: sdc.daemon.DecisionAlreadyAnswered
    summary: "The decision request is already Answered: the first answer stands and nothing changed."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}

  - name: sdc.daemon.UnknownOption
    summary: "The answer names none of the options of a request read from its case (and the request takes no free answer): the request stays Open and nothing was handed to the runtime."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}

  - name: sdc.daemon.DecisionWithdrawn
    summary: "The decision request was withdrawn (its run was cancelled or ended as orphaned, which withdraws the run's Open requests itself, or the runtime withdrew it): it takes no answer; nothing changed."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}

  - name: sdc.daemon.DecisionNotOpen
    summary: "The decision request is not Open, so it cannot be withdrawn; nothing changed."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}

  - name: sdc.daemon.ContextOutsideRoots
    summary: "The context directory does not lie under any of the daemon's context roots (runbook serve --context-root), or the daemon has none: the run was not submitted. The handler checks the path against the host and reports the fact in `context_inside_roots`."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.NoSuchRunbook
    summary: "No preset and no runbook of the daemon's --runbook-dir has this name (and version): the run was not submitted. The handler looks the runbook up and reports the fact in `runbook_known`."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.RouteRefused
    summary: "The model route the run would take is refused: the submit named a route the daemon's file does not declare, a gateway's alias, an address or a token instead of a route's name, or a route for a run that makes no model call; or the run makes model calls, names no route, and the daemon declares routes and no `route_policy.default`. A delegation is refused the same way for the route it names, and when it names none and the daemon has no `route_policy.default`. The run was not submitted and nothing was written. The reason names what was wrong, never the value the client sent; `declared` lists the routes the daemon declares, in order of name."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: reason, type: String}
      - {name: declared, type: "List<sdc.daemon.RouteName>"}

  - name: sdc.daemon.IntakeTooLarge
    summary: "The inline intake is larger than 1 MiB: the run was not submitted. The handler holds the limit as 1,048,576 bytes of UTF-8; the specification counts characters, the weaker bound."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.PositionNotAscending
    summary: "An event of the daemon already has this position or a larger one: positions only grow over all runs, and nothing was recorded."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: position, type: Integer}

  - name: sdc.daemon.DecisionNotOfRun
    summary: "The decision request belongs to another run than the one named; nothing changed."
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.DecisionStillOpen
    summary: "The run still has an open decision request, so it cannot resume; nothing changed."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.RunNotWaiting
    summary: "The run is not WaitingOnDecision: it takes no decision request and no answer; nothing changed."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.RunClosedToEvents
    summary: "The run has ended, was cancelled or failed to start: it takes no more events."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.SequenceNotAscending
    summary: "The run already has an event with this sequence number or a larger one: the sequence number of a run only grows, and nothing was recorded."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: sequence, type: Integer}

  - name: sdc.daemon.NoSuchRun
    summary: "No run has this id."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.RunStateConflict
    summary: "The run is not in a state this command acts from, so nothing moved."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.RunAlreadyEnded
    summary: "The run has ended, was cancelled or failed to start: there is nothing left to cancel."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}

  - name: sdc.daemon.DaemonAlreadyStarted
    summary: "The daemon already has its configuration row; the first start stands."
    fields:
      - {name: daemon_id, type: sdc.daemon.DaemonId}

  - name: sdc.daemon.NoSuchDaemon
    summary: "No daemon was started under this id."
    fields:
      - {name: daemon_id, type: sdc.daemon.DaemonId}

  - name: sdc.daemon.BelowConfinementFloor
    summary: "The requested confinement is below the daemon's floor; the run was not submitted."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}

  - name: sdc.daemon.SessionClosedToRuns
    summary: "The session is Closed and takes no new run; the run was not submitted."
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: sdc.daemon.SessionId}

  - name: sdc.daemon.SessionExists
    summary: "A session with this name is already open or closed; nothing was opened."
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}

  - name: sdc.daemon.NoSuchSession
    summary: "No session has this name."
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}

  - name: sdc.daemon.SessionStateConflict
    summary: "The session is not in a state this command acts from, so nothing moved."
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}

commands:
  - name: sdc.daemon.OpenSession
    naming:
      wire: open-session
      display: Open a session
      summary: "Open a named session for a client. Runs submitted into it are listed and streamed together."
    input:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: client, type: sdc.daemon.ClientLabel}
      - {name: at, type: Timestamp}
    outcomes:
      - name: opened
        when_related: {via: input.session_id, exists: false}
        creates: sdc.daemon.Session
        instance: session_id
        sets:
          client: input.client
          opened_at: input.at
        emits:
          - sdc.daemon.SessionOpened
        payload:
          sdc.daemon.SessionOpened:
            session_id: input.session_id
            client: input.client
        summary: "The session is Open and holds no run."
      - name: session-exists
        error: sdc.daemon.SessionExists
        summary: "The name is taken: the first session stands."

  - name: sdc.daemon.CloseSession
    naming:
      wire: close-session
      display: Close a session
      summary: "Close a session: it takes no new run. Its runs go on and stay listed."
    input:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-session
        unknown_instance: true
        error: sdc.daemon.NoSuchSession
        summary: "No session has this name."
      - name: closed
        moves: sdc.daemon.Session.close
        instance: session_id
        sets:
          closed_at: input.at
        emits:
          - sdc.daemon.SessionClosed
        payload:
          sdc.daemon.SessionClosed:
            session_id: input.session_id
        summary: "The session is Closed."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.SessionStateConflict
        summary: "The session is already Closed."

  - name: sdc.daemon.StartDaemon
    naming:
      wire: start-daemon
      display: Start the daemon
      summary: "Record what the daemon was started with: its confinement floor and its principal. Runs once, before the daemon takes a request; the daemon holds the row until it stops."
    input:
      - {name: daemon_id, type: sdc.daemon.DaemonId}
      - {name: confinement_floor, type: sdc.daemon.ConfinementLevel}
      - {name: principal, type: sdc.decision.Principal}
      - {name: at, type: Timestamp}
    outcomes:
      - name: started
        when_related: {via: input.daemon_id, exists: false}
        creates: sdc.daemon.Daemon
        instance: daemon_id
        sets:
          confinement_floor: input.confinement_floor
          principal: input.principal
          started_at: input.at
        emits:
          - sdc.daemon.DaemonStarted
        payload:
          sdc.daemon.DaemonStarted:
            daemon_id: input.daemon_id
            confinement_floor: input.confinement_floor
        summary: "The daemon holds its floor."
      - name: already-started
        error: sdc.daemon.DaemonAlreadyStarted
        summary: "The daemon was started already: its first floor stands."

  - name: sdc.daemon.SubmitRun
    naming:
      wire: submit-run
      display: Submit a run
      summary: "Submit a run of a runbook: its intake (inline), its context (a path under a daemon context root), its settings and its confinement (optional: a submit that names none runs at the daemon's default level; a daemon with none refuses it by name, and nothing is written), and optionally an autonomy level and a decider kind (a submit that names none takes the daemon's defaults; a kind the operator did not configure, or a level with no kind to take it, is refused before anything is written and creates no run), into a session or alone. The run is Submitted; the runtime starts it. The accepted outcome (submitted) also makes the daemon write the run's first event: kind `runbook.submitted`, sequence 1, record {run_id, runbook_id, confinement, confinement_source, and autonomy, decider, model_route, model_route_alias and model_route_source when the run has them}, and the next position of the daemon; the run's next sequence starts at 2, so the first event the runtime records for the run is sequence 2 (RecordRunEvent). A replayed submit (already-submitted) writes no event and creates no run; a refused submit (every error outcome) creates no run and writes none. The language cannot write a RunEvent from this command (an outcome creates or moves rows of one entity), so this is stated here and in the summaries of the daemon's other own events, and read through the event views only: the interpreted target keeps no row for it and accepts sequence 1, the daemon refuses it as not ascending. The daemon mints the run id and the HTTP handler fills `run_id` and `daemon_id`; a client never chooses them. A client that wants a safe retry sends an `idempotency_key`: a second submit with a key already used returns the first run and creates none (outcome already-submitted, answered with the first run). The handler also reports three facts it reads from the host, because the language cannot read a file system: `runbook_known`, `context_inside_roots` and the size of the inline intake (checked here); the checks themselves are outside the language and are tested in the story daemon-skeleton-on-a-runtime-trait. The client names no daemon: `daemon_id` is an input because a guard that reads the Daemon row through a row set cannot be synthesized (ESS-SYNTH-001), while `via` plus `predicate` can. The floor guard spells the order of the two levels out, one outcome for the one floor that refuses something, because the ordered comparison `confinement_floor > input.confinement` validates but the interpreted target then accepts every level (a defect of the interpreted target of ESS 0.96.0); the outcome changes with the level names. A run that makes model calls (its decider is a model at a level above A0) takes a model route (docs/model-routes.md, section 2): the one the submit names by name in `model_route` (and per role in `model_routes`), else the daemon's `route_policy.default`; the handler resolves it against the routes the daemon's file declares, fills `model_route`, `model_route_alias` and `model_route_source`, and reports a route it refuses in the fact `route_refused` before anything is written. The route is recorded on the run; the runtime sends every model call of the run through the daemon's relay to that route's gateway, with the route's alias as the model."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: intake, type: String}
      - {name: context_path, type: Optional<sdc.daemon.ContextPath>}
      - {name: settings, type: sdc.daemon.RunSettings}
      - {name: confinement, type: Optional<sdc.daemon.ConfinementLevel>, summary: "The level the client named; absent when it named none, and the run then takes the daemon's default level (a daemon with none refuses the submit by name; the handler fills it and says which in confinement_source)."}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>, summary: "Where the level came from: the handler fills it. A client never sends it."}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>, summary: "The autonomy level of the run, A0 to A5: how much of its decisions a decider takes over from a person. Absent: the daemon's default level, and when it has none every decision of the run waits for a client."}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>, summary: "The kind of the decider that answers what the level gives it, a name among the kinds the operator configured. Absent: the daemon's default kind. A kind that is not configured, and a level with no kind to take it, are refused before anything is written (400)."}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: idempotency_key, type: Optional<sdc.daemon.IdempotencyKey>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>, summary: "The route of the run's role `default`, by the name the daemon's file declares it under; never an address, a token or a gateway's alias, each refused by name. Absent: the daemon's `route_policy.default` for a run that makes model calls (the handler fills it and says which in model_route_source), none for a run that makes none. A run that makes no model call and names a route is refused (route-refused)."}
      - {name: model_routes, type: Optional<sdc.daemon.RoleRoutes>, summary: "The route of each further role of the run, by name, under the same rules as model_route."}
      - {name: model_route_alias, type: Optional<String>, summary: "The alias of model_route at its gateway: the handler fills it from the daemon's file. A client never sends it."}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>, summary: "Where model_route came from: the handler fills it. A client never sends it."}
      - {name: route_refused, type: Optional<String>, summary: "Why the handler refuses the run's route, when it does: a fact it reads from the daemon's file, which the language cannot read. Absent when the route is admitted or the run takes none. A client never sends it."}
      - {name: runbook_known, type: Boolean}
      - {name: context_inside_roots, type: Boolean}
      - {name: daemon_id, type: sdc.daemon.DaemonId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: intake-too-large
        when: intake.count > 1048576
        error: sdc.daemon.IntakeTooLarge
        summary: "The inline intake is larger than 1 MiB: nothing was submitted."
      - name: no-runbook
        when: runbook_known == false
        error: sdc.daemon.NoSuchRunbook
        summary: "No preset and no runbook of the daemon's runbook directory has this name: nothing was submitted."
      - name: context-outside-roots
        when: context_inside_roots == false
        error: sdc.daemon.ContextOutsideRoots
        summary: "The context path lies under no context root of the daemon: nothing was submitted."
      - name: route-refused
        when: defined(route_refused)
        error: sdc.daemon.RouteRefused
        summary: "The run's model route is refused (an undeclared route, an address, a token or an alias named in its place, a route for a run that makes no model call, or no route and no default for one that makes some): nothing was submitted. The answer lists the declared routes."
      - name: no-daemon
        when_related: {via: input.daemon_id, exists: false}
        error: sdc.daemon.NoSuchDaemon
        summary: "No daemon was started under this id: nothing was submitted."
      - name: no-session
        when_related: {via: input.session_id, exists: false}
        error: sdc.daemon.NoSuchSession
        summary: "A session was named and none has that name: nothing was submitted."
      - name: below-floor
        when: {all: [defined(confinement), {confinement: {in: [local]}}]}
        when_related: {via: input.daemon_id, predicate: confinement_floor == linux}
        error: sdc.daemon.BelowConfinementFloor
        summary: "The daemon's floor is linux and the submit names the confinement local: nothing was submitted. A submit that names none takes the daemon's default and is not below the floor."
      - name: session-closed
        when_related: {via: input.session_id, predicate: state == Closed}
        error: sdc.daemon.SessionClosedToRuns
        summary: "The named session is Closed and takes no new run: nothing was submitted."
      - name: already-submitted
        when: defined(idempotency_key)
        when_related:
          entity: sdc.daemon.Run
          where: idempotency_key == input.idempotency_key
          exists: true
        emits:
          - sdc.daemon.SubmitReplayed
        payload:
          sdc.daemon.SubmitReplayed:
            idempotency_key: input.idempotency_key
            run_id: {related: {entity: sdc.daemon.Run, where: idempotency_key == input.idempotency_key, field: run_id}}
        summary: "A run was submitted with this idempotency key: nothing is created, no run event is written, and the answer is that first run: the event it publishes carries its id (run_id), in the body of the answer."
      - name: submitted
        creates: sdc.daemon.Run
        instance: run_id
        sets:
          runbook_id: input.runbook_id
          runbook_version: input.runbook_version
          intake: input.intake
          context_path: input.context_path
          settings: input.settings
          confinement: input.confinement
          confinement_source: input.confinement_source
          autonomy: input.autonomy
          decider: input.decider
          session_id: input.session_id
          idempotency_key: input.idempotency_key
          model_route: input.model_route
          model_route_alias: input.model_route_alias
          model_route_source: input.model_route_source
          model_routes: input.model_routes
          submitted_at: input.at
        emits:
          - sdc.daemon.RunSubmitted
        payload:
          sdc.daemon.RunSubmitted:
            run_id: input.run_id
            runbook_id: input.runbook_id
            confinement: input.confinement
        summary: "The run is Submitted and holds its first event, `runbook.submitted`, sequence 1 (position: the next of the daemon)."

  - name: sdc.daemon.Delegate
    naming:
      wire: delegate
      display: Delegate agent work
      summary: "Ask the daemon for a piece of agent work on a named model route (docs/model-routes.md, section 8): the request as text, the route by name, and optionally a protocol (a runbook the daemon can run), a workspace (a directory under a daemon context root, copied into the run's workspace), settings, a session and an idempotency key. A delegation is a run: the accepted outcome (delegated) creates the Run as SubmitRun does, with the request as its intake, at the daemon's default level, and the daemon writes the run's first event `runbook.submitted` (sequence 1) and its second, `runbook.delegated` (the route, the path and the protocol), before the runtime records any; cancel-run, the run views and the events work on it unchanged. With a protocol that runbook runs (path `named`); without, the free run (path `free`): one agent node whose instruction is the request, on the delegation's route, in the run's workspace, writing `result.md`; its runbook is `delegation-free`, the handler fills `runbook_id` with it. Every model call of the run goes to that route through the daemon's relay. The run's result is read by its id from the view DelegationResult. The handler mints the run id and fills `run_id`, `runbook_id`, `confinement`, `route`, `model_route_alias`, `model_route_source`, `daemon_id` and `at`, and reports four facts it reads from the host: `route_declared` (the route the delegation names, or the daemon's default route when it names none, is one the daemon declares), `runbook_known`, `context_inside_roots` and the size of the request (checked here). Before anything is written the handler also asks the route's gateway whether it is ready (`GET /ready`, a few seconds at most); a gateway that does not answer 200 refuses the delegation with 503 `route-unavailable` naming the route, the daemon's `{refused, message}` answer, outside the language as a draining daemon's refusal is."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: request, type: String, summary: "The work asked for, as text: the run's intake, at most 1 MiB."}
      - {name: model_route, type: Optional<String>, summary: "The route the run's model calls take, by the name the daemon declares it under; absent: the daemon's default route, and a daemon with none refuses the delegation as route-refused. Never an address, a token or an alias."}
      - {name: protocol, type: Optional<sdc.daemon.RunbookId>, summary: "The runbook to run with the request as its intake; absent: the free run."}
      - {name: workspace, type: Optional<sdc.daemon.ContextPath>, summary: "A directory under one of the daemon's context roots: its files are copied into the run's workspace before the run starts."}
      - {name: settings, type: sdc.daemon.RunSettings}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: idempotency_key, type: Optional<sdc.daemon.IdempotencyKey>}
      - {name: runbook_id, type: sdc.daemon.RunbookId, summary: "The runbook the run takes: the protocol, else delegation-free. The handler fills it."}
      - {name: confinement, type: sdc.daemon.ConfinementLevel, summary: "The daemon's default level: a delegation names none. The handler fills it; a daemon with no default refuses the delegation by name (400) and writes nothing."}
      - {name: route, type: sdc.daemon.RouteName, summary: "The route the run takes, by name: model_route, else the daemon's default route. The handler fills it."}
      - {name: model_route_alias, type: String, summary: "The alias of route at its gateway, as the daemon's file declares it. The handler fills it."}
      - {name: model_route_source, type: sdc.daemon.RouteSource, summary: "run when the delegation named its route, default when it took route_policy.default. The handler fills it."}
      - {name: path, type: sdc.daemon.DelegationPath, summary: "named when the delegation names a protocol, else free. The handler fills it."}
      - {name: route_declared, type: Boolean}
      - {name: runbook_known, type: Boolean}
      - {name: context_inside_roots, type: Boolean}
      - {name: daemon_id, type: sdc.daemon.DaemonId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: intake-too-large
        when: request.count > 1048576
        error: sdc.daemon.IntakeTooLarge
        summary: "The request is larger than 1 MiB: nothing was submitted."
      - name: route-refused
        when: route_declared == false
        error: sdc.daemon.RouteRefused
        summary: "The delegation names a route the daemon does not declare, or names none and the daemon has no default route: nothing was submitted, and the answer lists the declared routes. The refusals of a named route are the run's (submit-run): an alias, an address, a token or an empty name in its place is refused too, and the reason names what was wrong, never the value."
      - name: no-runbook
        when: runbook_known == false
        error: sdc.daemon.NoSuchRunbook
        summary: "The protocol is no runbook the daemon can run: nothing was submitted."
      - name: context-outside-roots
        when: context_inside_roots == false
        error: sdc.daemon.ContextOutsideRoots
        summary: "The workspace lies under no context root of the daemon: nothing was submitted."
      - name: no-daemon
        when_related: {via: input.daemon_id, exists: false}
        error: sdc.daemon.NoSuchDaemon
        summary: "No daemon was started under this id: nothing was submitted."
      - name: no-session
        when_related: {via: input.session_id, exists: false}
        error: sdc.daemon.NoSuchSession
        summary: "A session was named and none has that name: nothing was submitted."
      - name: session-closed
        when_related: {via: input.session_id, predicate: state == Closed}
        error: sdc.daemon.SessionClosedToRuns
        summary: "The named session is Closed and takes no new run: nothing was submitted."
      - name: already-submitted
        when: defined(idempotency_key)
        when_related:
          entity: sdc.daemon.Run
          where: idempotency_key == input.idempotency_key
          exists: true
        emits:
          - sdc.daemon.SubmitReplayed
        payload:
          sdc.daemon.SubmitReplayed:
            idempotency_key: input.idempotency_key
            run_id: {related: {entity: sdc.daemon.Run, where: idempotency_key == input.idempotency_key, field: run_id}}
        summary: "A run was submitted with this idempotency key: nothing is created and the answer is that first run."
      - name: delegated
        creates: sdc.daemon.Run
        instance: run_id
        sets:
          runbook_id: input.runbook_id
          intake: input.request
          context_path: input.workspace
          settings: input.settings
          confinement: input.confinement
          session_id: input.session_id
          idempotency_key: input.idempotency_key
          model_route: input.route
          model_route_alias: input.model_route_alias
          model_route_source: input.model_route_source
          submitted_at: input.at
        emits:
          - sdc.daemon.RunSubmitted
          - sdc.daemon.RunDelegated
        payload:
          sdc.daemon.RunSubmitted:
            run_id: input.run_id
            runbook_id: input.runbook_id
            confinement: input.confinement
          sdc.daemon.RunDelegated:
            run_id: input.run_id
            route: input.route
            path: input.path
            protocol: input.runbook_id
        summary: "The run is Submitted on the route and holds its first two events, `runbook.submitted` and `runbook.delegated`. The answer names the run (`run_id` of RunSubmitted, and the `Location` header: the view DelegationResult of the run), the route and the path (RunDelegated)."

  - name: sdc.daemon.CancelRun
    naming:
      wire: cancel-run
      display: Cancel a run
      summary: "Cancel a run that has not ended: Submitted, Running or WaitingOnDecision. The daemon stops the run in the runtime; a run that ended, was cancelled or failed to start is refused. In the same step the run's Open decision requests move to Withdrawn (the outcome's `affects` entry): no WithdrawDecision follows, and an answer to such a request is refused as DecisionWithdrawn. The daemon also writes the run event `runbook.cancel-requested` (an event of the daemon's own, see SubmitRun) just before the run is Cancelled; the language cannot write a RunEvent from this command (an outcome creates or moves rows of one entity and its `affects` entries move rows, they do not create them), so the event is stated here and read through the event views only."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: cancelled
        moves: sdc.daemon.Run.cancel
        instance: run_id
        sets:
          ended_at: input.at
        affects:
          - entity: sdc.daemon.DecisionRequest
            where: run_id == input.run_id
            moves: sdc.daemon.DecisionRequest.withdraw
        emits:
          - sdc.daemon.RunCancelled
        payload:
          sdc.daemon.RunCancelled:
            run_id: input.run_id
        summary: "The run is Cancelled and every Open decision request of it is Withdrawn. The outcome publishes RunCancelled only: a request withdrawn this way publishes no DecisionRequestWithdrawn (that event belongs to WithdrawDecision)."
      - name: already-ended
        wrong_state: true
        error: sdc.daemon.RunAlreadyEnded
        summary: "The run is Ended, Cancelled or FailedToStart."

  - name: sdc.daemon.StartRun
    naming:
      wire: start-run
      display: Report a run started
      summary: "The runtime took a Submitted run up."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: started
        moves: sdc.daemon.Run.start
        instance: run_id
        sets:
          started_at: input.at
        emits:
          - sdc.daemon.RunStarted
        payload:
          sdc.daemon.RunStarted:
            run_id: input.run_id
        summary: "The run is Running."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not Submitted."

  - name: sdc.daemon.FailRunStart
    naming:
      wire: fail-run-start
      display: Report a run that could not start
      summary: "The runtime could not take a Submitted run up: the reason is kept and the run is FailedToStart. The daemon also writes the run event `runbook.start-failed` (record: reason) just before the run is FailedToStart (see CancelRun for why it is stated here)."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: reason, type: String}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: failed
        moves: sdc.daemon.Run.fail_to_start
        instance: run_id
        sets:
          failure: input.reason
          ended_at: input.at
        emits:
          - sdc.daemon.RunFailedToStart
        payload:
          sdc.daemon.RunFailedToStart:
            run_id: input.run_id
            reason: input.reason
        summary: "The run is FailedToStart."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not Submitted."

  - name: sdc.daemon.WaitOnDecision
    naming:
      wire: wait-on-decision
      display: Report a run waiting on a decision
      summary: "The runtime stopped a Running run on a decision. It reports this first and then raises the request with RequestDecision, so a request is only ever raised for a run that waits."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: waiting
        moves: sdc.daemon.Run.wait
        instance: run_id
        emits:
          - sdc.daemon.RunWaiting
        payload:
          sdc.daemon.RunWaiting:
            run_id: input.run_id
        summary: "The run is WaitingOnDecision."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not Running."

  - name: sdc.daemon.ResumeRun
    naming:
      wire: resume-run
      display: Report a run resumed
      summary: "The runtime took up the answers and the run goes on. Refused while a decision request of the run is still Open: the run waits on every one of them."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: still-open
        when_related:
          entity: sdc.daemon.DecisionRequest
          where: {all: [run_id == input.run_id, state == Open]}
          exists: true
        error: sdc.daemon.DecisionStillOpen
        summary: "A decision request of the run is Open."
      - name: resumed
        moves: sdc.daemon.Run.resume
        instance: run_id
        emits:
          - sdc.daemon.RunResumed
        payload:
          sdc.daemon.RunResumed:
            run_id: input.run_id
        summary: "The run is Running again."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not WaitingOnDecision."

  - name: sdc.daemon.RequestDecision
    naming:
      wire: request-decision
      display: Raise a decision request
      summary: "The runtime asks a question of a run that waits (after WaitOnDecision). The request is Open until a client answers it."
    input:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: case_id, type: String}
      - {name: action, type: String}
      - {name: capability, type: String}
      - {name: question, type: String}
      - {name: options, type: "List<sdc.decision.DecisionOption>"}
      - {name: artifact, type: Optional<sdc.daemon.DecisionArtifact>}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        when_related: {via: input.run_id, exists: false}
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: run-not-waiting
        when_related: {via: input.run_id, predicate: state != WaitingOnDecision}
        error: sdc.daemon.RunNotWaiting
        summary: "The run is not WaitingOnDecision."
      - name: requested
        creates: sdc.daemon.DecisionRequest
        instance: request_id
        sets:
          run_id: input.run_id
          case_id: input.case_id
          action: input.action
          capability: input.capability
          question: input.question
          options: input.options
          artifact: input.artifact
          opened_at: input.at
        emits:
          - sdc.daemon.DecisionRequested
        payload:
          sdc.daemon.DecisionRequested:
            request_id: input.request_id
            run_id: input.run_id
        summary: "The request is Open."

  - name: sdc.daemon.WithdrawDecision
    naming:
      wire: withdraw-decision
      display: Withdraw a decision request
      summary: "The runtime withdraws one Open decision request of a run that goes on. CancelRun and EndOrphanedRun do not issue it: each withdraws every Open request of its run in its own step, so after either of them a request of that run answers not-open here. It is reachable for an Open request, which exists only while its run is WaitingOnDecision. The request keeps its record, shows no more in OpenDecisionsOfRun and takes no answer. The daemon has no runtime report that maps to it yet (the Runtime trait has none), so it is a call of the command layer today."
    input:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
    outcomes:
      - name: no-request
        unknown_instance: true
        error: sdc.daemon.NoSuchDecisionRequest
        summary: "No decision request has this id."
      - name: withdrawn
        moves: sdc.daemon.DecisionRequest.withdraw
        instance: request_id
        emits:
          - sdc.daemon.DecisionRequestWithdrawn
        payload:
          sdc.daemon.DecisionRequestWithdrawn:
            request_id: input.request_id
        summary: "The request is Withdrawn."
      - name: not-open
        wrong_state: true
        error: sdc.daemon.DecisionNotOpen
        summary: "The request is Answered or Withdrawn already."

  - name: sdc.daemon.AnswerDecision
    naming:
      wire: answer-decision
      display: Answer a decision
      summary: "A client answers an Open decision request of a run that waits. An answer to a request that is already answered is refused: the first answer stands. An answer to a withdrawn request (its run was cancelled or ended as orphaned) is refused as DecisionWithdrawn. When the answer stands but the runtime cannot take it up (its run is gone), the daemon writes the run event `runbook.answer-undeliverable` (record: request_id) after the request is Answered (see CancelRun for why it is stated here)."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: answer, type: String}
      - {name: answered_by, type: sdc.daemon.AnswererLabel}
      - {name: principal, type: sdc.decision.Principal, summary: "The daemon's own principal (runbook serve --principal). The handler fills it from the daemon's configuration; a client never sends it, no HTTP body member or MCP argument sets it, and the HTTP/MCP schema of the client's input has no such member."}
      - {name: answer_offered, type: Boolean, summary: "Whether the request takes the answer: false only for an Open request of the named run, while that run is WaitingOnDecision, that carries an artifact (DecisionArtifact), when the answer is neither the letter of one of its options, alone or followed by a colon and text, nor a free answer of a request that takes one. The handler fills it from the request, because the language cannot read the text of an answer; a client never sends it."}
      - {name: at, type: Timestamp}
    outcomes:
      - name: unknown-option
        when: answer_offered == false
        error: sdc.daemon.UnknownOption
        summary: "The request was read from its case and the answer names none of its options: nothing was committed and the runtime was handed nothing; the request stays Open. Declared first because it reads the input only; the handler fills answer_offered false only where every other refusal below does not hold, so a client meets it after the request's state and the run's."
      - name: no-request
        unknown_instance: true
        error: sdc.daemon.NoSuchDecisionRequest
        summary: "No decision request has this id."
      - name: not-of-run
        when_subject:
          predicate: run_id != input.run_id
        error: sdc.daemon.DecisionNotOfRun
        summary: "The request belongs to another run than the one named."
      - name: withdrawn
        when_subject:
          predicate: state == Withdrawn
        error: sdc.daemon.DecisionWithdrawn
        summary: "The request was withdrawn (its run was cancelled or ended as orphaned, or the runtime withdrew it): it takes no answer. Checked before the run's own state, so the answer names the request and not the run: an answer to a request of a cancelled run is this refusal."
      - name: already-answered
        wrong_state: true
        error: sdc.daemon.DecisionAlreadyAnswered
        summary: "The request is already Answered. Checked before the run's own state: a second answer to the only open request of a run that has resumed or ended is this refusal and not RunNotWaiting."
      - name: no-run
        when_related: {via: input.run_id, exists: false}
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: run-not-waiting
        when_related: {via: input.run_id, predicate: state != WaitingOnDecision}
        error: sdc.daemon.RunNotWaiting
        summary: "The request is Open and its run is not WaitingOnDecision, so nothing is waiting for an answer. The daemon's own commands never leave that state (a cancel or an orphan end withdraws the run's Open requests in the same step, and a resume needs none Open): the guard holds for a record the daemon did not write."
      - name: answered
        moves: sdc.daemon.DecisionRequest.answer
        instance: request_id
        sets:
          answer: input.answer
          answered_by: input.answered_by
          principal: input.principal
          answered_at: input.at
        emits:
          - sdc.daemon.DecisionAnswered
        payload:
          sdc.daemon.DecisionAnswered:
            request_id: input.request_id
            run_id: input.run_id
            answered_by: input.answered_by
            principal: input.principal
        summary: "The request is Answered, with the label the client gave (answered_by) and the daemon's principal (principal); the runtime is given the principal and never the label, takes the answer up and reports ResumeRun."

  - name: sdc.daemon.RecordRunEvent
    naming:
      wire: record-run-event
      display: Record a run event
      summary: "A record of a run, from the runtime or written by the daemon itself (kind starts with `runbook.`; the commands that write one declare it, see EventKind): keep it, unchanged, under its sequence number (per run, only grows) and its position (per daemon, minted by the daemon, only grows over all runs). Every run of the daemon holds `runbook.submitted` at sequence 1 from its submit (SubmitRun), so the first record of the runtime is sequence 2, and the daemon's own events take positions too: the runtime's first record comes after the positions the submits used. The handler fills `position` and `session_id` (copied from the run). An event for a run that has ended, was cancelled or failed to start is refused."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        when_related: {via: input.run_id, exists: false}
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: run-closed
        when_related:
          via: input.run_id
          predicate: {any: [state == Ended, state == Cancelled, state == FailedToStart]}
        error: sdc.daemon.RunClosedToEvents
        summary: "The run is Ended, Cancelled or FailedToStart."
      - name: not-ascending
        when_related:
          entity: sdc.daemon.RunEvent
          where: {all: [run_id == input.run_id, sequence >= input.sequence]}
          exists: true
        error: sdc.daemon.SequenceNotAscending
        summary: "An event of the run has this number or a larger one."
      - name: position-not-ascending
        when_related:
          entity: sdc.daemon.RunEvent
          where: position >= input.position
          exists: true
        error: sdc.daemon.PositionNotAscending
        summary: "An event of the daemon has this position or a larger one."
      - name: recorded
        creates: sdc.daemon.RunEvent
        instance: event_id
        sets:
          run_id: input.run_id
          session_id: input.session_id
          sequence: input.sequence
          position: input.position
          kind: input.kind
          record: input.record
          at: input.at
        emits:
          - sdc.daemon.RunEventRecorded
        payload:
          sdc.daemon.RunEventRecorded:
            event_id: {generated: true}
            run_id: input.run_id
            sequence: input.sequence
            position: input.position
        summary: "The event is kept under its sequence number and its position."

  - name: sdc.daemon.EndRun
    naming:
      wire: end-run
      display: Report a run ended
      summary: "The runtime finished a Running run with an outcome. When the runtime fails after the run started, the daemon issues this command with the outcome `runtime-failure` and, just before, writes the run event `runbook.runtime-failed` (record: reason) as a RecordRunEvent of its own."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: outcome, type: sdc.daemon.RunOutcome}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: ended
        moves: sdc.daemon.Run.end
        instance: run_id
        sets:
          outcome: input.outcome
          ended_at: input.at
        emits:
          - sdc.daemon.RunEnded
        payload:
          sdc.daemon.RunEnded:
            run_id: input.run_id
            outcome: input.outcome
        summary: "The run is Ended with its outcome."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not Running."

  - name: sdc.daemon.EndOrphanedRun
    naming:
      wire: end-orphaned-run
      display: End a run whose runtime is gone
      summary: "At start the daemon asks the runtime about each run the record holds as Running or WaitingOnDecision; for a run the runtime no longer holds it issues this command. The run is Ended with the outcome `orphaned`, the cause. In the same step every Open decision request of the run moves to Withdrawn, as in CancelRun (the outcome's `affects` entry): no WithdrawDecision follows. The daemon also writes the run event `runbook.run-orphaned` (record: run_id, the state the run held, the reason) just before the run is Ended; the language cannot write a RunEvent from this command (see CancelRun), so the event is stated here. Issued by the daemon itself (actor DaemonProcess): it has no route in the HTTP contract."
    input:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-run
        unknown_instance: true
        error: sdc.daemon.NoSuchRun
        summary: "No run has this id."
      - name: orphaned
        moves: sdc.daemon.Run.orphan
        instance: run_id
        sets:
          outcome: orphaned
          ended_at: input.at
        affects:
          - entity: sdc.daemon.DecisionRequest
            where: run_id == input.run_id
            moves: sdc.daemon.DecisionRequest.withdraw
        emits:
          - sdc.daemon.RunOrphaned
        payload:
          sdc.daemon.RunOrphaned:
            run_id: input.run_id
        summary: "The run is Ended with the outcome orphaned and every Open decision request of it is Withdrawn. The outcome publishes RunOrphaned only."
      - name: wrong-state
        wrong_state: true
        error: sdc.daemon.RunStateConflict
        summary: "The run is not Running or WaitingOnDecision."

events:
  - name: sdc.daemon.RunOrphaned
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.SubmitReplayed
    fields:
      - {name: idempotency_key, type: Optional<sdc.daemon.IdempotencyKey>}
      - {name: run_id, type: sdc.daemon.RunId, summary: "The first run: the one that carries this idempotency key. The answer names it."}
  - name: sdc.daemon.DecisionRequestWithdrawn
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
  - name: sdc.daemon.DaemonStarted
    fields:
      - {name: daemon_id, type: sdc.daemon.DaemonId}
      - {name: confinement_floor, type: sdc.daemon.ConfinementLevel}
  - name: sdc.daemon.RunDelegated
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: route, type: sdc.daemon.RouteName, summary: "The route the run's model calls take, by name."}
      - {name: path, type: sdc.daemon.DelegationPath}
      - {name: protocol, type: sdc.daemon.RunbookId, summary: "The runbook the run runs: the named one, or delegation-free."}
  - name: sdc.daemon.RunSubmitted
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
  - name: sdc.daemon.RunResumed
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.DecisionRequested
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.DecisionAnswered
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: answered_by, type: sdc.decision.Principal}
      - {name: principal, type: sdc.decision.Principal}
  - name: sdc.daemon.RunEventRecorded
    fields:
      - {name: event_id, type: sdc.daemon.EventId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
  - name: sdc.daemon.RunCancelled
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.RunStarted
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.RunFailedToStart
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: reason, type: String}
  - name: sdc.daemon.RunWaiting
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
  - name: sdc.daemon.RunEnded
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: outcome, type: sdc.daemon.RunOutcome}
  - name: sdc.daemon.SessionOpened
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: client, type: sdc.daemon.ClientLabel}
  - name: sdc.daemon.SessionClosed
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}

views:
  - name: sdc.daemon.Sessions
    naming:
      wire: sessions
      display: Sessions
    source: sdc.daemon.Session
    consistency: read_your_writes
    fields:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: client, type: sdc.daemon.ClientLabel}
      - {name: state, type: sdc.daemon.Session.State}
      - {name: opened_at, type: Timestamp}
      - {name: closed_at, type: Optional<Timestamp>}

  - name: sdc.daemon.DaemonConfiguration
    naming:
      wire: configuration
      display: Daemon configuration
    source: sdc.daemon.Daemon
    consistency: read_your_writes
    fields:
      - {name: daemon_id, type: sdc.daemon.DaemonId}
      - {name: confinement_floor, type: sdc.daemon.ConfinementLevel}
      - {name: principal, type: sdc.decision.Principal}
      - {name: started_at, type: Timestamp}

  - name: sdc.daemon.Runbooks
    naming:
      wire: runbooks
      display: Runbooks
      summary: "The runbooks the daemon can start, by name and version, in order of name: GET /daemon/views/runbooks. A name in this view is one a SubmitRun accepts (its runbook_known fact is true). The view names runbooks only: no path of the host is in a row."
    source: sdc.daemon.Runbook
    consistency: read_your_writes
    order_by:
      - runbook_id asc
    fields:
      - {name: runbook_id, type: sdc.daemon.RunbookName}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: runtime, type: sdc.daemon.RuntimeKind}

  - name: sdc.daemon.Routes
    naming:
      wire: routes
      display: Model routes
      summary: "The model routes the daemon declares, in order of name: GET /daemon/views/routes (the MCP tool list_routes). Each row names the route, its gateway by name, the alias, the kind, the wires and the status the daemon last read from the gateway (`GET /ready`, `GET /v1/models`, and for the status `GET /v1/status`, else `GET /v1/models/{alias}/status` for a managed or a local route), read at most once every 15 seconds. A daemon whose file declares no route has no row. No address, token, token file or price is in a row."
    source: sdc.daemon.ModelRoute
    consistency: read_your_writes
    order_by:
      - route asc
    fields:
      - {name: route, type: sdc.daemon.RouteName}
      - {name: gateway, type: String}
      - {name: alias, type: String}
      - {name: kind, type: sdc.daemon.ModelRouteKind}
      - {name: wires, type: "List<String>"}
      - {name: status, type: sdc.daemon.RouteStatus}
      - {name: phase, type: Optional<String>}
      - {name: read_at, type: Timestamp}

  - name: sdc.daemon.ProductsOfRun
    naming:
      wire: products
      display: Products of a run
      summary: "The files a run wrote under its work/ directory, in one row: GET /daemon/views/products?run_id=... (the MCP tool list_products). A view has no outcome in the language, so the refusals are the daemon's {refused, message} answers: 404 `no such run` for a run id the daemon does not know, 403 `link` when the work/ directory itself is a link. No path of the host is in a row or a refusal."
    source: sdc.daemon.RunProducts
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter: run_id == param.run_id
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: files, type: "List<sdc.daemon.ProductFile>"}
      - {name: cut, type: Optional<String>}
      - {name: hidden, type: Integer}
      - {name: left_out, type: Integer}

  - name: sdc.daemon.CasesOfRun
    naming:
      wire: cases
      display: Cases of a run
      summary: "The case tree of a run, a row per case in the order the runtime's tree lists them: GET /daemon/views/cases?run_id=... A row names the case, its parent, its link name, its protocol, its state and its outcome; no path. A run of the stub runtime has no case. A view has no outcome in the language, so the refusal is the daemon's {refused, message} answer: 404 `no such run` for a run id the daemon does not know."
    source: sdc.daemon.RunCase
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter: run_id == param.run_id
    fields:
      - {name: case_id, type: String}
      - {name: parent, type: Optional<String>}
      - {name: name, type: Optional<String>}
      - {name: protocol, type: String}
      - {name: case_state, type: sdc.daemon.CaseState}
      - {name: outcome, type: Optional<String>}

  - name: sdc.daemon.ProductOfRun
    naming:
      wire: product
      display: One product of a run
      summary: "One file of a run's work/ directory, by its path as ProductsOfRun names it, in one row: GET /daemon/views/product?run_id=...&path=... (the MCP tool read_product). The refusals, each the daemon's {refused, message} answer naming the path as asked and holding no byte of a file and no path of the host: 400 `bad path` (empty, absolute, a NUL, a backslash or a `..` component), 404 `not served` (a name that starts with a dot), 404 `no such file`, 403 `link` (a link at any component of the path: no link is followed, whether it stays in the run or not), 403 `more than one link`, 415 `not a regular file` (a directory, a pipe, a socket or a device, never opened), 404 `no such run`."
    source: sdc.daemon.RunProduct
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: path, type: sdc.daemon.ProductPath}
    filter:
      all:
        - run_id == param.run_id
        - path == param.path
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: path, type: sdc.daemon.ProductPath}
      - {name: size, type: Integer}
      - {name: modified_at, type: Timestamp}
      - {name: kind, type: sdc.daemon.ProductKind}
      - {name: text, type: Optional<String>}
      - {name: shown, type: Integer}
      - {name: truncated, type: Boolean}
      - {name: limit, type: Integer}

  - name: sdc.daemon.DelegationResult
    naming:
      wire: delegation-result
      display: The result of a delegation
      summary: "What a delegation's run has come to, in one row: GET /daemon/views/delegation-result?run_id=... (the MCP tool delegation_result; the tool delegate answers the same row when the run ends within its wait). The run's state, and once it Ended its outcome, the text of its result.md (at most 1048576 bytes; the MCP tools hold the text to 40000 characters), its products, its route, path and protocol, the classifier's confidence (null for named and free), and the calls, tokens and cost the relay booked. A view has no outcome in the language, so the refusal is the daemon's {refused, message} answer: 404 `no such run` for a run id the daemon does not know, and 404 `not a delegation` for a run that no Delegate created."
    source: sdc.daemon.Delegation
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter: run_id == param.run_id
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: run_state, type: sdc.daemon.Run.State}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}
      - {name: route, type: sdc.daemon.RouteName}
      - {name: path, type: sdc.daemon.DelegationPath}
      - {name: protocol, type: sdc.daemon.RunbookId}
      - {name: confidence, type: Optional<Json>}
      - {name: result_text, type: Optional<String>}
      - {name: result_truncated, type: Boolean}
      - {name: result_limit, type: Integer}
      - {name: products, type: "List<String>"}
      - {name: calls, type: Integer}
      - {name: input_tokens, type: Integer}
      - {name: output_tokens, type: Integer}
      - {name: cost_micro_usd, type: Integer}
      - {name: cost_known, type: Boolean}

  - name: sdc.daemon.Runs
    naming:
      wire: runs
      display: Runs
      summary: "Every run. GET /daemon/views/runs is this view; /daemon/views/runs-of-session (session_id), /daemon/views/runs-in-state (state) and /daemon/views/runs-of-session-in-state (both) filter it."
    source: sdc.daemon.Run
    consistency: read_your_writes
    order_by:
      - submitted_at desc
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: state, type: sdc.daemon.Run.State}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>}
      - {name: model_route_alias, type: Optional<String>}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}

  - name: sdc.daemon.RunsOfSession
    naming:
      wire: runs-of-session
      display: Runs of a session
    source: sdc.daemon.Run
    consistency: read_your_writes
    params:
      - {name: session_id, type: sdc.daemon.SessionId}
    filter: session_id == param.session_id
    order_by:
      - submitted_at desc
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: state, type: sdc.daemon.Run.State}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>}
      - {name: model_route_alias, type: Optional<String>}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}

  - name: sdc.daemon.RunsInState
    naming:
      wire: runs-in-state
      display: Runs in a state
    source: sdc.daemon.Run
    consistency: read_your_writes
    params:
      - {name: state, type: sdc.daemon.Run.State}
    filter: state == param.state
    order_by:
      - submitted_at desc
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: state, type: sdc.daemon.Run.State}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>}
      - {name: model_route_alias, type: Optional<String>}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}

  - name: sdc.daemon.RunsOfSessionInState
    naming:
      wire: runs-of-session-in-state
      display: Runs of a session in a state
    source: sdc.daemon.Run
    consistency: read_your_writes
