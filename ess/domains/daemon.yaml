      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}

  - name: sdc.daemon.EventsOfDaemonAfter
    naming:
      wire: daemon-events
      display: Events of the daemon after a position
      summary: "The events of every run of the daemon with a position above `after_position`, in position order: the page the daemon-wide event stream serves (GET /daemon/views/daemon-events with `Accept: text/event-stream`, same SSE rules as EventsAfter). Outside the language: SSE itself."
    source: sdc.daemon.RunEvent
