      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>}
      - {name: model_route_alias, type: Optional<String>}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}

  - name: sdc.daemon.RunDetail
    naming:
      wire: run
      display: One run
      summary: "One run with every field it was submitted with. The run's open decision requests are the view OpenDecisionsOfRun: GET /daemon/views/run and GET /daemon/views/open-decisions, each with run_id, answer the two. A view has one source entity, so the language cannot join them in one row."
    source: sdc.daemon.Run
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter: run_id == param.run_id
    fields:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: runbook_id, type: sdc.daemon.RunbookId}
      - {name: runbook_version, type: Optional<sdc.daemon.RunbookVersion>}
      - {name: intake, type: String, summary: "The intake document itself, inline in the submit: text, at most 1 MiB."}
      - {name: context_path, type: Optional<sdc.daemon.ContextPath>}
      - {name: settings, type: sdc.daemon.RunSettings}
      - {name: state, type: sdc.daemon.Run.State}
      - {name: confinement, type: sdc.daemon.ConfinementLevel}
      - {name: confinement_source, type: Optional<sdc.daemon.ConfinementSource>}
      - {name: autonomy, type: Optional<sdc.decision.AutonomyLevel>}
      - {name: decider, type: Optional<sdc.daemon.DeciderKind>}
      - {name: model_route, type: Optional<sdc.daemon.RouteName>}
      - {name: model_route_alias, type: Optional<String>}
      - {name: model_route_source, type: Optional<sdc.daemon.RouteSource>}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: submitted_at, type: Timestamp}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: outcome, type: Optional<sdc.daemon.RunOutcome>}
      - {name: failure, type: Optional<String>}
      - {name: step_in_flight, type: Optional<sdc.daemon.StepInFlight>}
      - {name: model_routes, type: Optional<sdc.daemon.RoleRoutes>}

  - name: sdc.daemon.OpenDecisionsOfRun
    naming:
      wire: open-decisions
      display: Open decision requests of a run
    source: sdc.daemon.DecisionRequest
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter:
      all:
        - run_id == param.run_id
        - state == Open
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: case_id, type: String, summary: "The case the runtime opened the request for: which step asks."}
      - {name: action, type: String, summary: "The action of the case that asks."}
      - {name: capability, type: String, summary: "The capability the answer is for."}
      - {name: question, type: String}
      - {name: options, type: "List<sdc.decision.DecisionOption>"}
      - {name: artifact, type: Optional<sdc.daemon.DecisionArtifact>, summary: "The recommendation, its grounds and the free answer of a request read from its case; absent for a request the runtime built itself."}
      - {name: opened_at, type: Timestamp}

  - name: sdc.daemon.DecisionsOfRun
    naming:
      wire: decisions
      display: Decision requests of a run, answered or not
    source: sdc.daemon.DecisionRequest
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
    filter: run_id == param.run_id
    fields:
      - {name: request_id, type: sdc.daemon.DecisionRequestId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: state, type: sdc.daemon.DecisionRequest.State}
      - {name: question, type: String}
      - {name: options, type: "List<sdc.decision.DecisionOption>"}
      - {name: artifact, type: Optional<sdc.daemon.DecisionArtifact>, summary: "As in OpenDecisionsOfRun."}
      - {name: opened_at, type: Timestamp}
      - {name: answer, type: Optional<String>}
      - {name: answered_by, type: Optional<sdc.decision.Principal>}
      - {name: principal, type: Optional<sdc.decision.Principal>}
      - {name: answered_at, type: Optional<Timestamp>}

  - name: sdc.daemon.EventsAfter
    naming:
      wire: events
      display: Events of a run after a position
      summary: "The events of one run with a position above `after_position`, in position order: the page the run's event stream serves. SSE is outside the language: ESS 0.96.0 has no construct for a server-sent event stream or a subscription (it has `asyncapi` for the events components publish, which describes a broker and not an HTTP stream), so the stream is not declared; the views are the page a stream serves, and the HTTP binding (the three events views below, served with `text/event-stream`) is written and tested in the story daemon-skeleton-on-a-runtime-trait. GET /daemon/views/events?run_id=... with `Accept: text/event-stream` streams this view: every row with position > after_position, each as one SSE event whose `id` is the row's position, then each new event as it is recorded; a reconnect sends `Last-Event-ID: n`, a position, and the stream continues with after_position = n; after_position = 0 is the whole run. Without that header the same path answers the rows as a JSON page."
    source: sdc.daemon.RunEvent
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: after_position, type: Integer}
    filter:
      all:
        - run_id == param.run_id
        - position > param.after_position
    order_by:
      - position
    fields:
      - {name: event_id, type: sdc.daemon.EventId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}

  - name: sdc.daemon.EventsOfSessionAfter
    naming:
      wire: session-events
      display: Events of a session after a position
      summary: "The events of every run of one session with a position above `after_position`, in position order: the page the session's event stream serves (GET /daemon/views/session-events?session_id=... with `Accept: text/event-stream`, same SSE rules as EventsAfter; the SSE id is the position, so the interleaving of the session's runs is the daemon's order). Outside the language: SSE itself."
    source: sdc.daemon.RunEvent
    consistency: read_your_writes
    params:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: after_position, type: Integer}
    filter:
      all:
        - session_id == param.session_id
        - position > param.after_position
    order_by:
      - position
    fields:
      - {name: event_id, type: sdc.daemon.EventId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}

  - name: sdc.daemon.EventsOfDaemonAfter
    naming:
      wire: daemon-events
      display: Events of the daemon after a position
      summary: "The events of every run of the daemon with a position above `after_position`, in position order: the page the daemon-wide event stream serves (GET /daemon/views/daemon-events with `Accept: text/event-stream`, same SSE rules as EventsAfter). Outside the language: SSE itself."
    source: sdc.daemon.RunEvent
    consistency: read_your_writes
    params:
      - {name: after_position, type: Integer}
    filter: position > param.after_position
    order_by:
      - position
    fields:
      - {name: event_id, type: sdc.daemon.EventId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}
