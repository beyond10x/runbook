  - name: sdc.daemon.EventsAfter
    naming:
      wire: events
      display: Events of a run after a position
      summary: "The events of one run with a position above `after_position`, in position order: the page the run's event stream serves. SSE is outside the language: ESS 0.96.0 has no construct for a server-sent event stream or a subscription (it has `asyncapi` for the events components publish, which describes a broker and not an HTTP stream), so the stream is not declared; the views are the page a stream serves, and the HTTP binding (the three events views below, served with `text/event-stream`) is written and tested in the story daemon-skeleton-on-a-runtime-trait. GET /daemon/views/events?run_id=... with `Accept: text/event-stream` streams this view: every row with position > after_position, each as one SSE event whose `id` is the row's position, then each new event as it is recorded; a reconnect sends `Last-Event-ID: n`, a position, and the stream continues with after_position = n; after_position = 0 is the whole run. Without that header the same path answers the rows as a JSON page."
    source: sdc.daemon.RunEvent
    consistency: read_your_writes
    params:
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: after_position, type: Integer}
    filter:
      all:
        - run_id == param.run_id
        - position > param.after_position
    order_by:
      - position
    fields:
      - {name: event_id, type: sdc.daemon.EventId}
      - {name: run_id, type: sdc.daemon.RunId}
      - {name: session_id, type: Optional<sdc.daemon.SessionId>}
      - {name: sequence, type: Integer}
      - {name: position, type: Integer}
      - {name: kind, type: sdc.daemon.EventKind}
      - {name: record, type: Json}
      - {name: at, type: Timestamp}

  - name: sdc.daemon.EventsOfSessionAfter
    naming:
      wire: session-events
      display: Events of a session after a position
      summary: "The events of every run of one session with a position above `after_position`, in position order: the page the session's event stream serves (GET /daemon/views/session-events?session_id=... with `Accept: text/event-stream`, same SSE rules as EventsAfter; the SSE id is the position, so the interleaving of the session's runs is the daemon's order). Outside the language: SSE itself."
    source: sdc.daemon.RunEvent
    consistency: read_your_writes
    params:
      - {name: session_id, type: sdc.daemon.SessionId}
      - {name: after_position, type: Integer}
    filter:
