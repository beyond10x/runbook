  - name: sdc.daemon.RunDetail
    naming:
      wire: run
      display: One run
      summary: "One run with every field it was submitted with, and for a run a Delegate created the path it took, the protocol it runs and the classifier's confidence (the MCP tool read_run answers this row). The run's open decision requests are the view OpenDecisionsOfRun: GET /daemon/views/run and GET /daemon/views/open-decisions, each with run_id, answer the two. A view has one source entity, so the language cannot join them in one row."
