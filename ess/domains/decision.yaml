    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}

views:
  - name: sdc.decision.OpenDecisionsForPrincipal
    naming:
      wire: open-for-principal
      display: Open decisions for a principal
    source: sdc.decision.DecisionRequest
    consistency: read_your_writes
    params:
      - {name: principal, type: sdc.decision.Principal}
    filter:
      all:
        - {any: [state == Open, state == Escalated]}
        - addressed_to == param.principal
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: case_id, type: sdc.decision.CaseId}
      - {name: question, type: String}
      - {name: subject_artifact, type: sdc.decision.ArtifactId}
      - {name: subject_revision, type: sdc.decision.Revision}
      - {name: recommended_option, type: Optional<sdc.decision.OptionLetter>}
      - {name: recommended_answer, type: Optional<String>}
      - {name: recommendation_strength, type: sdc.decision.Strength}
      - {name: no_recommendation_reason, type: Optional<String>}
      - {name: opened_at, type: Timestamp}
      - {name: expires_at, type: Optional<Timestamp>}

  - name: sdc.decision.ArtifactDecisionHistory
    naming:
      wire: artifact-history
      display: Decision history of an artifact
    source: sdc.decision.DecisionRequest
    consistency: read_your_writes
    params:
      - {name: artifact, type: sdc.decision.ArtifactId}
    filter: subject_artifact == param.artifact
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: subject_revision, type: sdc.decision.Revision}
      - {name: question, type: String}
      - {name: state, type: sdc.decision.DecisionRequest.State}
      - {name: decided_option, type: Optional<sdc.decision.OptionLetter>}
      - {name: decided_answer, type: Optional<String>}
      - {name: decided_by, type: Optional<sdc.decision.Principal>}
      - {name: decided_at, type: Optional<Timestamp>}
      - {name: produced_record, type: Optional<sdc.decision.ProducedRecord>}
      - {name: supersedes, type: Optional<sdc.decision.DecisionRequestId>}
      - {name: superseded_by, type: Optional<sdc.decision.DecisionRequestId>}

  - name: sdc.decision.DecisionRequests
    naming:
      wire: requests
      display: Decision requests
    source: sdc.decision.DecisionRequest
    consistency: read_your_writes
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: state, type: sdc.decision.DecisionRequest.State}
      - {name: case_id, type: sdc.decision.CaseId}
      - {name: question_key, type: String}
      - {name: unblocks, type: sdc.decision.Unblocks}
      - {name: subject_artifact, type: sdc.decision.ArtifactId}
      - {name: subject_revision, type: sdc.decision.Revision}
      - {name: subject_path, type: Optional<String>}
      - {name: question, type: String}
      - {name: options, type: "List<sdc.decision.DecisionOption>"}
      - {name: autonomy_level, type: sdc.decision.AutonomyLevel}
      - {name: decision_class, type: sdc.decision.DecisionClass}
      - {name: holder, type: sdc.decision.Holder}
      - {name: eligible, type: "List<sdc.decision.Principal>"}
      - {name: addressed_to, type: sdc.decision.Principal}
      - {name: opened_at, type: Timestamp}
      - {name: expires_at, type: Optional<Timestamp>}
      - {name: supersedes, type: Optional<sdc.decision.DecisionRequestId>}
      - {name: recommended_option, type: Optional<sdc.decision.OptionLetter>}
      - {name: recommended_answer, type: Optional<String>}
      - {name: recommendation_strength, type: sdc.decision.Strength}
      - {name: default_on_silence, type: Boolean}
      - {name: grounds, type: "List<sdc.decision.Ground>"}
      - {name: recommended_by, type: Optional<sdc.decision.ProposerKind>}
      - {name: grounding_report, type: Optional<String>}
      - {name: no_recommendation_reason, type: Optional<String>}
      - {name: escalated_to, type: Optional<sdc.decision.Principal>}
      - {name: escalation_reason, type: Optional<String>}
      - {name: decided_option, type: Optional<sdc.decision.OptionLetter>}
      - {name: decided_answer, type: Optional<String>}
      - {name: decided_by, type: Optional<sdc.decision.Principal>}
      - {name: decided_by_kind, type: Optional<sdc.decision.PrincipalKind>}
      - {name: decided_at, type: Optional<Timestamp>}
      - {name: decision_reasons, type: "List<String>"}
      - {name: produced_record, type: Optional<sdc.decision.ProducedRecord>}
      - {name: superseded_by, type: Optional<sdc.decision.DecisionRequestId>}
      - {name: superseded_reason, type: Optional<String>}
