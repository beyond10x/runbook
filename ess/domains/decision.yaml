  - name: sdc.decision.DecisionRequested
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: case_id, type: sdc.decision.CaseId}
      - {name: subject_artifact, type: sdc.decision.ArtifactId}
      - {name: subject_revision, type: sdc.decision.Revision}
  - name: sdc.decision.RecommendationRecorded
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: recommended_option, type: Optional<sdc.decision.OptionLetter>}
      - {name: recommended_answer, type: Optional<String>}
      - {name: strength, type: sdc.decision.Strength}
  - name: sdc.decision.RecommendationWithheld
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: reason, type: String}
  - name: sdc.decision.DecisionTaken
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: option, type: Optional<sdc.decision.OptionLetter>}
      - {name: answer, type: Optional<String>}
      - {name: principal, type: sdc.decision.Principal}
  - name: sdc.decision.RecommendationTaken
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: principal, type: sdc.decision.Principal}
  - name: sdc.decision.ProducedRecordRecorded
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: produced, type: sdc.decision.ProducedRecord}
  - name: sdc.decision.DecisionEscalated
    fields:
      - {name: request_id, type: sdc.decision.DecisionRequestId}
      - {name: escalate_to, type: sdc.decision.Principal}
