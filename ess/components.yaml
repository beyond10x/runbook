components:
  - component: runbookd
    summary: "The Runbook daemon: keeps runs, sessions and decision requests and serves them over HTTP, with three event streams (per run, per session, per daemon) paged by position; the streams are server-sent events, outside the language. The reports of the runtime (StartRun, FailRunStart, WaitOnDecision, RequestDecision, WithdrawDecision, ResumeRun, RecordRunEvent, EndRun) and StartDaemon are issued inside the process and are not accepted from the network."
    owns:
      domains:
        - sdc.daemon
    accepts:
      commands:
        - sdc.daemon.OpenSession
        - sdc.daemon.CloseSession
        - sdc.daemon.SubmitRun
        - sdc.daemon.CancelRun
        - sdc.daemon.AnswerDecision
        - sdc.daemon.Delegate
    reached_by: network
