[package]
name = "sdc-watch"
version = "0.12.0"
edition = "2021"
publish = false

[[bin]]
name = "sdc-watch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inotify = { version = "0.11", default-features = false }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false }
similar = "2.7"

[workspace]
