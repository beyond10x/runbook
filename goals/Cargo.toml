[package]
name = "sdc-goals"
version = "0.9.3"
edition = "2021"
publish = false

[[bin]]
name = "sdc-goals"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"

[workspace]
