[package]
name = "runbook"
version = "0.5.0"
edition = "2021"
publish = false

[[bin]]
name = "runbook"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["v7", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
sdc_tools = { path = "../driver", package = "sdc-tools" }
b10x-loom-tree ={ git = "https://github.com/beyond10x/loom", rev = "70b0e6e0f41c15cbb91a1c6fe0b548aafe86ef6d" }
b10x-loom-runlog = { git = "https://github.com/beyond10x/loom", rev = "70b0e6e0f41c15cbb91a1c6fe0b548aafe86ef6d" }
b10x-loom-protocols = { git = "https://github.com/beyond10x/loom", rev = "70b0e6e0f41c15cbb91a1c6fe0b548aafe86ef6d" }
b10x-canon = { git = "https://github.com/beyond10x/canon", tag = "0.11.0" }

[workspace]
