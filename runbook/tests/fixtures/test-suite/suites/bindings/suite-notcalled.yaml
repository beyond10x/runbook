format: loom.bindings/1
protocol: suite-notcalled@1
program_root: bindings
artifacts:
  spec: spec.txt
  findings: findings.txt
actions:
  - action: spec.author
    executor:
      kind: program
      argv: [tools/nc-author.sh]
    exits: {error: [75, 126, 127], not_called: [79]}
    budget: {max_runs: 2}
    retry_when:
      spec_check: [refused]
    evidence:
      - kind: spec_done
        subject: spec
        producer: nc-author
        from: exit
        results: {"0": ok, "*": failed}
  - action: spec.check
    executor:
      kind: program
      argv: [tools/nc-check.sh]
    exits: {error: [75, 126, 127]}
    evidence:
      - kind: spec_check
        subject: spec
        producer: nc-check
        from: exit
        results: {"0": ok, "*": refused}
  - action: amend.upstream
    executor:
      kind: program
      argv: [tools/nc-amend.sh]
    exits: {error: [75, 126, 127]}
    handoff: "decide the open finding, then run again"
    handoff_when: [tools/nc-wait.sh]
    evidence:
      - kind: spec_check
        subject: spec
        producer: nc-amend
        from: exit
        results: {"0": ok, "*": refused}
