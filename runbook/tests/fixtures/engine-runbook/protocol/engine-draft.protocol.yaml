format: protocol/1
protocol:
  id: engine.draft
  revision: 1
  description: >-
    A draft a writer program writes and a reviewer reviews. A check reads the draft; the reviewer approves a valid draft or rejects it with reasons, and a rejected draft is written again. The case passes once the draft is approved.
artifacts:
  idea: {}
  draft: {}
evidence_kinds:
  draft_check: {}
  draft_review: {}
claims:
  draft.valid:
    true_when:
      evidence: {kind: draft_check, subject: draft, result: valid}
  draft.rejected:
    true_when:
      evidence: {kind: draft_review, subject: draft, result: rejected}
  draft.approved:
    true_when:
      evidence: {kind: draft_review, subject: draft, result: approved}
actions:
  draft.write:
    effect: write
    precondition:
      any:
        - {claim: draft.valid, is: false}
        - {claim: draft.rejected}
  draft.check:
    effect: read
    may_produce:
      - evidence: draft_check
  draft.review:
    effect: write
    precondition: {claim: draft.valid}
    may_produce:
      - evidence: draft_review
outcomes:
  passed:
    requires: {claim: draft.approved}
