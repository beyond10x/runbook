format = "runbook.loom-run-settings/1"
run = "r1"
autonomy = "A5"
adapter = "metaharness"
max_llm_calls = 100
max_wall_seconds = 120
in_process = true
confinement = "local"
cap_micro_usd = 1000000

[models.writer]
model = "model-w"
max_turns = 3
max_budget_usd = 0.5

[models.review]
model = "model-r"

[efforts.review]
effort = "low"

[review]
adapter = "claude-cli"

[decider]
kind = "scripted"
max_call_micro_usd = 0

[[decider.answers]]
approve = true
cost_micro_usd = 0
