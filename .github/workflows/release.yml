name: Release archives

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '**/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    name: Archive ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'push' && '["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]' || '["x86_64-unknown-linux-musl"]') }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Check the rustc pin
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          used=$(sed -n 's/^ *toolchain: *//p' .github/workflows/release.yml | tr -d "\"'" | sort -u)
          test -n "$pin" && test "$used" = "$pin" || { echo "the workflow installs rustc '$used' and rust-toolchain.toml pins '$pin'"; exit 1; }
      - name: The version of runbook/Cargo.toml, and the tag of a tag push
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' runbook/Cargo.toml | head -1)
          test -n "$version" || { echo "runbook/Cargo.toml names no version"; exit 1; }
          if [ "$EVENT" = push ] && [ "$TAG" != "$version" ]; then
            echo "the tag $TAG is not the version $version of runbook/Cargo.toml"
            exit 1
          fi
          name="runbook-$version-$TARGET"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - name: The C compiler of musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build for gnu and lay out the prefix with scripts/install.sh
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX"
          scripts/install.sh --prefix "$PREFIX"
      - name: Build for musl, then lay out the prefix with scripts/install.sh --from-built release
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          for crate in watch driver runbook; do
            cargo build --locked --release --target "$TARGET" --manifest-path "$crate/Cargo.toml" --bins
            mkdir -p "$crate/target/release"
            find "$crate/target/$TARGET/release" -maxdepth 1 -type f -perm -u+x -exec cp {} "$crate/target/release/" \;
          done
          mkdir -p "$PREFIX"
          scripts/install.sh --prefix "$PREFIX" --from-built release
      - name: runbook names the version
        run: |
          set -euo pipefail
          said=$("$PREFIX/bin/runbook" --version)
          echo "$said"
          case $said in "runbook $VERSION ("*) ;; *) echo "runbook --version says '$said', not $VERSION"; exit 1 ;; esac
      - name: The gnu runbook links no mimalloc
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          if nm "$PREFIX/bin/runbook" | grep -q -w mi_malloc; then echo "the gnu runbook links mimalloc"; exit 1; fi
      - name: The musl runbook allocates through mimalloc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          nm "$PREFIX/bin/runbook" | grep -q -w mi_malloc || { echo "the musl runbook has no mi_malloc: the feature mimalloc is off"; exit 1; }
      - name: Each program is static and runs in a plain alpine container
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          fail=0
          for f in "$PREFIX/bin/runbook" "$PREFIX"/libexec/runbook/*; do
            kind=$(file -b "$f")
            libs=$(ldd "$f" 2>&1 || true)
            case $kind in *'statically linked'* | *'static-pie linked'*) ;; *) echo "FAIL $f: file says $kind"; fail=1 ;; esac
            case $libs in *'not a dynamic executable'* | *'statically linked'*) ;; *) echo "FAIL $f: ldd says $libs"; fail=1 ;; esac
          done
          test "$fail" = 0
          docker run --rm --network none -v "$PREFIX:/opt/runbook:ro" alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f sh -c '
            fail=0
            for f in /opt/runbook/bin/runbook /opt/runbook/libexec/runbook/*; do
              out=$(cd /tmp && env -i PATH=/usr/bin:/bin timeout 20 "$f" --version </dev/null 2>&1) && code=0 || code=$?
              case $code:$out in
              "0:${f##*/} "*) echo "ok $f --version: $out" ;;
              *) echo "FAIL $f --version: exit $code: $out"; fail=1 ;;
              esac
            done
            exit $fail'
      - name: Pack the prefix with its sha256 file
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" && sha256sum --check "$NAME.tar.gz.sha256")
          tar -tzf "dist/$NAME.tar.gz" | grep -qx "$NAME/bin/runbook"
          tar -tzf "dist/$NAME.tar.gz" | grep -qx "$NAME/share/runbook/MANIFEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push'
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload the archives to the release
    if: github.event_name == 'push'
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives against their sha256 files
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          test "$(ls *.tar.gz | wc -l)" = 2
          for f in *.tar.gz; do sha256sum --check "$f.sha256"; done
      - name: Upload to the release of the tag, made with its notes when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notes="docs/releases/$TAG.md"
            test -s "$notes" || { echo "no $notes: the release notes of $TAG are missing"; exit 1; }
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" --verify-tag
          fi
