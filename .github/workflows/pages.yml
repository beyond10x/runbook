name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: List the changed files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/changed-files"
          : > "$out"
          case "$EVENT" in
            pull_request) git diff --name-only HEAD^1 HEAD > "$out" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                && git fetch --no-tags --depth=1 origin "$BEFORE" \
                && git diff --name-only "$BEFORE" HEAD > "$out"; then :; else : > "$out"; fi
              ;;
          esac
          echo "CHANGED_FILES=$out" >> "$GITHUB_ENV"
          cat "$out"
      - name: Classify the changed files
        id: changes
        run: |
          set -euo pipefail
          planning=0 site=0 code=0
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in
              '') ;;
              .engineering/*) planning=1 ;;
              website/* | experiments/* | docs/releases/* | docs/progress.json | docs/img/progress.svg | docs/check-output.txt | CHANGELOG.md) site=1 ;;
              instructions/* | bindings/* | cycles/* | views/*) code=1 ;;
              *.md) planning=1 ;;
              *) code=1 ;;
            esac
          done < "${CHANGED_FILES:-/dev/stdin}"
          if [ "$code" = 1 ] || [ "$planning$site" = 00 ]; then class=code
          elif [ "$site" = 1 ]; then class=docs-site
          else class=planning
          fi
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "change class: $class"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.changes.outputs.class != 'planning'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.changes.outputs.class != 'planning'
        with:
          toolchain: 1.99.1
      - name: Check the rustc pin
        if: steps.changes.outputs.class != 'planning'
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          used=$(sed -n 's/^ *toolchain: *//p' .github/workflows/pages.yml | tr -d "\"'" | sort -u)
          test -n "$pin" && test "$used" = "$pin" || { echo "the workflow installs rustc '$used' and rust-toolchain.toml pins '$pin'"; exit 1; }
      - name: Check the site's protocol data is current
        if: steps.changes.outputs.class != 'planning'
        env:
          CLASS: ${{ steps.changes.outputs.class }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path driver/Cargo.toml --bin sdc-protocol-site
          if [ "$CLASS" = code ]; then cargo test --locked --manifest-path driver/Cargo.toml --bin sdc-protocol-site; fi
          driver/target/debug/sdc-protocol-site check --root .
      - name: Build the Docusaurus site
        if: steps.changes.outputs.class != 'planning'
        run: |
          npm --prefix website ci
          npm --prefix website run build
      - name: Refuse a site that holds fixture data
        if: steps.changes.outputs.class != 'planning'
        run: |
          set -euo pipefail
          test -z "${SDC_SITE_FIXTURES:-}"
          if grep -rlq --include='*.html' 'data-sdc-fixture-build' website/build; then echo "website/build holds a fixture build"; exit 1; fi
          if grep -rlq -e 'fixture-free-agent' -e 'fixture: three releases' website/build; then echo "website/build holds fixture data"; exit 1; fi
      - name: Build the fixture site the tests use, outside the deployed directory
        if: steps.changes.outputs.class != 'planning'
        run: cd website && SDC_SITE_FIXTURES=tests/fixtures/ledger npx docusaurus build --out-dir build-fixture
      - name: Install the test browser
        if: steps.changes.outputs.class != 'planning'
        run: cd website && npx playwright install --with-deps chromium
      - name: Smoke test every page, both themes, two widths, axe and internal links
        if: steps.changes.outputs.class != 'planning'
        timeout-minutes: 2
        run: cd website && npx playwright test --workers=4
      - name: Bind the built site to its source commit
        if: steps.changes.outputs.class != 'planning'
        run: driver/target/debug/sdc-protocol-site site-manifest --out website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: steps.changes.outputs.class != 'planning' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
