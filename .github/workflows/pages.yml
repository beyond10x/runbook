name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97'
      - name: Check the site's protocol data is current
        run: |
          cargo build --locked --manifest-path driver/Cargo.toml --bin sdc-protocol-site
          cargo test --locked --manifest-path driver/Cargo.toml --bin sdc-protocol-site
          driver/target/debug/sdc-protocol-site check --root .
      - name: Build the Docusaurus site and its fixture build
        run: |
          npm --prefix website ci
          npm --prefix website run build
          cd website && SDC_SITE_FIXTURES=tests/fixtures/ledger npx docusaurus build --out-dir build-fixture
      - name: Smoke test every page, both themes, two widths, axe and internal links
        run: |
          cd website
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
      - name: Bind the built site to its source commit
        run: driver/target/debug/sdc-protocol-site site-manifest --out website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
