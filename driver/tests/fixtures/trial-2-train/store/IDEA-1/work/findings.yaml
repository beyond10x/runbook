findings:
- id: f1
  type: ambiguity
  cites:
  - q1
  - r2
  says: The answer to q1 gives each user their own lists, but it does not say whether the partner can see or edit them.
  options:
  - Each list is private to its owner
  - Each list can be shared with the partner
  - Both users see all lists
  default: Both users see all lists
  scope_changing: true
  stage: requirements
  raised_by: llm:requirements.normalise
  status: resolved
  scope: person
  basis: the raiser marks it scope-changing
  decision: Each list can be shared with the partner
  decided_by: human
  resolution:
    amends:
    - q7
    - r2
    reason: a person decided
    default_taken: false
- id: f2
  type: missing_decision
  cites:
