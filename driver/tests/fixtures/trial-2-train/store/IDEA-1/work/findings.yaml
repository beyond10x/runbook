  says: The requirements do not say which signed-in user a session acts as, so a list's owner is not tied to the sign-in.
  options:
  - The sign-in username is the owner's user id
  - Owners get a separate user id issued at sign-in
  default: The sign-in username is the owner's user id
  scope_changing: false
  stage: spec
  raised_by: llm:spec.author
  status: resolved
  scope: agent
  basis: 'changes no scope: it adds a decision and overturns no person''s decision'
  decision: The sign-in username is the owner's user id
