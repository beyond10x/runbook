- id: f9
  type: missing_decision
  cites:
  - r1
  - r2
  says: Sign-in's rejected and signed-in outcomes name a signed-in user, but no input says how a signed-in state is held (for example a session token or a cookie), so the daemon only reports the SignedIn event.
  options:
  - Response reports the SignedIn event only, with no session state
  - Server sets a session cookie on sign-in
  - Server returns a bearer token in the response body
  default: Response reports the SignedIn event only, with no session state
  scope_changing: true
  stage: story
  raised_by: llm:change.implement
  status: resolved
  scope: person
  basis: the raiser marks it scope-changing
  decision: Server sets a session cookie on sign-in
  decided_by: human
  resolution:
    amends:
    - q15
    - r1
    - r2
    reason: a person decided
    default_taken: false
