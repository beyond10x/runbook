  - Open, in progress or done
  - Free-text tag chosen by the user
  default: Open or done
  scope_changing: false
  stage: requirements
  raised_by: llm:requirements.normalise
  status: resolved
  scope: agent
  basis: 'changes no scope: it adds a decision and overturns no person''s decision'
  decision: Open or done
