- id: f11
  type: missing_decision
  cites:
  - r1
  - q15
  says: Sign-in now sets a session cookie, but no input says where the session is held or how a later request checks it, and the daemon keeps no state between requests.
  options:
  - The token is issued and held nowhere; no command checks it yet
  - Each instance holds issued tokens in memory and checks them
  - The token is signed with a secret from the accounts file, so any instance can check it
  default: The token is issued and held nowhere; no command checks it yet
  scope_changing: false
  stage: story
  raised_by: llm:change.implement
  status: resolved
  scope: agent
  basis: 'changes no scope: it adds a decision and overturns no person''s decision'
  decision: The token is issued and held nowhere; no command checks it yet
  decided_by: agent
  resolution:
