    reason: 'changes no scope: it adds a decision and overturns no person''s decision'
    default_taken: true
- id: f12
  type: missing_decision
  cites:
  - r1
  - context.deployment
  says: The session cookie is marked Secure, but the daemon serves plain HTTP on 0.0.0.0 and no input says how TLS is provided for the hosted deployment, so browsers may refuse to store the cookie.
  options:
  - Keep Secure and put the daemon behind a TLS-terminating proxy (current build)
  - Drop the Secure attribute and serve plain HTTP
  - The daemon serves TLS itself
  default: Keep Secure and put the daemon behind a TLS-terminating proxy (current build)
  scope_changing: false
  stage: story
  raised_by: llm:change.implement
  status: resolved
  scope: agent
  basis: 'changes no scope: it adds a decision and overturns no person''s decision'
  decision: Keep Secure and put the daemon behind a TLS-terminating proxy (current build)
  decided_by: agent
  resolution:
