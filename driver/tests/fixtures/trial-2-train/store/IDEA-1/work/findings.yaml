- id: p-offline-hosted-context.deployment
  type: contradiction
  raised_by: program:offline-hosted
  cites:
  - r4
  - r5
  - context.deployment
  says: 'r4, r5 against context.deployment: a requirement works without a network, while the context runs the product on a server'
  options:
  - works offline, as the requirement says
  - hosted, as the context says
  rule: offline-hosted
  sides:
  - - r4
    - r5
  - - context.deployment
  stage: context
  status: resolved
  scope: agent
  basis: both sides are an agent's defaults and no scope-changing question is behind them
  default: works offline, as the requirement says
  decision: works offline, as the requirement says
  decided_by: agent
  resolution:
    amends:
    - q11
    - context.deployment
    - r4
    - r5
    reason: both sides are an agent's defaults and no scope-changing question is behind them
    default_taken: true
