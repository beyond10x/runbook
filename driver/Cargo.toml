[package]
name = "sdc-drive"
version = "0.1.4"
edition = "2021"
publish = false

[[bin]]
name = "sdc-drive"
path = "src/main.rs"

[[bin]]
name = "sdc-findings"
path = "src/bin/sdc-findings.rs"

[[bin]]
name = "sdc-finding-kpis"
path = "src/bin/sdc-finding-kpis.rs"

[[bin]]
name = "sdc-decision-request"
path = "src/bin/sdc-decision-request.rs"

[[bin]]
name = "sdc-run-compare"
path = "src/bin/sdc-run-compare.rs"

[[bin]]
name = "sdc-reply"
path = "src/bin/sdc-reply.rs"

[[bin]]
name = "sdc-bugfix"
path = "src/bin/sdc-bugfix.rs"

[[bin]]
name = "sdc-check-routes"
path = "src/bin/sdc-check-routes.rs"

[[bin]]
name = "sdc-unstick"
path = "src/bin/sdc-unstick.rs"

[[bin]]
name = "sdc-run-metrics"
path = "src/bin/sdc-run-metrics.rs"

[[bin]]
name = "sdc-experiment"
path = "src/bin/sdc-experiment.rs"

[[bin]]
name = "sdc-conform"
path = "src/bin/sdc-conform.rs"

[[bin]]
name = "sdc-conform-adapter"
path = "src/bin/sdc-conform-adapter.rs"

[[example]]
name = "conformance-stub-product"
path = "examples/conformance-stub-product.rs"

[[bin]]
name = "sdc-protocol-site"
path = "src/bin/sdc-protocol-site.rs"

[[bin]]
name = "sdc-replay"
path = "src/bin/sdc-replay.rs"

[[bin]]
name = "sdc-run-timeline"
path = "src/bin/sdc-run-timeline.rs"

[[bin]]
name = "sdc-free-agent"
path = "src/bin/sdc-free-agent.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[workspace]
