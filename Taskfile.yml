version: '3'

tasks:
  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  check:
    desc: "Build, test and lint driver, watch, goals and runbook: the test steps of the driver, of runbook and of ui/ and check:steps (the steps that need no result of a test step), side by side; then the protocol checks (fast lane), bindings and fixture cases. check-protocols.sh and evaluate-cases.sh write protocol/compiled/ by a redirection, which cuts a file to nothing before it is written again, and tests of the driver and of runbook and the servers the UI specs start read those files: the writers start when the readers have ended."
    deps:
      - test:driver
      - test:runbook
      - test:ui
      - check:steps
    cmds:
      - task: check:protocols
      - scripts/check-bindings.sh
      - scripts/evaluate-cases.sh

  check:steps:
    desc: "The steps of task check that need no result of a test step and write nothing a test reads, one after another, beside the test steps: the CI change classifier, the ESS specification and its generated output, the cycles suite, the unreferenced files, build and clippy (warnings denied) of driver, watch, goals and runbook, the tests of watch and goals, and the planning store."
    cmds:
      - task: check:ci-paths
      - task: check:ess-generated
      - task: check:cycles-suite
      - task: check:unreferenced
      - task: check:task-output
      - task: check:crates:lint
      - task: check:crates:test
      - task: plan

  check:crates:lint:
    desc: "Build and clippy (warnings denied) of driver, watch, goals and runbook, one after another (part of check:steps)."
    cmds:
      - '{ for c in driver watch goals runbook; do (cd "$c" && cargo build --locked && cargo clippy --locked --all-targets -- -D warnings) || exit 1; done; } >> /dev/stdout 2>> /dev/stderr'

  check:crates:test:
    desc: "The tests of watch and goals with cargo-nextest (part of check:steps)."
    cmds:
      - '{ for c in watch goals; do (cd "$c" && cargo nextest run --locked --color never) || exit 1; done; } >> /dev/stdout 2>> /dev/stderr'

  test:ui:
    silent: true
    dir: ui
    desc: "The UI test step (the gate lane of ui/, `task test` there): Playwright, four workers, 60 s per test, 120 s for the run (the run fails past it), the ten slowest tests printed. Runs npm ci when ui/node_modules is missing. The specs write their run directories under ui/target/fixture-runs; scripts/check-tree-links.sh then fails on a link outside a target/ directory that a copy of the tree cannot follow. The slow lane stays `task slow` in ui/. Playwright writes its output and its errors into a pipe of its own that cat drains: node turns a pipe it writes to non-blocking, and with the pipe of `task check` shared the other steps beside it lost output (cat of a nextest log stopped at a write that would block, with its summary and ten slowest). Every step of `task check` that prints the output of a runner opens the output again for one command or one group (`>> /dev/stdout`, `{ ...; } >> /dev/stdout 2>> /dev/stderr`): an open file of its own, which stays blocking whatever turns the shared one non-blocking. Never by `exec` with redirections only: go-task 3.52, the forge's, closes that file at the end of its line (check:task-output). The forge does not run this step: at its CPU count the run does not end within 120 s (docs/forge-gate.md; the OUTSIDE line of check:ci-paths). UI_TEST_FORGE=1 runs it here on the first FORGE_CPUS CPUs (`taskset`), the way test:runbook measures the forge, and prints the load average before and after; with `CI` set Playwright starts without the `slot` prefix (the forge has no pool)."
    vars:
      FORGE_CPUS: 2
    cmds:
      - '[ -d node_modules ] || npm ci --no-audit --no-fund'
      - cargo build --locked --bin runbook --manifest-path ../runbook/Cargo.toml
      - |
        {
        set -u
        set -o pipefail
        pool=slot
        limit=""
        if [ -n "${CI:-}" ]; then
          pool=""
        elif [ -n "${UI_TEST_FORGE:-}" ]; then
          limit="taskset -c 0-$(({{.FORGE_CPUS}} - 1))"
        fi
        echo "playwright, 4 workers${limit:+, held to {{.FORGE_CPUS}} CPUs by $limit}; load average $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        code=0
        $pool $limit npx playwright test --workers=4 2>&1 | cat || code=$?
        echo "load average after the run: $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        exit $code
        } >> /dev/stdout 2>> /dev/stderr
      - ../scripts/check-tree-links.sh

  test:loom-real:
    desc: "Slow lane of runbook/: the stub cycle through runbook run on the real b10x-loom (no model call, scripted approvals, confinement local) compared with the committed driver summary; needs RUNBOOK_LOOM_BIN (the real binary) and RUNBOOK_LOOM_WORK (a directory outside the repository), takes minutes, run it in the background."
    requires:
      vars: [RUNBOOK_LOOM_BIN, RUNBOOK_LOOM_WORK]
    env:
      RUNBOOK_LOOM_BIN: "{{.RUNBOOK_LOOM_BIN}}"
      RUNBOOK_LOOM_WORK: "{{.RUNBOOK_LOOM_WORK}}"
      SLOT_TIMEOUT: 30m
    cmds:
      - cd driver && cargo build --locked
      - cd runbook && cargo test --locked --test cli the_stub_cycle_on_the_real_loom -- --ignored

  test:engine-real:
    desc: "Slow lane of runbook/: the sdc stub cycle through the daemon over the in-process Loom engine (runbook::engine) on the repository's own protocols and bindings, confinement local, no model call, every approval scripted; then `runbook parity summarize` of its tree status against the driver summary (printed, not asserted). Needs RUNBOOK_ENGINE_WORK (a directory outside the repository); builds the driver for the bound programs; takes minutes, run it in the background."
    requires:
      vars: [RUNBOOK_ENGINE_WORK]
    env:
      RUNBOOK_ENGINE_WORK: "{{.RUNBOOK_ENGINE_WORK}}"
      SLOT_TIMEOUT: 30m
    cmds:
      - cd driver && cargo build --locked
      - cd runbook && PATH="$PWD/../driver/target/debug:$PATH" cargo test --locked --test cli the_stub_cycle_through_the_engine -- --ignored --nocapture

  test:cycles-loom:
    desc: "Slow lane: the finding cycles of cycles/tree-suite.yaml through `runbook test` (Loom's run_suite in the runbook process), confinement local, no model call and no build: the `slot` first on the PATH of the bound programs is sdc-recorded-pool, which answers their build and test commands from cycles/recorded/ (a command with no recording is a program error; `task test:cycles-record` records it). Builds the driver binaries and runbook first. Prints one line per cycle, the ten slowest and `N of M as expected, P pending`. ONLY=<name>[,<name>...] runs named cycles. Start it in the background, not under `slot`: it waits on the bound programs (docs/cycles-suite.md)."
    env:
      SLOT_TIMEOUT: 30m
    cmds:
      - cd driver && cargo build --locked --bins
      - cd goals && cargo build --locked
      - cd runbook && cargo build --locked --bin runbook
      - mkdir -p driver/target/cycles-pool && ln -sfn ../debug/sdc-recorded-pool driver/target/cycles-pool/slot && rm -f driver/target/cycles-pool/record
      - PATH="$PWD/driver/target/cycles-pool:$PWD/driver/target/debug:$PATH" RUNBOOK_HOME="$PWD" runbook/target/debug/runbook test cycles/tree-suite.yaml --confinement local {{if .ONLY}}--only {{.ONLY}}{{end}}

  test:cycles-record:
    desc: "Slow lane that writes cycles/recorded/: test:cycles-loom with sdc-recorded-pool in record mode, so a build or test command of a bound program that has no recording runs through the next `slot` on PATH in a copy of its tree under target/cycles-recording/ and its output is written as the recording. Run it after a change to a tree a cycle builds (a fixture, a seed, a stub writer) and commit the new files; a cycle that records several commands can end on Loom's 60 s bound, then run it again. ONLY=<name>[,<name>...] as there. Start it in the background, not under `slot` (docs/cycles-suite.md)."
    env:
      SLOT_TIMEOUT: 30m
    cmds:
      - cd driver && cargo build --locked --bins
      - cd goals && cargo build --locked
      - cd runbook && cargo build --locked --bin runbook
      - mkdir -p driver/target/cycles-record && ln -sfn ../debug/sdc-recorded-pool driver/target/cycles-record/slot && touch driver/target/cycles-record/record
      - PATH="$PWD/driver/target/cycles-record:$PWD/driver/target/debug:$PATH" RUNBOOK_HOME="$PWD" runbook/target/debug/runbook test cycles/tree-suite.yaml --confinement local {{if .ONLY}}--only {{.ONLY}}{{end}}

  test:loom-in-process:
    desc: "Slow lane of runbook/: the sdc stub cycle (stub adapter, scripted approvals, confinement local, no model call) once through `runbook run --loom` (the child binary, default ~/.local/state/runbook/loom/70b0e6e0/b10x-loom, RUNBOOK_LOOM_BIN names another; skipped with a message when absent) and once with Loom as a library (no `--loom`), then `runbook parity summarize --loom-run` of both and `runbook parity compare --product-digests` between them, which must end `parity: identical`. Needs RUNBOOK_LOOM_WORK (a directory outside the repository); builds the driver for the bound programs; takes minutes, run it in the background and without the slot prefix."
    requires:
      vars: [RUNBOOK_LOOM_WORK]
    env:
      RUNBOOK_LOOM_WORK: "{{.RUNBOOK_LOOM_WORK}}"
      SLOT_TIMEOUT: 30m
    cmds:
      - cd driver && cargo build --locked
      - cd runbook && cargo test --locked --test cli the_stub_cycle_through_the_child_and_in_process -- --ignored --nocapture

  test:replay:
    dir: runbook
    desc: "Slow lane of runbook/, not part of `task check`: the nine replay tests of runbook/tests/loom_run/replay.rs that read a run (`#[ignore]`d in the default step), with `--run-ignored only` on the nextest profile `replay`, whose setup step `replay-runs` (runbook/tests/replay-runs.sh) makes six re-drives of the committed stub recording with `runbook run --recorded` once and all at once, in ${XDG_STATE_HOME:-$HOME/.local/state}/runbook/replay-tests (about 90 s on a quiet host, minutes at load; the setup step may take 300 s, a test 60 s); builds the driver binaries and runbook first; no model call; start it in the background and without the slot prefix."
    env:
      SLOT_TIMEOUT: 30m
    cmds:
      - cargo build --locked --manifest-path ../driver/Cargo.toml --bins
      - cargo build --locked --bin runbook
      - cargo nextest run --locked --color never --profile replay --run-ignored only -E 'test(loom_run::replay::replay_) | test(loom_run::replay::rule_approvals) | test(loom_run::replay::review_mode) | test(loom_run::replay::implement_coverage)'

  test:bugfix-slow:
    dir: runbook
    desc: "Slow lane of runbook/, not part of `task check`: the two `#[ignore]`d bug-fix tests of runbook/tests/loom_run/bugfix.rs, `bugfix_from_ticket_ends_fixed_on_a_git_repository_and_a_dirty_one_is_refused` (stub adapter, about 20 s) and `bugfix_from_ticket_with_dry_ends_fixed_and_the_fix_prompt_carries_the_constraints` (the adapter dry: the efforts on the dry commands and the constraints in the fix prompt; 17 to 30 s at load 44 to 45; 49 s and 61.5 s at load 130, where the runner's 60 s kill can end it), with `--run-ignored only` on the default nextest profile (a test over 60 s is killed and fails); builds the driver binaries and runbook first; no model call; start it in the background and without the slot prefix."
    env:
      SLOT_TIMEOUT: 30m
    cmds:
      - cargo build --locked --manifest-path ../driver/Cargo.toml --bins
      - cargo build --locked --bin runbook
      - cargo nextest run --locked --color never --run-ignored only -E 'test(loom_run::bugfix::bugfix_from_ticket_)'

  test:install:
    desc: "Slow lane of runbook/, not part of `task check`: `scripts/install.sh --prefix runbook/target/install-slow` with the real `--release` build (runbook, the driver programs a run starts, sdc-watch), then the four `#[ignore]`d tests of runbook/tests/install/slow.rs: on that prefix `runbook list`, `runbook doctor` and one run with sh programs only, and on the prefix of the fast lane (the debug builds, `--from-built debug`, made first here) the acceptance run `runbook run sdc --dry --intake <file>` from an empty directory with `<prefix>/bin` and the system directories on PATH, which ends as the same run of the checkout build. No model call. A release build takes minutes at load: start it in the background and without the slot prefix (cargo takes a slot through the shim)."
    env:
      SLOT_TIMEOUT: 30m
    cmds:
      - cargo build --locked --manifest-path watch/Cargo.toml
      - cargo build --locked --manifest-path driver/Cargo.toml --bins
      - cargo build --locked --manifest-path runbook/Cargo.toml --bins
      - mkdir -p runbook/target/install-slow
      - scripts/install.sh --prefix "$PWD/runbook/target/install-slow"
      - cd runbook && RUNBOOK_INSTALLED_PREFIX="$PWD/target/install-slow" cargo test --locked --test cli install::slow -- --ignored

  test:driver:
    silent: true
    dir: driver
    desc: "Test driver/ with cargo-nextest (driver/.config/nextest.toml): a test over 60 s is killed and fails, the ten slowest tests are printed, the step fails when the test run takes over 120 s (SDC_TEST_BUDGET_SECONDS moves the 120). The build is not counted. The forge runs this same task (.github/workflows/pages.yml, after steps that install the pinned ess with `sdc-conform ess-install` and the pinned aep with `sdc-conform aep-install`) with the nextest profile `forge` (4 test threads, the thread count of its 4-CPU runner; `CI` set picks it; a NEXTEST_TEST_THREADS of the environment does not apply to it). DRIVER_TEST_FORGE=1 runs the profile `forge` here on the first FORGE_CPUS CPUs (`taskset`), as RUNBOOK_TEST_FORGE does for runbook/: 78 to 87 s on 2 CPUs of the build node (docs/forge-gate.md). Other work on those CPUs slows the run: it prints the load average before and after. Like test:runbook it puts the traps `ess` and `aep` of scripts/host-tool-traps first on the PATH of its tests: the forge has neither on PATH. Ahead of them it puts the directory of the pinned aep (driver/aep-pin.json, `sdc-conform aep-path`), the planning store the programs under test call; without it the step stops with the install command. Needs cargo-nextest, the pinned ess, the pinned aep and, for DRIVER_TEST_FORGE, taskset."
    vars:
      FORGE_CPUS: 2
    cmds:
      - cargo nextest run --locked --color never --no-run
      - |
        {
        set -u
        log=target/nextest-driver.log
        code=0
        trap_dir=$(cd ../scripts/host-tool-traps && pwd)
        if ! aep_bin=$(cargo run --locked --quiet --bin sdc-conform -- aep-path); then
          echo "the driver tests run the pinned aep of driver/aep-pin.json, never the aep on PATH: install it with \`cargo run --locked --manifest-path driver/Cargo.toml --bin sdc-conform -- aep-install\`"
          exit 1
        fi
        aep_dir=$(dirname "$aep_bin")
        echo "aep of the tests: $aep_bin (driver/aep-pin.json)"
        profile=default
        limit=""
        if [ -n "${CI:-}" ]; then
          profile=forge
        elif [ -n "${DRIVER_TEST_FORGE:-}" ]; then
          profile=forge
          limit="taskset -c 0-$(({{.FORGE_CPUS}} - 1))"
        fi
        if [ "$profile" = forge ]; then unset NEXTEST_TEST_THREADS; fi
        echo "nextest profile $profile${limit:+, held to {{.FORGE_CPUS}} CPUs by $limit}; test threads ${NEXTEST_TEST_THREADS:-of the profile}; load average $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        PATH="$aep_dir:$trap_dir:$PATH" $limit cargo nextest run --locked --color never --profile "$profile" > "$log" 2>&1 || code=$?
        cat "$log"
        echo "load average after the run: $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        echo "ten slowest tests:"
        awk '/^ +(PASS|FAIL|TIMEOUT) +\[/ { match($0, /\[ *[0-9.]+s\]/); t = substr($0, RSTART + 1, RLENGTH - 3); gsub(/ /, "", t); n = $0; sub(/^.*\] +(\([^)]*\) +)?/, "", n); print t "s " n }' "$log" | sort -rn | uniq | head -10
        secs=$(sed -n 's/^ *Summary \[ *\([0-9.]*\)s\].*/\1/p' "$log" | tail -1)
        budget=${SDC_TEST_BUDGET_SECONDS:-120}
        if [ -z "$secs" ]; then echo "no nextest summary: the test run did not finish"; exit 1; fi
        if awk -v s="$secs" -v b="$budget" 'BEGIN { exit !(s > b) }'; then echo "the test run took ${secs}s, over the ${budget}s budget"; exit 1; fi
        echo "test run ${secs}s of ${budget}s"
        exit $code
        } >> /dev/stdout 2>> /dev/stderr

  test:runbook:
    silent: true
    dir: runbook
    desc: "Test runbook/ with cargo-nextest (runbook/.config/nextest.toml): a test over 60 s is killed and fails, the ten slowest tests are printed, the step fails when the test run takes over 120 s (SDC_TEST_BUDGET_SECONDS moves the 120). The build is not counted. The forge runs this same task (.github/workflows/pages.yml) with the nextest profile `forge` (4 test threads, the thread count of its 4-CPU runner; `CI` set picks it; a NEXTEST_TEST_THREADS of the environment, such as the build pool's, does not apply to it). RUNBOOK_TEST_FORGE=1 runs the profile `forge` here on the first FORGE_CPUS CPUs (`taskset`), so a local run meets the budget as the forge does: the forge's step took 123 s where 2 CPUs of the build node took 127 s and all of its 64 CPUs 91 s, at the same 4 threads. Other work on those CPUs slows the run: it prints the load average before and after. The tests run with the preload tests/nosync (LD_PRELOAD, built here first): their syncs return at once, so the durable writes of the product into the tests' homes under target/ flush nothing to the disk. Needs cargo-nextest and, for RUNBOOK_TEST_FORGE, taskset."
    vars:
      FORGE_CPUS: 2
    cmds:
      - cargo build --locked --manifest-path ../watch/Cargo.toml
      - cargo build --locked --manifest-path ../driver/Cargo.toml --bins
      - cargo build --locked --manifest-path tests/nosync/Cargo.toml
      - cargo nextest run --locked --color never --no-run
      - |
        {
        set -u
        log=target/nextest-runbook.log
        code=0
        trap_dir=$(cd ../scripts/host-tool-traps && pwd)
        nosync=$(pwd)/tests/nosync/target/debug/libnosync.so
        preload=${LD_PRELOAD:-}
        if [ -f "$nosync" ]; then
          if [ -n "$preload" ]; then preload="$nosync $preload"; else preload=$nosync; fi
        else
          echo "no $nosync (a CARGO_TARGET_DIR of the environment?): the tests' syncs reach the disk"
        fi
        profile=default
        limit=""
        if [ -n "${CI:-}" ]; then
          profile=forge
        elif [ -n "${RUNBOOK_TEST_FORGE:-}" ]; then
          profile=forge
          limit="taskset -c 0-$(({{.FORGE_CPUS}} - 1))"
        fi
        if [ "$profile" = forge ]; then unset NEXTEST_TEST_THREADS; fi
        echo "nextest profile $profile${limit:+, held to {{.FORGE_CPUS}} CPUs by $limit}; test threads ${NEXTEST_TEST_THREADS:-of the profile}; load average $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        PATH="$trap_dir:$PATH" LD_PRELOAD="$preload" $limit cargo nextest run --locked --color never --profile "$profile" > "$log" 2>&1 || code=$?
        cat "$log"
        echo "load average after the run: $(cut -d ' ' -f 1-3 /proc/loadavg 2>/dev/null)"
        echo "ten slowest tests:"
        awk '/^ +(PASS|FAIL|TIMEOUT) +\[/ { match($0, /\[ *[0-9.]+s\]/); t = substr($0, RSTART + 1, RLENGTH - 3); gsub(/ /, "", t); n = $0; sub(/^.*\] +(\([^)]*\) +)?/, "", n); print t "s " n }' "$log" | sort -rn | uniq | head -10
        secs=$(sed -n 's/^ *Summary \[ *\([0-9.]*\)s\].*/\1/p' "$log" | tail -1)
        budget=${SDC_TEST_BUDGET_SECONDS:-120}
        if [ -z "$secs" ]; then echo "no nextest summary: the test run did not finish"; exit 1; fi
        if awk -v s="$secs" -v b="$budget" 'BEGIN { exit !(s > b) }'; then echo "the test run took ${secs}s, over the ${budget}s budget"; exit 1; fi
        echo "test run ${secs}s of ${budget}s"
        exit $code
        } >> /dev/stdout 2>> /dev/stderr

  check:ci-paths:
    silent: true
    desc: "Feed the change classifier of .github/workflows/pages.yml one file list per case: planning, docs-site, code, mixed, empty. Then the local gate equals the forge: each test step of task check (a `test:` dep) has a step `run: task <name>` in pages.yml or an OUTSIDE line here with the reason it is left out (not both); each such forge step runs for a code change and is skipped for a planning and a docs-site change (its `if:` on the class the classifier gives), names a timeout-minutes no larger than the runbook step's, and its task has the forge's way (`CI` set) and a local forge way (a *_TEST_FORGE variable with taskset). Also fails when a nextest call of this file lacks --color never."
    cmds:
      - |
        set -eu
        step=$(awk '
          /- name: Classify the changed files$/ { f = 1; next }
          f && !r && /run: \|$/ { r = 1; i = match($0, /[^ ]/); next }
          r && /^ *$/ { print ""; next }
          r { j = match($0, /[^ ]/); if (j <= i) exit; print substr($0, i + 2) }
        ' .github/workflows/pages.yml)
        test -n "$step" || { echo "no classifier step in .github/workflows/pages.yml"; exit 1; }
        fail=0 n=0
        while IFS='|' read -r want files; do
          n=$((n + 1))
          got=$(printf '%s' "$files" | tr ' ' '\n' | CHANGED_FILES= GITHUB_OUTPUT=/dev/stdout bash -c "$step" | sed -n 's/^class=//p')
          if [ "$got" = "$want" ]; then echo "ok   $want <- ${files:-(none)}"; else echo "FAIL $want <- ${files:-(none)}: got ${got:-nothing}"; fail=1; fi
        done <<'CASES'
        planning|.engineering/planning/story/x.md
        planning|.engineering/planning/project.yaml
        planning|README.md AGENTS.md docs/driver.md ui/README.md
        docs-site|website/docs/index.md
        docs-site|website/src/pages/index.tsx
        docs-site|CHANGELOG.md
        docs-site|docs/releases/0.2.1.md
        docs-site|experiments/INDEX.md experiments/releases.yaml
        docs-site|docs/progress.json docs/img/progress.svg docs/check-output.txt
        docs-site|.engineering/planning/story/x.md README.md website/docs/run-it.md
        code|driver/src/bin/sdc-node.rs
        code|Taskfile.yml
        code|.github/workflows/pages.yml
        code|docs/img/other.svg
        code|README.md driver/src/lib.rs
        code|website/docs/index.md scripts/check-bindings.sh
        planning|docs/x.md
        code|instructions/x.md
        code|instructions/golden/decider/x.md README.md
        code|bindings/tools/sdc-tool.sh
        code|bindings/PENDING.md
        code|cycles/tree-suite.yaml
        code|views/sdc.view.json
        code|
        CASES
        classify() { printf '%s' "$1" | tr ' ' '\n' | CHANGED_FILES= GITHUB_OUTPUT=/dev/stdout bash -c "$step" | sed -n 's/^class=//p'; }
        runs_for() {
          case "$1" in
          "steps.changes.outputs.class == '"*"'") v=${1#*"== '"}; v=${v%"'"}; [ "$2" = "$v" ] && echo yes || echo no ;;
          "steps.changes.outputs.class != '"*"'") v=${1#*"!= '"}; v=${v%"'"}; [ "$2" != "$v" ] && echo yes || echo no ;;
          *) echo unknown ;;
          esac
        }
        ci=$(awk '
          function emit() { if (run ~ /^task test:[a-z:-]+$/) print substr(run, 6) "|" cond "|" tmo }
          /^      - / { emit(); run = ""; cond = ""; tmo = "" }
          /^        if: / { cond = $0; sub(/^        if: /, "", cond) }
          /^        timeout-minutes: / { tmo = $2 }
          /^        run: / { run = $0; sub(/^        run: /, "", run) }
          END { emit() }
        ' .github/workflows/pages.yml)
        gate=$(awk '
          /^  check:$/ { c = 1; next }
          c && /^  [^ ]/ { exit }
          c && /^    deps:$/ { d = 1; next }
          c && d && /^      - test:/ { print $2; next }
          c && d && !/^      - / { d = 0 }
        ' Taskfile.yml)
        outside=$(cat <<'OUTSIDE'
        test:ui|at the forge's CPU count its run does not end within 120 s: 550 to 587 of 611 tests on 2 CPUs of the build node (docs/forge-gate.md)
        OUTSIDE
        )
        rb_tmo=$(printf '%s\n' "$ci" | sed -n 's/^test:runbook|[^|]*|//p')
        code_class=$(classify driver/src/lib.rs)
        planning_class=$(classify .engineering/planning/story/x.md)
        site_class=$(classify website/docs/index.md)
        for t in $gate; do
          n=$((n + 1))
          line=$(printf '%s\n' "$ci" | grep "^$t|" || true)
          out=$(printf '%s\n' "$outside" | grep "^$t|" || true)
          if [ -n "$line" ] && [ -n "$out" ]; then echo "FAIL $t of task check has a forge step and is listed as left out of it"; fail=1; continue; fi
          if [ -n "$out" ]; then echo "ok   $t of task check is left out of the forge: ${out#*|}"; continue; fi
          if [ -z "$line" ]; then echo "FAIL $t of task check has no step \`task $t\` in .github/workflows/pages.yml and no OUTSIDE line with the reason in check:ci-paths"; fail=1; continue; fi
          echo "ok   $t of task check runs on the forge as \`task $t\`"
          cond=$(printf '%s' "$line" | cut -d '|' -f 2)
          tmo=$(printf '%s' "$line" | cut -d '|' -f 3)
          for side in "code|$code_class|yes|driver/src/lib.rs" "planning|$planning_class|no|.engineering/planning/story/x.md" "docs-site|$site_class|no|website/docs/index.md"; do
            n=$((n + 1))
            name=${side%%|*}; rest=${side#*|}; class=${rest%%|*}; rest=${rest#*|}; want=${rest%%|*}; file=${rest#*|}
            got=$(runs_for "$cond" "$class")
            if [ "$got" = "$want" ]; then
              echo "ok   the forge step of $t $( [ "$want" = yes ] && echo runs || echo is skipped ) for a $name change ($file -> $class)"
            else
              echo "FAIL the forge step of $t ($cond) answers $got for a $name change ($file -> $class), want $want"; fail=1
            fi
          done
          n=$((n + 1))
          if [ -n "$tmo" ] && [ -n "$rb_tmo" ] && [ "$tmo" -le "$rb_tmo" ]; then
            echo "ok   the forge step of $t names timeout-minutes $tmo, no more than the runbook step's $rb_tmo"
          else
            echo "FAIL the forge step of $t names timeout-minutes '${tmo}', want one no larger than the runbook step's '${rb_tmo}'"; fail=1
          fi
          n=$((n + 1))
          body=$(awk -v t="  $t:" '$0 == t { f = 1; next } f && /^  [^ ]/ { exit } f' Taskfile.yml)
          if printf '%s' "$body" | grep -q 'CI:-' && printf '%s' "$body" | grep -q '_TEST_FORGE:-' && printf '%s' "$body" | grep -q 'taskset'; then
            echo "ok   $t has the forge's way (CI set) and a local forge way (*_TEST_FORGE, taskset)"
          else
            echo "FAIL $t lacks the forge's way (\${CI:-}) or a local forge way (\${*_TEST_FORGE:-} with taskset)"; fail=1
          fi
        done
        n=$((n + 1))
        bare=$(grep -n 'cargo nextest [r]un' Taskfile.yml | grep -v -e '--color never' || true)
        if [ -z "$bare" ]; then echo "ok   every nextest call of Taskfile.yml has --color never"; else echo "FAIL a nextest call without --color never (the forge sets CARGO_TERM_COLOR=always and the tasks parse the log):"; echo "$bare"; fail=1; fi
        echo "$n cases"
        exit $fail

  check:task-output:
    desc: "Part of task check, no network (about 4 s): fails on `exec` with redirections only in Taskfile.yml or ui/Taskfile.yml (the interpreter of go-task 3.52, the release the forge installs, closes the file that form opens at the end of its line and the block writes on into the closed file, so not one line after it reached the forge's log), then runs test:driver, test:runbook and test:ui of a copy of this Taskfile in target/task-output with stand-ins for cargo, npx, slot and check-tree-links.sh the way of task check: under the go-task that runs it, side by side with a node process on their shared output, which node makes non-blocking, read late; and counts the runner lines, the summary, the ten slowest and the budget line that arrive. The forge's way is check:task-output:forge."
    cmds:
      - task: task-output
        vars: { FORGE: "" }

  check:task-output:forge:
    desc: "Not part of task check; run it when a shell block of Taskfile.yml or ui/Taskfile.yml changes (about 8 s, fetches go-task once): check:task-output, and test:driver, test:runbook, test:ui, check:crates:lint and check:crates:test of the copy the forge's way: go-task of the TASK_VERSION of .github/workflows/pages.yml, fetched once into target/forge-task/<version> and checked against its TASK_SHA256, CI set, stdout and stderr each a pipe read by a process of its own; and the way of task check under that go-task too."
    cmds:
      - task: task-output
        vars: { FORGE: "1" }

  task-output:
    silent: true
    internal: true
    cmds:
      - |
        {
        forge_lane="{{.FORGE}}"
        set -eu
        set -o pipefail
        root=$PWD
        wf=.github/workflows/pages.yml
        pin=$(sed -n 's/^ *TASK_VERSION: *"\([0-9.]*\)" *$/\1/p' "$wf")
        sum=$(sed -n 's/^ *TASK_SHA256: *\([0-9a-f]\{64\}\) *$/\1/p' "$wf")
        if [ -z "$pin" ] || [ -z "$sum" ]; then echo "FAIL no TASK_VERSION and TASK_SHA256 of go-task in $wf"; exit 1; fi
        fail=0 n=0
        n=$((n + 1))
        bad=$(grep -nE '(^|[^[:alnum:]_-])exe[c] +[0-9]*[<>]' Taskfile.yml ui/Taskfile.yml || true)
        if [ -z "$bad" ]; then
          echo "ok   no exec with redirections only in Taskfile.yml and ui/Taskfile.yml"
        else
          echo "FAIL exec with redirections only (go-task $pin, the forge's, closes that file at the end of the line; open the output for a group instead: { ...; } >> /dev/stdout 2>> /dev/stderr):"
          echo "$bad"
          fail=1
        fi
        here={{.TASK_EXE}}
        command -v "$here" > /dev/null 2>&1 || here=task
        dir=$root/target/forge-task/$pin
        forge=$dir/task
        if [ -n "$forge_lane" ] && [ ! -x "$forge" ]; then
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --output "$dir/task.tar.gz" "https://github.com/go-task/task/releases/download/v$pin/task_linux_amd64.tar.gz" || { echo "FAIL could not fetch go-task $pin, the release $wf installs"; exit 1; }
          echo "$sum  $dir/task.tar.gz" | sha256sum --check --strict --status || { echo "FAIL $dir/task.tar.gz is not the TASK_SHA256 of $wf"; exit 1; }
          tar -xzf "$dir/task.tar.gz" -C "$dir" task
        fi
        sb=$root/target/task-output
        mkdir -p "$sb/bin" "$sb/driver/target" "$sb/runbook/target" "$sb/watch" "$sb/goals" "$sb/ui/node_modules" "$sb/scripts/host-tool-traps"
        cp Taskfile.yml "$sb/Taskfile.yml"
        cat > "$sb/bin/cargo" <<'STUB'
        #!/bin/sh
        tag=${PWD##*/}
        case " $* " in
        *" --no-run "*) echo "stub $tag no-run" ;;
        *" nextest run "*)
          i=0
          while [ -n "${STUB_READY:-}" ] && [ ! -e "$STUB_READY" ] && [ "$i" -lt 200 ]; do sleep 0.05; i=$((i + 1)); done
          awk -v n="$STUB_LINES" -v t="$tag" 'BEGIN { for (i = 1; i <= n; i++) print "stub " t " " i }'
          echo "        PASS [   0.010s] stub::$tag"
          echo "     Summary [   1.000s] 1 test run: 1 passed, 0 skipped"
          ;;
        *) echo "stub $tag cargo $1" ;;
        esac
        STUB
        cat > "$sb/bin/npx" <<'STUB'
        #!/bin/sh
        awk -v n="$STUB_LINES" 'BEGIN { for (i = 1; i <= n; i++) print "stub ui " i }'
        echo "stub ui end"
        STUB
        printf '#!/bin/sh\nexec "$@"\n' > "$sb/bin/slot"
        printf '#!/bin/sh\necho "stub links"\n' > "$sb/scripts/check-tree-links.sh"
        chmod +x "$sb/bin/cargo" "$sb/bin/npx" "$sb/bin/slot" "$sb/scripts/check-tree-links.sh"
        cat > "$sb/Probe.yml" <<'PROBE'
        version: '3'
        includes:
          gate: ./Taskfile.yml
        tasks:
          node:
            silent: true
            cmds:
              - node -e 'process.stdout.write(""); require("fs").writeFileSync(process.env.STUB_READY, ""); setTimeout(() => {}, 2000)'
          steps:
            cmds:
              - task: gate:test:driver
              - task: gate:test:runbook
              - task: gate:test:ui
          check:
            deps: [node, steps]
        PROBE
        want() {
          got=$(grep -cE "$2" "$1" || true)
          if [ "$got" -ne "$3" ]; then echo "     $4: $got of $3 lines"; miss=1; fi
        }
        verdict() {
          n=$((n + 1))
          if [ "$code" -ne 0 ]; then echo "     exit $code"; miss=1; fi
          if [ "$miss" = 0 ]; then echo "ok   $1"; return; fi
          echo "FAIL $1 (the output: $2)"
          if [ -s "$3" ]; then echo "     its stderr ends:"; tail -n 3 "$3" | sed 's/^/       /'; fi
          fail=1
        }
        [ -p "$sb/err.fifo" ] || mkfifo "$sb/err.fifo"
        lanes="test:driver test:runbook test:ui check:crates:lint check:crates:test"
        bins=$here
        if [ -n "$forge_lane" ]; then bins="$here $forge"; else lanes=""; fi
        for t in $lanes; do
          out=$sb/forge-$t.out
          cat "$sb/err.fifo" > "$sb/forge-$t.err" &
          code=0
          (cd "$sb" && CI=true STUB_LINES=500 PATH="$sb/bin:$PATH" "$forge" --taskfile Taskfile.yml "$t" 2> err.fifo | cat > "$out") || code=$?
          wait
          miss=0
          case $t in
          test:driver)
            want "$out" '^stub driver [0-9]+$' 500 "runner lines"
            want "$out" '^ten slowest tests:$' 1 "ten slowest"
            want "$out" '^0\.010s stub::driver$' 1 "slowest test"
            want "$out" '^test run 1\.000s of 120s$' 1 "budget line" ;;
          test:runbook)
            want "$out" '^nextest profile forge; ' 1 "profile line"
            want "$out" '^stub runbook [0-9]+$' 500 "runner lines"
            want "$out" '^ten slowest tests:$' 1 "ten slowest"
            want "$out" '^0\.010s stub::runbook$' 1 "slowest test"
            want "$out" '^test run 1\.000s of 120s$' 1 "budget line" ;;
          test:ui)
            want "$out" '^stub ui [0-9]+$' 500 "runner lines"
            want "$out" '^stub ui end$' 1 "last runner line"
            want "$out" '^stub links$' 1 "link check" ;;
          check:crates:lint)
            want "$out" '^stub (driver|watch|goals|runbook) cargo (build|clippy)$' 8 "build and clippy lines" ;;
          check:crates:test)
            want "$out" '^stub (watch|goals) [0-9]+$' 1000 "runner lines" ;;
          esac
          verdict "forge way, go-task $pin, CI set, $t: every line arrives" "$out" "$sb/forge-$t.err"
        done
        k=0
        for bin in $bins; do
          k=$((k + 1))
          ver=$("$bin" --version 2>/dev/null | head -n 1)
          out=$sb/check-$k.out
          rm -f target/task-output/node.ready
          code=0
          (cd "$sb" && STUB_LINES=200000 STUB_READY="$sb/node.ready" PATH="$sb/bin:$PATH" "$bin" --taskfile Probe.yml check 2> "$sb/check-$k.err" | { i=0; while [ ! -e node.ready ] && [ "$i" -lt 200 ]; do sleep 0.05; i=$((i + 1)); done; sleep 0.5; cat > "$out"; }) || code=$?
          miss=0
          want "$out" '^stub driver [0-9]+$' 200000 "driver runner lines"
          want "$out" '^stub runbook [0-9]+$' 200000 "runbook runner lines"
          want "$out" '^stub ui [0-9]+$' 200000 "ui runner lines"
          want "$out" '^test run 1\.000s of 120s$' 2 "budget lines"
          want "$out" '^stub links$' 1 "link check"
          verdict "task check way, go-task $ver, the three test steps beside node on a shared output read late: every line arrives" "$out" "$sb/check-$k.err"
        done
        echo "$n cases"
        exit $fail
        } >> /dev/stdout 2>> /dev/stderr

  check:cycles-suite:
    desc: "Run `runbook check` on this checkout (RUNBOOK_HOME overrides the root): the text layout, bindings, instruction files, views, and cycles/tree-suite.yaml against the list of the old entries (cycles/old-suite-names.txt) and the table of docs/cycles-suite.md."
    cmds:
      - cd runbook && cargo build --locked --quiet --bin runbook
      - RUNBOOK_HOME="${RUNBOOK_HOME:-$PWD}" runbook/target/debug/runbook check

  check:unreferenced:
    desc: "List the tracked files of scripts/, bindings/, instructions/, cycles/, cases/, tools/, watch/, views/, decision/, goals/, eval/ and driver/tests/fixtures/ that no other file refers to (under 2 s); exit 1 when there are any. The rules: `sdc-check-unreferenced --help`; files kept on purpose: driver/unreferenced-keep.txt; directories read whole: driver/unreferenced-whole.txt. Before a deletion, `driver/target/debug/sdc-check-unreferenced --without <paths>` lists what the deletion leaves unreferenced."
    cmds:
      - cd driver && cargo build --locked --quiet --bin sdc-check-unreferenced
      - driver/target/debug/sdc-check-unreferenced

  check:ess-generated:
    desc: "Validate the ESS specification in ess/ and check that its committed JSON Schema and OpenAPI output, its authored conformance suite and its synthesized conformance suite (the digest of its sources) are current. Every ess command runs inside ess/, where ess-inputs.yaml pins the release (`requires: ess 0.98.0`); from the repository root the ess dispatcher does not switch to it."
    dir: ess
    cmds:
      - ess specify validate --path .
      - ess generate --path . --kind schema --schema-id-base https://sdc.invalid/ --out generated/schema --check
      - ess generate --path . --kind openapi --out generated/openapi --check
      - task: check:ess-suite
      - task: check:ess-suite:synthesized

  ess-suite:digest:
    silent: true
    desc: "Print the digest of the sources of the committed conformance suite: the sha256 of every file of ess/system.yaml, ess/components.yaml, ess/ess-inputs.yaml (its `requires: ess <version>` line is the pin), ess/domains/ and ess/scenarios/. It runs no ess: the host's binary does not enter the digest; ess-suite:pin refuses a binary that is not the pin."
    cmds:
      - |
        set -eu
        { find ess/system.yaml ess/components.yaml ess/ess-inputs.yaml ess/domains ess/scenarios -type f | LC_ALL=C sort | while read -r f; do echo "$f $(sha256sum < "$f" | cut -d' ' -f1)"; done; } | sha256sum | cut -d' ' -f1

  ess-suite:pin:
    silent: true
    desc: "Print the ess release pinned by the `requires: ess <version>` line of ess/ess-inputs.yaml; exit 1 with one line naming both versions when the ess that runs in ess/ (last line of `ess --version`, so a dispatcher that delegates counts as the release it delegates to) is not that release. The slow lane and ess-suite:record run it first."
    cmds:
      - |
        set -eu
        pin=$(sed -n 's/^requires: ess //p' ess/ess-inputs.yaml)
        if [ -z "$pin" ]; then echo "ess/ess-inputs.yaml has no requires: ess line"; exit 1; fi
        have=$(cd ess && ess --version 2>/dev/null | tail -n 1)
        if [ "$have" != "ess $pin" ]; then
          echo "the ess that runs in ess/ prints \"${have:-nothing}\" but ess/ess-inputs.yaml pins ess $pin: install that release; a suite of another release is neither recorded nor compared under the pin's digest"
          exit 1
        fi
        echo "$pin"

  check:ess-suite:
    silent: true
    dir: ess
    desc: "Fast check (about 1 s): the committed suite of the authored scenarios, ess/generated/conformance/authored.json, is byte for byte what `ess verify conform author` writes from ess/. The crate test runs it against the daemon."
    cmds:
      - |
        set -eu
        out=$(mktemp)
        trap 'rm -f "$out"' EXIT
        ess verify conform author --path . --scenarios . --out "$out" > /dev/null 2>&1
        if ! cmp -s "$out" generated/conformance/authored.json; then
          echo "ess/generated/conformance/authored.json is stale: run task ess-suite:authored and commit it"
          exit 1
        fi
        echo "ess authored conformance suite current"

  ess-suite:authored:
    dir: ess
    desc: "Write ess/generated/conformance/authored.json from the authored scenarios (about 1 s)."
    cmds:
      - mkdir -p generated/conformance
      - ess verify conform author --path . --scenarios . --out generated/conformance/authored.json

  check:ess-suite:synthesized:
    silent: true
    desc: "Fast check (about 1 s, part of check:ess-generated): the digest of the sources equals the one recorded in ess/generated/conformance/DIGEST and suite.json is the file recorded. It never synthesizes; task ess-suite:record does."
    cmds:
      - |
        set -eu
        dir=ess/generated/conformance
        want=$(task --silent ess-suite:digest)
        have=$(sed -n 's/^sources //p' "$dir/DIGEST")
        suite=$(sha256sum < "$dir/suite.json" | cut -d' ' -f1)
        if [ "$want" != "$have" ]; then
          echo "$dir/suite.json is stale: the specification, the scenarios or ess changed (sources $want, recorded ${have:-none}); run task ess-suite:record in the background and commit $dir"
          exit 1
        fi
        if [ "$suite" != "$(sed -n 's/^suite //p' "$dir/DIGEST")" ]; then
          echo "$dir/suite.json is not the file $dir/DIGEST records (edited by hand?); run task ess-suite:record"
          exit 1
        fi
        echo "ess conformance suite current (sources $want)"

  check:ess-suite:slow:
    dir: ess
    desc: "Slow lane (ess 0.98.0 synthesizes it in under a minute of wall time; the 1,048 s of 0.97.1 and its failure to finish in 1,800 s were fixed in 0.97.3): synthesize the suite from the sources for real and compare it byte for byte with ess/generated/conformance/suite.json. Not part of task check; run it in the background when the specification, the scenarios or ess changed. The command names 30m with `slot --timeout`. It refuses first when the ess that runs in ess/ is not the pin (ess-suite:pin)."
    cmds:
      - task: ess-suite:pin
      - slot --timeout 30m ess verify conform synthesize --path . --scenarios . --target ir --out generated/conformance/suite.json --check

  ess-suite:record:
    dir: ess
    desc: "Synthesize the conformance suite from the sources (under a minute with ess 0.98.0, run it in the background) and write ess/generated/conformance/suite.json and DIGEST; commit both. It refuses first when the ess that runs in ess/ is not the pin (ess-suite:pin)."
    cmds:
      - task: ess-suite:pin
      - mkdir -p generated/conformance
      - slot --timeout 30m ess verify conform synthesize --path . --scenarios . --target ir --out generated/conformance/suite.json
      - |
        set -eu
        dir=generated/conformance
        printf 'sources %s\nsuite %s\n' "$(task --silent --taskfile ../Taskfile.yml ess-suite:digest)" "$(sha256sum < "$dir/suite.json" | cut -d' ' -f1)" > "$dir/DIGEST"
        echo "written ess/$dir/suite.json and ess/$dir/DIGEST"

  check:protocols:
    desc: Validate, compile, check, probe and simulate the nine protocols from protocol/check-ledger.json (fast lane, 120 s budget; re-checks a protocol whose sources changed).
    cmds:
      - scripts/check-protocols.sh

  check:protocols:slow:
    desc: Re-run every protocol check for real and compare the ledger byte for byte (slow lane; run it in the background when the protocols, the Canon pin or the script changed).
    cmds:
      - scripts/check-protocols.sh --slow

  docs:generate:
    desc: Write the site's protocol data, website/data/protocols/, from the protocols and their bindings.
    cmds:
      - cd driver && cargo build --locked --bin sdc-protocol-site
      - driver/target/debug/sdc-protocol-site write --root .

  docs:build:
    desc: Build the documentation site into website/build, and the fixture build into website/build-fixture.
    dir: website
    cmds:
      - npm ci
      - env -u SDC_SITE_FIXTURES npm run build
      - "! grep -rlq --include='*.html' data-sdc-fixture-build build"
      - "! grep -rlq -e fixture-free-agent -e fixture-cost-target -e 'fixture: three releases' build"
      - SDC_SITE_FIXTURES=tests/fixtures/ledger npx docusaurus build --out-dir build-fixture

  docs:test:
    desc: "Smoke test of the built site: every page at 1440 and 390 px in both themes, axe, internal links, the fixture build. Playwright serves build/ on 127.0.0.1:7591 and build-fixture/ on 7592 for the run only (SDC_DOCS_SITE_PORT, SDC_DOCS_FIXTURE_PORT move them). Four workers, 60 s per test, 120 s for the run, the ten slowest tests printed; run it as `slot --tokens 4 task docs:test`."
    dir: website
    cmds:
      - '[ -d node_modules ] || npm ci --no-audit --no-fund'
      - npx playwright install chromium
      - npx playwright test --workers=4

  docs:
    desc: Check the site data is current, build the site and run its smoke test.
    cmds:
      - cd driver && cargo build --locked --bin sdc-protocol-site
      - driver/target/debug/sdc-protocol-site check --root .
      - task: docs:build
      - task: docs:test

  release:check:
    desc: "Check that a release is prepared: task release:check VERSION=0.1.0."
    requires:
      vars: [VERSION]
    cmds:
      - |
        for f in driver/Cargo.toml watch/Cargo.toml goals/Cargo.toml runbook/Cargo.toml; do
          grep -qx 'version = "{{.VERSION}}"' "$f" || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        for f in driver/Cargo.lock watch/Cargo.lock goals/Cargo.lock; do
          grep -A1 '^name = "sdc-' "$f" | grep -qx 'version = "{{.VERSION}}"' || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        grep -A1 '^name = "runbook"$' runbook/Cargo.lock | grep -qx 'version = "{{.VERSION}}"' || { echo "runbook/Cargo.lock is not at {{.VERSION}}"; exit 1; }
        grep -q '"version": "{{.VERSION}}"' ui/package.json || { echo "ui/package.json is not at {{.VERSION}}"; exit 1; }
        for f in plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json; do
          grep -q '"version": "{{.VERSION}}"' "$f" || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        grep -q '^## \[{{.VERSION}}\] - ' CHANGELOG.md || { echo "CHANGELOG.md has no entry for {{.VERSION}}"; exit 1; }
        test -s docs/releases/{{.VERSION}}.md || { echo "docs/releases/{{.VERSION}}.md is missing"; exit 1; }
      - task: plan

  ci:watch:
    desc: "Wait for the forge runs of one commit of beyond10x/runbook and exit non-zero unless every run succeeded: task ci:watch SHA=<commit>."
    requires:
      vars: [SHA]
    env:
      SHA: '{{.SHA}}'
    cmds:
      - |
        set -eu
        printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "SHA must be a full 40-character commit id"; exit 1; }
        runs=$(gh run list --repo beyond10x/runbook --commit "$SHA" --limit 100 --json databaseId --jq '.[].databaseId')
        test -n "$runs" || { echo "no workflow runs for $SHA in beyond10x/runbook"; exit 1; }
        fail=0
        for id in $runs; do
          gh run watch "$id" --repo beyond10x/runbook --exit-status > /dev/null || true
          conclusion=$(gh run view "$id" --repo beyond10x/runbook --json conclusion --jq .conclusion)
          echo "run $id: ${conclusion:-unknown}"
          case "$conclusion" in success | skipped) ;; *) fail=1 ;; esac
        done
        exit $fail
