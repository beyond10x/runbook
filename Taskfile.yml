version: '3'

tasks:
  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  check:
    desc: Build, test and lint driver, watch and goals; bindings, fixture cases and the planning store.
    cmds:
      - for c in driver watch goals; do (cd "$c" && cargo build --locked && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings) || exit 1; done
      - scripts/check-bindings.sh
      - scripts/evaluate-cases.sh
      - task: plan

  check:protocols:
    desc: Compile and simulate the nine protocols (about 12 minutes; run it in the background).
    cmds:
      - scripts/check-protocols.sh

  docs:generate:
    desc: Write the site's protocol data, website/data/protocols/, from the protocols and their bindings.
    cmds:
      - cd driver && cargo build --locked --bin sdc-protocol-site
      - driver/target/debug/sdc-protocol-site write --root .

  docs:build:
    desc: Build the documentation site into website/build, and the fixture build into website/build-fixture.
    dir: website
    cmds:
      - npm ci
      - env -u SDC_SITE_FIXTURES npm run build
      - "! grep -rlq --include='*.html' data-sdc-fixture-build build"
      - "! grep -rlq -e fixture-free-agent -e 'fixture: three releases' build"
      - SDC_SITE_FIXTURES=tests/fixtures/ledger npx docusaurus build --out-dir build-fixture

  docs:test:
    desc: "Smoke test of the built site: every page at 1440 and 390 px in both themes, axe, internal links, the fixture build. Playwright serves build/ on 127.0.0.1:7591 and build-fixture/ on 7592 for the run only (SDC_DOCS_SITE_PORT, SDC_DOCS_FIXTURE_PORT move them)."
    dir: website
    cmds:
      - npx playwright install chromium
      - npx playwright test --workers=2

  docs:
    desc: Check the site data is current, build the site and run its smoke test.
    cmds:
      - cd driver && cargo build --locked --bin sdc-protocol-site
      - driver/target/debug/sdc-protocol-site check --root .
      - task: docs:build
      - task: docs:test

  release:check:
    desc: "Check that a release is prepared: task release:check VERSION=0.1.0."
    requires:
      vars: [VERSION]
    cmds:
      - |
        for f in driver/Cargo.toml watch/Cargo.toml goals/Cargo.toml; do
          grep -qx 'version = "{{.VERSION}}"' "$f" || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        for f in driver/Cargo.lock watch/Cargo.lock goals/Cargo.lock; do
          grep -A1 '^name = "sdc-' "$f" | grep -qx 'version = "{{.VERSION}}"' || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        grep -q '"version": "{{.VERSION}}"' ui/package.json || { echo "ui/package.json is not at {{.VERSION}}"; exit 1; }
        for f in plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json; do
          grep -q '"version": "{{.VERSION}}"' "$f" || { echo "$f is not at {{.VERSION}}"; exit 1; }
        done
        grep -q '^## \[{{.VERSION}}\] - ' CHANGELOG.md || { echo "CHANGELOG.md has no entry for {{.VERSION}}"; exit 1; }
        test -s docs/releases/{{.VERSION}}.md || { echo "docs/releases/{{.VERSION}}.md is missing"; exit 1; }
      - task: plan
