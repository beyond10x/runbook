format: sdc.goals/1
layer: product
requester: beyond10x
entries:
  - {id: product/p01, kind: constraint, statement: "The product contains no Python and its executable code is Rust.", sources: ["sdc/eval/personas/beyond10x/goals.company.yaml:5"], derived_from: [company/c01, company/c02], valid_from: 2026-11-21}
  - {id: product/p02, kind: preference, priority: 2, statement: "The product ships as one self-contained executable with few dependencies.", sources: ["sdc/docs/driver.md:49"], derived_from: [company/c02, company/c28], valid_from: 2026-11-21}
  - {id: product/p03, kind: principle, priority: 1, statement: "User data stays on the user's own machine, in a local data file; no third-party cloud, account or mail service unless the idea names one.", sources: ["sdc/docs/trial-2.md:16"], derived_from: [company/c13], valid_from: 2026-11-21}
  - {id: product/p04, kind: principle, priority: 2, statement: "In the test version, sign-in checks a username and password against a fixed map of usernames to password hashes; there is no registration and no mail.", sources: ["sdc/runs/trial-2-train/store/IDEA-1/children/IDEA-1.intake/work/questions.yaml:35"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: product/p05, kind: constraint, statement: "Passwords are stored and compared only as secure hashes, never in plaintext.", sources: ["sdc/runs/trial-2-train/store/IDEA-1/children/IDEA-1.intake/work/questions.yaml:35"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: product/p06, kind: principle, priority: 2, statement: "The fixed username map is for the test version only; production sign-in is not decided by these goals.", sources: ["sdc/runs/trial-2-train/store/IDEA-1/children/IDEA-1.intake/work/questions.yaml:72"], valid_from: 2026-11-21}
  - {id: product/p07, kind: goal, priority: 1, statement: "Where the idea is a to-do app it is multi-user: each user signs in and has several lists of their own, a list has several items, and an item has a state.", sources: ["sdc/runs/trial-2-train/store/IDEA-1/children/IDEA-1.intake/work/questions.yaml:11"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: product/p08, kind: constraint, statement: "The product has an ESS specification with conformance scenarios and one observable command per acceptance, and it passes before the product counts as done.", sources: ["sdc/eval/personas/beyond10x/goals.company.yaml:8", "sdc/eval/personas/beyond10x/goals.company.yaml:9"], derived_from: [company/c04, company/c05], valid_from: 2026-11-21}
  - {id: product/p09, kind: preference, priority: 2, statement: "A web tool is one local daemon that serves its UI and a JSON API on its own port.", sources: ["sdc/docs/trial-2.md:16"], valid_from: 2026-11-21}
  - {id: product/p10, kind: principle, priority: 2, statement: "The product does only what the idea names; a question the idea and these goals leave open takes the request's default and is listed for the person, not asked again and not silently widened.", sources: ["surf/AGENTS.md:16", "sdc/docs/requester.md:26"], derived_from: [company/c18, company/c28, company/c29], valid_from: 2026-11-21}
