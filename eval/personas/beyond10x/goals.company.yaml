format: sdc.goals/1
layer: company
requester: beyond10x
entries:
  - {id: company/c01, kind: constraint, statement: "No file of a deliverable is Python: not the code, a test, a script, a gate or a command suggested to a person.", sources: ["surf/AGENTS.md:68", "ess/AGENTS.md:23", "connectors/AGENTS.md:129"], stated: {by: operator, at: 2026-11-20}, valid_from: 2026-11-21}
  - {id: company/c02, kind: principle, priority: 1, statement: "Anything that runs is a Rust binary with clap for its command line.", sources: ["canon/AGENTS.md:28"], valid_from: 2026-11-21}
  - {id: company/c03, kind: preference, priority: 3, statement: "Glue that is not a product may be bash and jq.", sources: ["sdc/AGENTS.md:34"], valid_from: 2026-11-21}
  - {id: company/c04, kind: constraint, statement: "Everything is specified in ESS before it is built: a new noun, field or command is in the specification before code or stories rest on it.", sources: ["aep:initiative:governed-autonomy@4", "surf/AGENTS.md:3"], valid_from: 2026-11-21}
  - {id: company/c05, kind: principle, priority: 1, statement: "A deliverable is verified by its ESS conformance scenarios and one observable command; a passing ESS gate, not a claim, marks the specification complete.", sources: ["sdc/docs/phases.md:5"], valid_from: 2026-11-21}
  - {id: company/c06, kind: principle, priority: 2, statement: "Order of work is specification first, then a failing test, then the implementation that makes it pass without changing the specification.", sources: ["canon/AGENTS.md:53", "loom/AGENTS.md:215"], valid_from: 2026-11-21}
  - {id: company/c07, kind: constraint, statement: "What is permitted, required, admissible and complete is decided by deterministic protocol evaluation, never by a model.", sources: ["aep:vision:governed-autonomy@4"], valid_from: 2026-11-21}
  - {id: company/c08, kind: constraint, statement: "An LLM is only the executor of one action; its output is an artifact revision, never evidence and never the next state.", sources: ["sdc/AGENTS.md:11", "sdc/docs/driver.md:5"], valid_from: 2026-11-21}
  - {id: company/c09, kind: constraint, statement: "Missing or stale evidence is reported as unknown and never counts as passing.", sources: ["aep:vision:governed-autonomy@4", "canon/AGENTS.md:25"], valid_from: 2026-11-21}
  - {id: company/c10, kind: constraint, statement: "Work counts as done only on typed, attributable evidence; a log or trace of what happened is not evidence.", sources: ["aep:vision:governed-autonomy@4"], valid_from: 2026-11-21}
  - {id: company/c11, kind: constraint, statement: "An agent changes the world only through authority declared before the run and checked at the call; a call outside it is refused by name.", sources: ["aep:vision:O1@4", "aep/.engineering/planning/vision/O1.md:18"], valid_from: 2026-11-21}
  - {id: company/c12, kind: principle, priority: 2, statement: "Rules, state and method are declared as data and executed by the component that owns them, and a claim carries the evidence behind it.", sources: ["aep:vision:O2@4", "aep/.engineering/planning/vision/O2.md:18"], valid_from: 2026-11-21}
  - {id: company/c13, kind: constraint, statement: "Nothing is published, pushed, tagged, deployed or released outside the operator's machine without the operator's explicit request.", sources: ["connectors/AGENTS.md:17", "surf/AGENTS.md:80"], valid_from: 2026-11-21}
  - {id: company/c14, kind: constraint, statement: "Public source carries no personal identity, former organisation, employer or predecessor provenance, and never the denylist or its findings.", sources: ["atlas-adr:0018", "atlas-adr:0048"], valid_from: 2026-11-21}
  - {id: company/c15, kind: constraint, statement: "Tenant, realm, authority and executor never come from a URL, query, body or caller-set header; authentication supplies them before the input is decoded.", sources: ["aep:initiative:ess-service-construction@4"], valid_from: 2026-11-21}
  - {id: company/c16, kind: principle, priority: 1, statement: "Every factual claim cites its source (file:line, command output or who said it), and what was not observed is labelled inferred.", sources: ["sdc/AGENTS.md:46"], valid_from: 2026-11-21}
  - {id: company/c17, kind: principle, priority: 1, statement: "Every approval or decision comes with options, a recommendation and the grounds for it, taken from a vision, a previous decision, a PRD or a story.", sources: ["sdc/docs/decisions.md:6"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: company/c18, kind: goal, priority: 1, statement: "Fewer human interventions and longer autonomous runs per task: define more upfront or decide by agent on the way, and ask a person only where nothing else can answer.", sources: ["sdc/docs/trial-2.md:3", "sdc/docs/kpis.md:240"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: company/c19, kind: principle, priority: 2, statement: "Consequential steps (merge, release, close) stop for an explicit approval that names who gave it.", sources: ["aep:vision:governed-autonomy@4", "sdc/docs/trial-1.md:85"], valid_from: 2026-11-21}
  - {id: company/c20, kind: principle, priority: 2, statement: "Finish what is started before starting more: open work trees and in-progress items stay within limits that a program enforces, not a model.", sources: ["sdc/docs/orchestration.md:177", "sdc/docs/kpis.md:277"], stated: {by: operator, at: 2026-11-21}, valid_from: 2026-11-21}
  - {id: company/c21, kind: principle, priority: 2, statement: "The same input gives the same output byte for byte, and generated sources are drift-checked against their specification.", sources: ["canon/AGENTS.md:26", "aep:initiative:ess-service-construction@4"], valid_from: 2026-11-21}
  - {id: company/c22, kind: goal, priority: 1, statement: "From intent to verified outcome: agents choose how to do the work, and the organisation defines what must be true before the work counts.", sources: ["aep:vision:governed-autonomy@4"], valid_from: 2026-11-21}
  - {id: company/c23, kind: goal, priority: 3, statement: "Every component records what it did, so that improvements can be proposed from a run's record, landed and re-measured with before and after in the record.", sources: ["aep:vision:O6@4", "aep/.engineering/planning/vision/O6.md:18"], valid_from: 2026-11-21}
  - {id: company/c24, kind: goal, priority: 2, statement: "A harness is driven from outside, its run is recorded in one vocabulary, and it is scored on the same work as another.", sources: ["aep:vision:O3@4", "aep/.engineering/planning/vision/O3.md:18"], valid_from: 2026-11-21}
  - {id: company/c25, kind: goal, priority: 3, statement: "A person can sign up, configure agents, workflows, data sources and connectors, and see how the work is being done.", sources: ["aep:vision:O5@4", "aep/.engineering/planning/vision/O5.md:18"], valid_from: 2026-11-21}
  - {id: company/c27, kind: principle, priority: 2, statement: "Rigour an outside reader can check outranks reach and adoption.", sources: ["aep:initiative:provable-lead@4"], valid_from: 2026-11-21}
  - {id: company/c28, kind: principle, priority: 2, statement: "A feature is specified only when a slice needs it; nothing is built for a need nobody named.", sources: ["surf/AGENTS.md:16", "surf/AGENTS.md:8"], stated: {by: operator, at: 2026-11-20}, valid_from: 2026-11-21}
  - {id: company/c29, kind: principle, priority: 2, statement: "An open question stays open and visible; no plausible value is filled in for it.", sources: ["surf/AGENTS.md:60"], valid_from: 2026-11-21}
