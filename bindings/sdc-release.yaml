format: loom.bindings/1
protocol: sdc-release@4
program_root: bindings
artifacts:
  spec: spec
  release: release
actions:
  - action: spec.gate
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, ess-gate, --action, spec.gate]
    exits: {error: [75, 126, 127]}
    timeout_seconds: 1800
    evidence:
      - kind: ess_gate
        subject: spec
        producer: ess
        from: exit
        results: {"0": passed, "*": failed}
  - action: release.build
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, release-build, --action, release.build]
    exits: {error: [75, 126, 127]}
    evidence:
      - kind: build_provenance
        subject: release
        producer: runbook.build
        from: exit
        results: {"0": null}
  - action: acceptance.run
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, conform-run, release, --action, acceptance.run, --pool-wait, "1200"]
    exits: {error: [69, 70, 75, 126, 127]}
    timeout_seconds: 2400
    evidence:
      - kind: release_conformance
        subject: release
        producer: ess
        from: exit
        results: {"0": passed, "*": failed}
        upstream: [spec]
  - action: release.publish
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, publish, --action, release.publish]
    exits: {error: [75, 126, 127]}
    evidence:
      - kind: release_record
        subject: release
        producer: runbook.deploy
        from: exit
        results: {"0": null}
  - action: release.observe
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, observe, --action, release.observe]
    exits: {error: [75, 126, 127]}
    evidence:
      - kind: health_observation
        subject: release
        producer: runbook.monitor
        from: exit
        results: {"0": healthy, "*": unhealthy}
