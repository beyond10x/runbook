format: loom.bindings/1
protocol: sdc-story@1
artifacts:
  spec: spec
  change: impl
  findings: findings.yaml
  requirements: requirements.yaml
independence:
  llm-review: [different_principal]
actions:
  - action: spec.gate
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/sdc-tool.sh, ess-gate]
    timeout_seconds: 1800
    evidence:
      - kind: ess_gate
        subject: spec
        producer: ess
        from: exit
        results: {"0": passed, "*": failed}
  - action: change.implement
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/llm-node.sh, change.implement]
    budget: {max_runs: 3}
    timeout_seconds: 1500
    retry_when:
      conformance_run: [failed]
      code_review: [rejected]
      merge_approval: [rejected]
    evidence:
      - kind: implementation_change
        subject: change
        producer: llm-node
        from: exit
        results: {"0": null}
        upstream: [spec]
  - action: tests.run
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/sdc-tool.sh, story-tests, impl]
    timeout_seconds: 1800
    evidence:
      - kind: conformance_run
        subject: change
        producer: ess
        from: exit
        results: {"0": passed, "5": finding, "*": failed}
        upstream: [spec]
  - action: change.review
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/llm-node.sh, change.review]
    budget: {max_runs: 3}
    timeout_seconds: 900
    evidence:
      - kind: code_review
        subject: change
        producer: llm-review
        from: exit
        results: {"0": approved, "1": rejected}
  - action: merge.approve
    executor:
      kind: person
      principal: person:owner
    evidence:
      - kind: merge_approval
        subject: change
        producer: person:owner
        from: effect
        results: {performed: approved}
  - action: change.merge
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/sdc-tool.sh, merge]
    evidence:
      - kind: merge_record
        subject: change
        producer: sdc-drive.merge
        from: exit
        results: {"0": null}
  - action: amend.upstream
    executor:
      kind: program
      argv: [../driver/examples/sdc/tools/sdc-tool.sh, amend, story]
    budget: {max_runs: 12}
    timeout_seconds: 300
    handoff: "decide the open findings: in findings.yaml of the workspace, for every finding with status needs_person, set `decision:` to one of its options or your own answer and `decided_by: person:<your id>` (the questions and the requirements are amended from it), or set `status: dismissed` when it is no conflict; then run again"
