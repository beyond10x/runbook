format: loom.bindings/1
protocol: sdc-story@8
program_root: bindings
artifacts:
  spec: spec
  change: impl
  findings: findings.yaml
  requirements: requirements.yaml
independence:
  llm-review: [different_principal]
actions:
  - action: spec.gate
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, ess-gate, --action, spec.gate]
    exits: {error: [75, 126, 127]}
    timeout_seconds: 1800
    evidence:
      - kind: ess_gate
        subject: spec
        producer: ess
        from: exit
        results: {"0": passed, "*": failed}
  - action: change.implement
    executor:
      kind: program
      argv: [sdc-node, change.implement, --model, claude-haiku-5-5, --max-turns, "40", --max-budget-usd, "2", --instructions, '{"task":"instructions/change.implement.md","coverage":"instructions/change.implement.coverage.md","coverage_inputs":"instructions/change.implement.coverage.inputs.md"}', --stub, stub-tree, impl, impl]
    exits: {error: [75, 126, 127], not_called: [79]}
    budget: {max_runs: 3, runs_per: rejection, rework_limit: 2, rework_on: {code_review: [rejected], merge_approval: [rejected]}}
    timeout_seconds: 1500
    retry_when:
      implementation_change: [coverage_refused]
      conformance_run: [failed]
      code_review: [rejected]
      merge_approval: [rejected]
    evidence:
      - kind: implementation_change
        subject: change
        producer: llm-node
        from: exit
        results: {"0": null, "8": coverage_refused}
        upstream: [spec]
  - action: tests.run
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, story-tests, impl, --action, tests.run, --pool-wait, "1200"]
    exits: {error: [69, 70, 75, 126, 127]}
    timeout_seconds: 3000
    evidence:
      - kind: conformance_run
        subject: change
        producer: ess
        from: exit
        results: {"0": passed, "5": finding, "*": failed}
        upstream: [spec]
  - action: change.review
    executor:
      kind: program
      argv: [sdc-node, change.review, --model, claude-haiku-5-5, --max-turns, "30", --max-budget-usd, "1", --operations, "dir.list,file.read,search", --instructions, '{"task":"instructions/change.review.md","inputs":"instructions/change.review.inputs.md","coverage_inputs":"instructions/change.review.coverage.inputs.md","coverage_note":"instructions/change.review.coverage-note.md","facts":"instructions/change.review.facts.md","facts_inputs":"instructions/change.review.facts.inputs.md"}', --stub, review-change]
    exits: {error: [75, 126, 127], not_called: [79]}
    budget: {max_runs: 3}
    timeout_seconds: 900
    evidence:
      - kind: code_review
        subject: change
        producer: llm-review
        from: exit
        results: {"0": approved, "1": rejected}
  - action: merge.approve
    executor:
      kind: person
      principal: person:owner
    evidence:
      - kind: merge_approval
        subject: change
        producer: person:owner
        from: effect
        results: {performed: approved, rejected: rejected}
  - action: change.merge
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, merge, --action, change.merge]
    exits: {error: [75, 126, 127]}
    evidence:
      - kind: merge_record
        subject: change
        producer: runbook.merge
        from: exit
        results: {"0": null}
  - action: amend.upstream
    executor:
      kind: program
      argv: [tools/sdc-tool.sh, amend, story, --action, amend.upstream]
    exits: {error: [75, 126, 127]}
    budget: {max_runs: 12}
    timeout_seconds: 300
    handoff: "decide the open findings: in findings.yaml of the workspace, for every finding with status needs_person, set `decision:` to one of its options or your own answer and `decided_by: person:<your id>` (the questions and the requirements are amended from it), or set `status: dismissed` when it is no conflict; then run again"
    handoff_when: [tools/sdc-tool.sh, findings-wait, --action, amend.upstream]
