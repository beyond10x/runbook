format: protocol/1

protocol:
  id: sdc.probe.children
  revision: 1

artifacts:
  spec: {}

evidence_kinds:
  case_outcome: {}

claims:
  stories.delivered:
    true_when:
      children:
        in: [delivered]

actions:
  story.open:
    case_open:
      protocol: sdc.story
      subject: spec

outcomes:
  built:
    requires:
      claim: stories.delivered

invalidation:
  spec.revised:
    upstream: spec
    invalidates:
      - stories.delivered
