format: sdc.releases/1
input:
  name: todo-app
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
  description: a shared to-do list web app that works offline
settings:
- id: haiku
  label: All Haiku
  note: Haiku everywhere, decider too
  match:
    models.writer.model: claude-haiku-5-5
    models.implement.model: claude-haiku-5-5
    models.other.model: claude-haiku-5-5
    decider.model: claude-haiku-5-5
- id: mixed
  label: Sonnet work, Haiku decider
  note: Haiku on the other nodes
  match:
    models.writer.model: claude-sonnet-5-5
    models.implement.model: claude-sonnet-5-5
    models.other.model: claude-haiku-5-5
    decider.model: claude-haiku-5-5
- id: strong
  label: Sonnet work, Opus decider
  note: Sonnet on every node
  match:
    models.writer.model: claude-sonnet-5-5
    models.implement.model: claude-sonnet-5-5
    models.other.model: claude-sonnet-5-5
    decider.model: claude-opus-5-5
- id: sonnet
  label: All Sonnet, Haiku decider
  note: Sonnet on every node
  match:
    models.writer.model: claude-sonnet-5-5
    models.implement.model: claude-sonnet-5-5
    models.other.model: claude-sonnet-5-5
    decider.model: claude-haiku-5-5
- id: opus
  label: Opus work, Haiku decider
  note: Opus on every node
  match:
    models.writer.model: claude-opus-5-5
    models.implement.model: claude-opus-5-5
    models.other.model: claude-opus-5-5
    decider.model: claude-haiku-5-5
limits:
- 'No run starts the delivered product and no oracle check runs: a clean pass is a Canon outcome closed by rule, not a product seen working.'
- Every run so far used the canon binary of the canon checkout at run time, which no record pins.
- 'Every run so far is registered retrospectively: the records were written after the runs, so none of them decides anything.'
