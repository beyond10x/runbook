format: sdc.experiment/1
id: decider-haiku-vs-opus
kind: retrospective
status: complete
created: 2026-11-21
title: Decider model Haiku against Opus with the work on Sonnet
purpose: Whether the decider model changes how often a rejected merge sends a story back to the implementer, read from the trial-3 runs that exist.
inputs:
- name: todo-app
  kind: idea
  text: A to-do list web app for me and my partner that also works on the train without a connection
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
tree_commit: several
trees:
- the runs of trial-3-attempts and trial-3-batch-1; each run's tree is in those records
links:
- experiments/trial-3-attempts.yaml and experiments/trial-3-batch-1.yaml (the runs and their trees)
hypothesis: 'With claude-opus-5-5 instead of claude-haiku-5-5 as the decider and the work on claude-sonnet-5-5, the edge story: merge.approve:rejected -> change.implement occurs at least 1 time fewer per run (median count).'
target:
  kind: edge
  name: 'story: merge.approve:rejected -> change.implement'
variable: decider.model
fixed:
  models.writer.model: claude-sonnet-5-5
  models.implement.model: claude-sonnet-5-5
  models.review.model: claude-sonnet-5-5
  decider.escalate: final
  autonomy: A5
  adapter: metaharness
known_confounds:
- key: models.other.model
  note: the trial-3-mixed runs ran the other class (intake and direction writers) on claude-haiku-5-5, trial-3-sonnet-1 and trial-3-strong on claude-sonnet-5-5
- key: max_llm_calls
  note: 90 in the trial-3-mixed runs, 150 in trial-3-sonnet-1 and trial-3-strong
- key: bindings
  note: the runs read the bindings and tools of two worktrees (sdc-trial-3, sdc-trial-3b) that changed during the day; no run pins a revision of them
- key: order
  note: trial-3-mixed, -2 ran in the morning before the intake and direction fixes; trial-3-mixed and -4 stopped in intake or direction on defects fixed since
variants:
- id: haiku
  settings:
    decider.model: claude-haiku-5-5
  runs:
  - trial-3-sonnet-1
  - trial-3-mixed
  - trial-3-mixed-2
  - trial-3-mixed-3
  - trial-3-mixed-4
  - trial-3-mixed-5
  - trial-3-mixed-6
- id: opus
  settings:
    decider.model: claude-opus-5-5
  runs:
  - trial-3-strong-1
  - trial-3-strong-2
baseline: haiku
treatment: opus
runs_per_variant: 3
pass_rule: clean-delivery
primary:
  metric: 'edge.story: merge.approve:rejected -> change.implement.count'
  direction: decrease
  min_effect: 1
guards:
- metric: run.delivered
  worse: decrease
  max_worsening: 0
- metric: run.cost_usd
  worse: increase
  max_worsening_ratio: 1.0
decision_rule:
  rule: complete-separation
  text: held when each variant has at least 3 finished runs with the metric, every opus run lies below every haiku run and the medians differ by at least 1; contradicted when the ranges separate the other way or by less than 1; inconclusive otherwise. Guards decide adoption, not the verdict.
