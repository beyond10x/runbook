format: sdc.experiment/1
id: review-minimal-facts
kind: prospective
status: planned
created: 2026-11-21
title: change.review on the smallest fact set against the whole change tree, by recorded replay
purpose: Whether the review keeps its decisions when the program gives it the changed files, the story's requirements and commands and the test summary instead of the whole tree and the diff text, at a third of the input.
inputs:
- name: todo-app
  kind: idea
  text: A to-do list web app for me and my partner that also works on the train without a connection
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
tree_commit: 5741425eb35f9517785fa594ba019407a548dacd
fixed:
  models.writer.model: claude-sonnet-5-5
  models.implement.model: claude-sonnet-5-5
  models.review.model: claude-sonnet-5-5
  models.other.model: claude-sonnet-5-5
  decider.kind: model
  decider.model: claude-opus-5-5
  decider.escalate: final
  decider.max_decider_calls: '40'
  decider.adapter: claude-cli
  review.adapter: claude-cli
  adapter: metaharness
  max_llm_calls: '150'
  autonomy: A5
variants:
- id: minimal-facts
  settings: {}
  runs: []
runs_per_variant: 3
pass_rule: clean-delivery
decision_rule:
  rule: descriptive
  text: 'Treatment: story:review-minimal-facts built on the tree of the source runs (tree_commit pinned when it is), the review''s in/ cut to scope.json, the covered entries of commands.json, the changed files of impl/ with line numbers, the changed line ranges and the test summary. One replay of each of release-0.1.2.strong.1, -2 and -3 on that tree, launched by hand: scripts/run-trial.sh review-minimal-facts-<n> --autopilot --recorded runs/release-0.1.2.strong.<n> --on-divergence live --live-adapter claude-cli --live-cap <its review calls>. Every review diverges, because its inputs changed, and goes live on Sonnet; any other live call means a decision differed. Primary: the review''s cache-write tokens per call, from llm-calls.jsonl, against the same calls of the source; registered direction decrease, expected to about a third (33k to 53k now). Pass, per replay: live calls = review calls, every review returns the recorded decision, a rejection names the same requirement ids, sdc-replay compare exits 0. Adopt when all 3 replays pass and the input falls by at least half; any differing decision is published with both replies.'
cost_estimate: 'About 15 live Sonnet review calls at about 12k written tokens each, about 0.05 to 0.08 USD per call: about 1 USD, plus the build of the change. tests.run and the gates run for real, about 10 minutes per replay.'
known_confounds:
- key: tree
  note: the change must be built on the source runs' tree 72a3eef; a replay on a later tree diverges at other calls as well.
- key: same-model
  note: Sonnet in both, so a differing decision is the inputs' doing or Sonnet's own variance; three replays of one source would separate the two, at three times the cost.
facts:
- 'experiments/baseline-0.1.0/inputs.md: the review is one request with no tools; in/impl/ is the whole tree (24 KB at the first story of trial-0.1.0-strong-1, 84 KB at its fourth) plus change.diff (24 to 26 KB); 0.69 USD of a strong run''s 0.80 review USD is input.'
- 'Expected saving per run: strong 0.46, mixed 0.36 USD (inferred, input to a third).'
links:
- 'experiments/baseline-0.1.0/inputs.md: the fact sets and the ranking'
- 'experiments/review-haiku-replay.yaml: the review class on Haiku, the same replay method'
