format: sdc.experiment/1
id: review-haiku-replay
kind: prospective
status: planned
created: 2026-11-21
title: change.review on Haiku against the recorded Sonnet reviews of a strong run, by recorded replay
purpose: Whether the review class can move from Sonnet to Haiku (0.75 to about 0.04 USD per strong run) without changing a review decision, tested on recorded inputs before any full run.
inputs:
- name: todo-app
  kind: idea
  text: A to-do list web app for me and my partner that also works on the train without a connection
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
tree_commit: 72a3eefb20e0edff50dc8ad12fcf561f8e0790e3
fixed:
  models.writer.model: claude-sonnet-5-5
  models.implement.model: claude-sonnet-5-5
  models.other.model: claude-sonnet-5-5
  decider.kind: model
  decider.model: claude-opus-5-5
  decider.escalate: final
  decider.max_decider_calls: '40'
  decider.adapter: claude-cli
  review.adapter: claude-cli
  adapter: metaharness
  max_llm_calls: '150'
  autonomy: A5
  flags.recorded: release-0.1.2.strong.1
variants:
- id: haiku-review
  settings:
    models.review.model: claude-haiku-5-5
  runs:
  - review-haiku-replay-1
  - review-haiku-replay-2
  - review-haiku-replay-3
runs_per_variant: 3
pass_rule: clean-delivery
decision_rule:
  rule: descriptive
  text: 'Three replays of release-0.1.2.strong.1 (tree 72a3eef, its 5 change.review calls on Sonnet), each with change.review on Haiku and every other call recorded. Launched by hand, not by sdc-experiment run, which passes no divergence policy: SDC_LLM_MODEL_REVIEW=claude-haiku-5-5 scripts/run-trial.sh review-haiku-replay-<n> --autopilot --recorded runs/release-0.1.2.strong.1 --on-divergence live --live-adapter claude-cli --live-cap 5 (experiments/baseline-0.1.0/models.md). Every review call diverges, because the model is part of the request digest, and goes live; any other live call means a review decision differed and sent the run down another path. Pass, per replay: live calls = review calls, every live review returns the recorded decision, a rejection names the same requirement ids, and sdc-replay compare exits 0. Passed in all 3 replays: a full-run record with models.review.model claude-haiku-5-5 against release-0.1.2 strong follows. Any decision differs: the differing reviews are listed with both replies, and the review class stays on Sonnet until the review gets its smallest fact set (record review-minimal-facts) and is tested again. Not decided here: review quality where both models agree on a wrong decision.'
cost_estimate: About 15 live Haiku review calls. On recorded inputs each prompt is 33k to 121k tokens; above 100K Haiku costs five times as much, so under 0.2 USD (inferred). The recorded calls are free; tests.run and the gates run for real, about 10 minutes per replay.
known_confounds:
- key: tree
  note: the replay must run on the source's tree 72a3eef; on a later tree a changed input diverges and goes live as well, which this record counts as a differing decision.
- key: prompt-size
  note: the fourth and fifth reviews of a strong run pass 100K tokens, where Haiku's long-prompt price applies and its quality on long prompts is untested.
- key: one-source
  note: one source run, so the 3 replays measure Haiku's agreement on the same 5 inputs, not over different runs.
facts:
- 'experiments/baseline-0.1.0/models.md: review per strong run 0.75 USD on Sonnet; 5 rejections in three strong runs, all real gaps; Haiku reviews of trial-0.1.0-haiku-1 rejected 3 times, real; never compared on the same inputs.'
- The merge decider sees the review as change.reviewed true in checks.json, not its findings (release-0.1.2.strong.1, decider/009-merge.approve), so an agreeing review leaves later inputs as recorded (inferred).
links:
- 'experiments/baseline-0.1.0/models.md: the per-class table and the replay design'
- 'experiments/baseline-0.1.0/costs.md: the budget and the target'
- 'experiments/release-0.1.2.yaml: the source run'
