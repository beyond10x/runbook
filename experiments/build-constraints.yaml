format: sdc.experiment/1
id: build-constraints
kind: prospective
status: planned
created: 2026-11-21
title: Build constraints known to every stage (fix/superseded-answers on 0.1.2, 3ca26fe), Haiku and mixed against the release-0.1.2 runs
purpose: Whether one run file of build constraints, read by the writers and the decider and held by requirements.check and the decider's answer check, raises the Haiku setting's clean passes and lowers change.implement reruns against the same settings on 0.1.2.
inputs:
- name: todo-app
  kind: idea
  text: A to-do list web app for me and my partner that also works on the train without a connection
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
tree_commit: 3ca26fee9a874cba6b0f7707d73a51af1f734df2
fixed:
  decider.kind: model
  decider.escalate: final
  decider.max_decider_calls: '40'
  decider.adapter: claude-cli
  adapter: metaharness
  autonomy: A5
  max_llm_calls: '150'
  max_wall_seconds: '5400'
  review.adapter: claude-cli
variants:
- id: haiku
  settings:
    models.writer.model: claude-haiku-5-5
    models.implement.model: claude-haiku-5-5
    models.review.model: claude-haiku-5-5
    models.other.model: claude-haiku-5-5
    decider.model: claude-haiku-5-5
  runs: []
- id: mixed
  settings:
    models.writer.model: claude-sonnet-5-5
    models.implement.model: claude-sonnet-5-5
    models.review.model: claude-sonnet-5-5
    models.other.model: claude-haiku-5-5
    decider.model: claude-haiku-5-5
  runs: []
runs_per_variant: 3
pass_rule: clean-delivery
control:
  record: release-0.1.2
  variants:
  - haiku
  - mixed
  tree_commit: 72a3eefb20e0edff50dc8ad12fcf561f8e0790e3
  note: The control arm is the haiku and mixed runs of release-0.1.2, same input and settings, on the 0.1.2 tree that 3ca26fe is built on; sdc-experiment cannot hold a control from another record (a record names one tree), so it reports this record as descriptive and the comparison below is made from the two reports.
decision_rule:
  rule: descriptive
  text: 'Treatment (this record, tree 3ca26fe) against control (release-0.1.2, haiku and mixed, tree 72a3eef), per setting, n = 3 against n = 3, directions registered here before any treatment run. A difference is claimed only when the two ranges separate completely in the registered direction (exact one-sided p = 1/20); overlapping ranges claim no effect. Primary 1: run.clean of the haiku setting, direction increase: held only when all 3 treatment runs are clean and no control run is; any other count is inconclusive or no move and is published as such. Primary 2: node.story/change.implement.rework_takes per run, direction decrease, judged per setting (haiku, mixed); a run that never took change.implement has no value and is listed, not counted. The two primaries are judged separately and no combined claim is made from them (two tests: one holding by chance is more likely than 1/20). Secondary, reported and not decided: the count of stops with cause writer_spent, and the count of change.implement and merge.approve rejections whose reason names a language, a dependency or a stored technology. Guards, against the control per setting: run.delivered (worse when lower), run.cost_usd (worse when higher by more than half the control median), run.decider_calls and the decision classes'' invalid_replies (worse when higher; the new decider answer check is expected to add some, reported with their reasons), run.wall_s (worse when higher by more than half the control median). Adopt (merge fix/superseded-answers-0.1.2) only when a primary holds and every guard holds; a refuted or inconclusive result is published as such.'
predictions:
- id: P1
  setting: haiku
  metric: run.clean
  direction: increase
  why: the constraints reach idea.dissect, questions.write, questions.answer, requirements.normalise, context.default, spec.author and change.implement, so a default against them (haiku-1's Postgres) should not arise in the first place.
- id: P2
  setting: haiku, mixed
  metric: node.story/change.implement.rework_takes
  direction: decrease
  why: fewer review, gate and merge rejections caused by a language or dependency mismatch.
- id: P3
  setting: haiku, mixed
  metric: stops with cause writer_spent
  direction: decrease
  why: secondary.
- id: P4
  setting: haiku, mixed
  metric: decision invalid_replies, run.decider_calls
  direction: increase
  why: the new cost of the change; a guard, not a goal.
- id: P0
  setting: all
  metric: all of the above
  direction: none
  why: the honest alternative, that nothing moves; see the registered doubt.
registered_doubt: 'This branch would not have caught the q9 case of trial-0.1.0-haiku-1 by program. There spec.author raised finding f8 with the default "Postgres database" and the non-interactive rule accepted it (work/questions.yaml: answered_by non-interactive); no decider saw it. At 3ca26fe answer_fault is called only from tools/decider.sh (sdc-findings check-answer), not on non-interactive defaults; requirements.check''s constraint_fault reads only the declared `language` and `dependencies` fields of a requirement, and haiku-1''s r1 carried Postgres in its text. What could prevent it is the writers'' prompt (spec.author reads the constraints), which is a model''s compliance, not a check. story:default-answers-within-build-constraints is the change that would close it.'
cost_estimate: 'From the baseline-0.1.0 medians: 3 x (0.28 + 2.55) = 8.5 USD; from its maxima 3 x (2.15 + 3.88) = 18.1 USD; plus the decider''s invalid-reply retries (Haiku decider calls cost 0.007 to 0.02 USD each in the baseline) and the Opus unstick calls, unmeasured. About 1 hour at 3 runs at a time; the Haiku runs of the baseline took 938 to 3790 s.'
launch:
  max_parallel: 3
  stagger_s: 30
  principal: agent:sdc-experiment
known_confounds:
- key: control-time
  note: the control runs (release-0.1.2) ran earlier on the same day, before these; the model service, the canon checkout and the machine's load may differ between the two launches.
- key: tree
  note: 3ca26fe is 0.1.2 (72a3eef) plus fix/superseded-answers merged, the decider-constraints cycle's principal fix and the re-packed replay recording; only the merge changes what a run does.
- key: unstick
  note: run.unstick is on with an Opus model in both arms and is no launch setting (scripts/run-trial.sh); an unstuck run is not clean.
- key: canon
  note: the canon binary of the canon checkout at run time, not pinned, in both arms.
- key: control-complete
  note: if release-0.1.2 ends with fewer than 3 ended runs of a setting, that setting's comparison is inconclusive and says so.
facts:
- 'The branch on 0.1.2 passes its cycles: "100 expected, 100 as expected, 0 failed" (head 3ca26fe, reported by the merging session).'
- 'What a run does differently at 3ca26fe: work/build-constraints.yaml in every run, recorded in run-settings.jsonl (`build_constraints`); requirements.check refuses a requirement whose language or dependency contradicts it; the decider gets it on every call but the close, and an answer naming a `ruled_out` entry is refused as an invalid reply and asked again; a contradiction against an answer already resolved re-raises the finding.'
links:
- 'experiments/release-0.1.2.yaml: the control arm'
- 'experiments/baseline-0.1.0/losses.md: haiku-1''s q9 and the loss this change addresses (1.220 USD, 976 s)'
- story:build-constraints-every-stage, story:default-answers-within-build-constraints
