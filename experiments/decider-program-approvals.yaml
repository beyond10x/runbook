format: sdc.experiment/1
id: decider-program-approvals
kind: prospective
status: planned
created: 2026-11-21
title: Approvals taken by program checks under A5 against every approval asked of the decider, strong setting
purpose: Whether taking context.approve, roadmap.approve and release.publish by rule:autopilot when the program check guarding each passed at the exact revision lowers the Opus decider's cost per run without losing a clean pass or letting a merge or review rejection through. The mixed setting is the sibling record decider-program-approvals-mixed (one variable per record).
hypothesis: With SDC_RULE_APPROVALS on instead of off, run.decider_cost_usd of the strong setting falls by at least 0.3 USD per run.
inputs:
- name: todo-app
  kind: idea
  text: A to-do list web app for me and my partner that also works on the train without a connection
  sha256: f384a752a2cb73d09a81c5fc845058149fe3799552e67ec3ad0064c687cc78c4
tree_commit: f2c503bc03d2d51bf563847efccff7a254893e97
target:
  kind: run
  name: run.decider_cost_usd
variable: rule_approvals
fixed:
  models.writer.model: claude-sonnet-5-5
  models.implement.model: claude-sonnet-5-5
  models.review.model: claude-sonnet-5-5
  models.other.model: claude-sonnet-5-5
  decider.kind: model
  decider.model: claude-opus-5-5
  decider.escalate: final
  decider.max_decider_calls: '40'
  decider.adapter: claude-cli
  review.adapter: claude-cli
  efforts.writer.effort: high
  efforts.implement.effort: high
  efforts.review.effort: high
  efforts.other.effort: high
  efforts.decider.effort: xhigh
  adapter: metaharness
  max_llm_calls: '150'
  max_wall_seconds: '5400'
  autonomy: A5
launch:
  max_parallel: 3
  stagger_s: 30
  principal: agent:sdc-experiment
variants:
- id: off
  settings:
    rule_approvals: off
  runs: []
- id: on
  settings:
    rule_approvals: on
  runs: []
baseline: off
treatment: on
runs_per_variant: 3
pass_rule: clean-delivery
primary:
  metric: run.decider_cost_usd
  direction: decrease
  min_effect: 0.3
guards:
- metric: run.delivered
  worse: decrease
  max_worsening: 0
- metric: run.clean
  worse: decrease
  max_worsening: 0
- metric: 'edge.story: merge.approve:rejected -> change.implement.count'
  worse: increase
  max_worsening: 1
- metric: 'edge.story: change.review:rejected -> change.implement.count'
  worse: increase
  max_worsening: 1
decision_rule:
  rule: complete-separation
  text: held when off and on each have 3 ended runs, every on run's run.decider_cost_usd lies below every off run's (exact one-sided p = 1/20 = 0.05) and the medians differ by at least 0.3 USD; contradicted when the ranges separate the other way or by less than 0.3 USD; inconclusive otherwise. Adopt the rule as the default under A5 only when held, every guard holds and the sibling record decider-program-approvals-mixed does not contradict it; a refuted or inconclusive result is published as such.
adoption:
  decision: pending
  commit: null
cost_estimate: '6 runs at the strong median of baseline-0.1.0, 5.50 USD: 33.0 USD; at its maximum 6.19 USD: 37.2 USD; with the mixed sibling (6 runs at 2.55 to 3.88 USD: 15.3 to 23.3 USD) 48.3 to 60.5 USD in all. Expected saving on the on arm: the three covered approvals cost 0.45 to 0.50 USD per strong run in baseline-0.1.0 (of 1.82 to 2.08 USD decider cost), so about 0.48 USD per run, 1.4 USD over three runs (inferred). About 1.5 hours at 3 runs at a time.'
known_confounds:
- key: coverage
  note: vision.approve has no program check (its precondition holds context claims only) and stays with the decider in both arms; merge.approve, scope answers, finding decisions and upstream amendments are asked of the decider in both arms. The rule removes three of the 13 decider calls of a strong run at most.
- key: unstick
  note: run.unstick is on with an Opus model in both variants (scripts/run-trial.sh; not a launch setting); it is the same in both arms, and a run it touched is not clean.
- key: canon
  note: the canon binary of the canon checkout at run time, not pinned; the same for both arms when they run in one launch.
- key: quality
  note: no oracle judges the decider's decisions; the baseline decider approved all of the covered approvals, so the arms differ only if a covered approval would have been rejected, which is seen through the merge and review rejection guards and run.delivered.
facts:
- 'Registered basis: in baseline-0.1.0 (3 strong and 3 mixed runs, plus the earlier trial-3 runs on the same decider), the decider stopped nothing on context.approve, roadmap.approve, vision.approve and release.publish: 25 of 25 approved.'
- 'Decider cost of the covered approvals per strong run in baseline-0.1.0 (decisions.by_action): context.approve 0.138, 0.139, 0.151 USD; roadmap.approve 0.155, 0.179, 0.151 USD; release.publish 0.158, 0.171, 0.195 USD; total 0.451, 0.489, 0.496 USD of 2.03, 2.08, 1.82 USD decider cost per run.'
- The covered approvals per mixed run cost 0.043 to 0.046 USD of 0.17 to 0.25 USD decider cost (Haiku decider).
- 'Not launched: this record is committed before any run; the rule is built and its cycles run on the stub adapter (scripts/run-finding-cycles.sh: rule-approvals, rule-approvals-check-failed, rule-approvals-revision-changed, rule-approvals-off, rule-approvals-a3).'
links:
- 'experiments/decider-program-approvals-mixed.yaml: the mixed setting, primary run.decider_s'
- 'experiments/baseline-0.1.0.yaml: the strong and mixed medians above'
- 'docs/driver.md: Approvals by program'
